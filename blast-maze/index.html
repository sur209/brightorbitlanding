    <div class="langs" id="langs">

      <button type="button" id="snd-btn"></button>

    <p class="best" id="title-best"></p>
    <p class="notice" id="title-notice" role="status"></p>
    <p class="foot" data-t="foot"></p>
  </section>

  <section class="panel wide" id="s-help" hidden>
    <h2 data-t="how_to_play"></h2>
    <div class="help" id="help-body"></div>
    <div class="row"><button class="pri" data-go="title" data-t="back"></button></div>
  </section>

  <section class="panel" id="s-setup" hidden>
    <h2 data-t="setup_title"></h2>
    <div class="slots" id="setup-slots"></div>
    <div class="opt"><span data-t="rounds"></span><div class="seg" id="setup-rounds"></div></div>
    <p class="msg" id="setup-msg" role="status"></p>
    <p class="hint" data-t="ctrl_hint"></p>
    <div class="row"><button class="ghost" data-go="title" data-t="back"></button><button class="pri" id="setup-start" data-t="start"></button></div>
  </section>

  <section class="panel" id="s-room" hidden>
    <h2 id="room-title"></h2>
    <label class="field"><span data-t="your_name"></span><input id="room-name" maxlength="12" autocomplete="off" spellcheck="false"></label>
    <div id="room-codebox" hidden>
      <div class="field"><span data-t="room_code"></span></div>
      <div id="room-code"></div>
      <div class="row"><button id="room-copy" data-t="copy_link"></button><button id="room-share" data-t="share" hidden></button></div>
    </div>
    <form id="join-form" hidden autocomplete="off">

      <button class="pri" type="submit" id="join-btn" data-t="join"></button>

    <p class="msg" id="room-msg" role="status" aria-live="polite"></p>
    <div class="slots" id="room-slots"></div>
    <div id="room-opts" hidden>

    </div>
    <div class="row"><button class="ghost" id="room-cancel" data-t="leave"></button><button class="pri" id="room-start" data-t="start" hidden></button></div>
  </section>

  <section class="panel" id="s-pause" hidden>
    <h2 data-t="pause"></h2>
    <div class="btns"><button class="pri" id="pause-resume" data-t="resume"></button><button class="ghost" id="pause-quit"></button></div>
  </section>

    <div class="btns">

      <button id="over-again" data-t="again"></button>
      <button class="ghost" id="over-menu" data-t="menu"></button>
    </div>
  </section>

  <section class="panel" id="s-match" hidden>
    <h2 id="match-title"></h2>
    <table id="match-table"></table>
    <p class="msg" id="match-msg"></p>
    <div class="row"><button class="ghost" id="match-menu"></button><button class="pri" id="match-again"></button></div>
  </section>
</div>

  peer.on('disconnected', () => { if (NET.peer === peer) { try { peer.reconnect(); } catch (e) { /* nada */ } } });
  peer.on('error', err => {
    if (NET.peer !== peer) return;
    if (err.type === 'unavailable-id' && attempt < 3) { hostRoom(attempt + 1); return; }
    if (NET.guests.length) return;
    if (ovIs('s-room')) roomMsg(netErrorText(err), true);
  });
}
function hostOnMsg(conn, m) {
  if (!m || typeof m !== 'object') return;
  const g = NET.guests.find(q => q.conn === conn);
  switch (m.t) {
    case 'hello': {
      if (g) return;
      if (G.screen !== 'menu' || !ovIs('s-room')) { sendTo(conn, { t: 'busy' }); setTimeout(() => { try { conn.close(); } catch (e) { /* nada */ } }, 500); return; }
      if (NET.guests.length >= 3) { sendTo(conn, { t: 'full' }); setTimeout(() => { try { conn.close(); } catch (e) { /* nada */ } }, 500); return; }
      const nm = cleanName(m.nm) || tr('player', NET.guests.length + 2);
      NET.guests.push({ conn, nm, pi: -1 });
      broadcastLobby(false);
      renderRoom(); roomMsg(tr('guest_joined', nm) + ' ' + tr('waiting_guests'));
      sfx.play('item');
      break; }
    case 'in': {
      if (!g || g.pi < 0) return;
      const p = G.players[g.pi]; if (!p || p.ctrl !== 'net') return;
      p.net.dx = clamp(+m.dx || 0, -1, 1); p.net.dy = clamp(+m.dy || 0, -1, 1);
      if ((m.b | 0) > p.net.b) p.net.b = m.b | 0;
      if ((m.d | 0) > p.net.d) p.net.d = m.d | 0;
      break; }
    case 'q': hostOnClose(conn); break;
  }
}
function hostOnClose(conn) {
  const g = NET.guests.find(q => q.conn === conn); if (!g) return;
  NET.guests = NET.guests.filter(q => q !== g);
  if (G.screen !== 'menu' && g.pi >= 0 && G.players[g.pi]) {
    const p = G.players[g.pi]; p.ctrl = 'cpu'; p.diff = 'normal'; p.connected = false;
    pop(p.x, p.y, tr('guest_left', p.name), '#FFC48A');
  }
  broadcastLobby(false);
  if (ovIs('s-room') && NET.ui === 'host') renderRoom();
  try { conn.close(); } catch (e) { /* nada */ }
}
function startOnline() {
  if (NET.role !== 'host') return;
  const names = lobbyNames(), total = NET.fill ? 4 : names.length;
  if (total < 2) { roomMsg(tr('need_two'), true); return; }
  const ps = [];
  for (let i = 0; i < total; i++) {
    if (i === 0) { const p = makePlayer(0, names[0], 'human'); p.h = 0; ps.push(p); }
    else if (i <= NET.guests.length) { const g = NET.guests[i - 1]; g.pi = i; const p = makePlayer(i, g.nm, 'net'); ps.push(p); }
    else ps.push(makePlayer(i, 'CPU ' + (i + 1), 'cpu', 'normal'));
  }
  const pl = ps.map(p => p.name);
  for (const g of NET.guests) sendTo(g.conn, { t: 'start', you: g.pi, pl });
  NET.events = [];
  newBattle(ps, NET.rounds, true);
}
function backToLobby() {
  setScreen('menu'); G.phase = 'menu'; G.players = []; MB.init = false;
  roomMode('host'); $('room-code').textContent = NET.code; $('room-codebox').hidden = !NET.peer; $('room-share').hidden = !navigator.share;
  show('s-room'); renderRoom(); roomMsg(tr('waiting_guests')); broadcastLobby(true);
}
$('room-start').addEventListener('click', () => { sfx.unlock(); startOnline(); });
$('room-cancel').addEventListener('click', () => { netShutdown(true); toTitle(); });
$('room-copy').addEventListener('click', async () => {
  const link = inviteLink(NET.code);
  try { await navigator.clipboard.writeText(link); roomMsg(tr('link_copied')); } catch (e) { roomMsg(tr('copy_this', link)); }
});
$('room-share').addEventListener('click', async () => { try { await navigator.share({ title: tr('doc_title'), text: `${tr('doc_title')} — ${tr('room_code')}: ${NET.code}`, url: inviteLink(NET.code) }); } catch (e) { /* cancelado */ } });
function buildSnap() {
  const r = Math.round;
  let g = ''; for (let c = 0; c < N; c++) g += G.grid[c] === SOFT ? (G.burn[c] > 0 ? '3' : '2') : String(G.grid[c]);
  const F = [], I = [];
  for (let c = 0; c < N; c++) { if (G.flame[c] > 0) F.push(c, r(G.flame[c] * 100)); if (G.item[c]) I.push(c, G.item[c]); }
  const B = []; for (const b of G.bombs) B.push(r(b.fx * 100), r(b.fy * 100), r(b.fuse * 10), b.owner);
  const P = G.players.map(p => [r(p.x * 100), r(p.y * 100), p.dir, p.alive ? 1 : 0, r(p.deathT * 100), p.moving ? 1 : 0, p.wins, p.maxBombs, p.range, p.speedLv, p.kick ? 1 : 0]);
  const s = { t: 's', ph: G.phase, tm: r(G.time * 10), rd: G.round, sd: G.sdOn ? 1 : 0, bn: G.banner && G.banner.t > 0 ? [G.banner.k, G.banner.a, r(G.banner.t * 10), r(G.banner.dur * 10)] : 0, g, F, I, B, P, ev: NET.events };
  NET.events = [];
  return s;
}
function netTick(dt) {
  if (NET.role === 'host') {
    if (G.screen === 'menu' || !NET.guests.length) { NET.events = []; return; }
    NET.snapAcc += dt;
    if (NET.snapAcc >= 0.05) {
      NET.snapAcc = 0;
      const snap = buildSnap();
      for (const g of NET.guests) { const ch = g.conn && g.conn.dataChannel; if (ch && ch.bufferedAmount > 256 * 1024) continue; sendTo(g.conn, snap); }
    }
  } else if (NET.role === 'guest' && G.screen === 'play') {
    const I = localInput(0, true);
    if (I.bomb && !NET.pb) NET.bN++; if (I.det && !NET.pd) NET.dN++;
    NET.pb = I.bomb; NET.pd = I.det;
    const dx = I.px || I.sx, dy = I.py || I.sy;
    const key = `${I.px},${I.py},${I.sx},${I.sy},${NET.bN},${NET.dN}`;
    NET.sendAcc += dt;
    if (key !== NET.lastIn || NET.sendAcc > 0.25) {
      NET.sendAcc = 0; NET.lastIn = key;
      NET.send({ t: 'in', dx: I.px ? I.px : I.sx * 0.5, dy: I.py ? I.py : I.sy * 0.5, b: NET.bN, d: NET.dN });
      void dx; void dy;
    }
  }
}
/* invitado */
function openJoin(code) {
  netShutdown(false); roomMode('join'); show('s-room');
  $('join-code').value = code || ''; roomMsg(tr('enter_code'));
  if (code) joinRoom(code); else if (!TOUCH.mode) setTimeout(() => $('join-code').focus(), 0);
}
$('join-code').addEventListener('input', e => { e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); });
$('join-form').addEventListener('submit', e => { e.preventDefault(); sfx.unlock(); joinRoom($('join-code').value); });
function joinBusy(b) { $('join-btn').disabled = b; $('join-code').disabled = b; }
async function joinRoom(raw) {
  const code = String(raw || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (code.length !== 5) { roomMsg(tr('enter_code'), true); return; }
  store('blastmaze-name', cleanName($('room-name').value));
  roomMsg(tr('connecting')); joinBusy(true);
  try { await loadPeerJS(); } catch (e) { joinBusy(false); roomMsg(tr('peer_load'), true); return; }
  if (!ovIs('s-room') || NET.ui !== 'join') return;
  netShutdown(false); NET.ui = 'join';
  const peer = new Peer({ debug: 0 }); NET.peer = peer;
  peer.on('open', () => {
    if (NET.peer !== peer) return;
    const conn = peer.connect(PEER_PREFIX + code, { reliable: true, serialization: 'json' }); NET.conn = conn;
    conn.on('open', () => {
      if (NET.conn !== conn) return;
      clearTimeout(NET.joinTimer); NET.role = 'guest';
      conn.send({ t: 'hello', nm: cleanName($('room-name').value) });
      roomMode('guest'); roomMsg(tr('connected_wait'));
      if (location.hash) history.replaceState(null, '', location.pathname + location.search);
    });
    conn.on('data', m => { if (NET.conn === conn) guestOnMsg(m); });
    conn.on('close', () => guestClosed(conn));
    conn.on('error', () => guestClosed(conn));
    NET.joinTimer = setTimeout(() => { if (NET.role || NET.peer !== peer) return; netShutdown(false); NET.ui = 'join'; joinBusy(false); roomMsg(tr('no_direct'), true); }, 15000);
  });
  peer.on('error', err => { if (NET.peer !== peer || NET.role) return; netShutdown(false); NET.ui = 'join'; joinBusy(false); roomMsg(netErrorText(err), true); });
}
function guestClosed(conn, key) {
  if (NET.conn !== conn) return;
  const was = NET.role === 'guest';
  netShutdown(false);
  if (!was) { NET.ui = 'join'; joinBusy(false); if (ovIs('s-room')) roomMsg(tr('generic_err'), true); return; }
  toTitle(tr(key || 'conn_lost'));
}
function guestOnMsg(m) {
  if (!m || typeof m !== 'object') return;
  switch (m.t) {
    case 'lobby':
      NET.lobby = m;
      if (m.back) { setScreen('menu'); G.phase = 'menu'; G.players = []; MB.init = false; roomMode('guest'); show('s-room'); roomMsg(tr('connected_wait')); }
      if (ovIs('s-room')) renderRoom();
      break;
    case 'start': {
      NET.mySlot = m.you | 0; NET.bN = 0; NET.dN = 0; NET.pb = true; NET.pd = true; NET.lastIn = '';
      sfx.unlock(); goFullscreen();
      G.mode = 'battle'; G.online = true; G.players = (m.pl || []).map((nm, i) => makePlayer(i, cleanName(nm) || tr('player', i + 1), 'net'));
      G.round = 1; G.phase = 'intro'; G.time = ROUND_TIME; baseGrid(); G._fresh = true;
      setScreen('play'); show(null);
      break; }
    case 's': if (G.screen === 'play' || G.screen === 'over') applySnap(m); break;
    case 'match': {
      G.phase = 'over'; setScreen('over');
      showMatch((m.rows || []).map(([i, name, wins]) => ({ i, name: cleanName(name), wins })), m.champ ? cleanName(m.champ) : null);
      break; }
    case 'full': guestClosed(NET.conn, 'full'); break;
    case 'busy': guestClosed(NET.conn, 'busy'); break;
    case 'q': guestClosed(NET.conn, 'host_left'); break;
  }
}
function applySnap(s) {
  if (typeof s.g === 'string' && s.g.length === N) {
    for (let c = 0; c < N; c++) {
      const ch = s.g.charCodeAt(c) - 48, was = G.grid[c];
      if (ch === 3) { G.grid[c] = SOFT; if (G.burn[c] <= 0) G.burn[c] = BURN_T; }
      else {
        if (was === SOFT && ch === FLOOR && !G._fresh) sparks(c % W, (c / W) | 0, '#C8743C', 6);
        if (was !== HARD && ch === HARD && !G._fresh && G.phase === 'play') G.falls.push({ c, t: 0.25 });
        G.grid[c] = ch; G.burn[c] = 0;
      }
    }
  }
  G.flame.fill(0); G.item.fill(0);
  if (Array.isArray(s.F)) for (let i = 0; i + 1 < s.F.length; i += 2) { const c = s.F[i] | 0; if (c >= 0 && c < N) G.flame[c] = (s.F[i + 1] || 0) / 100; }
  if (Array.isArray(s.I)) for (let i = 0; i + 1 < s.I.length; i += 2) { const c = s.I[i] | 0; if (c >= 0 && c < N) G.item[c] = clamp(s.I[i + 1] | 0, 0, 8); }
  G.bombs = [];
  if (Array.isArray(s.B)) for (let i = 0; i + 3 < s.B.length; i += 4) { const fx = s.B[i] / 100, fy = s.B[i + 1] / 100; G.bombs.push({ fx, fy, x: Math.round(fx), y: Math.round(fy), fuse: s.B[i + 2] / 10, owner: s.B[i + 3] | 0, range: 1, remote: false, passers: new Set() }); }
  if (Array.isArray(s.P)) s.P.forEach((a, i) => {
    const p = G.players[i]; if (!p || !Array.isArray(a)) return;
    p.x = a[0] / 100; p.y = a[1] / 100; p.dir = a[2] | 0; p.alive = !!a[3]; p.deathT = (a[4] || 0) / 100; p.moving = !!a[5];
    p.wins = a[6] | 0; p.maxBombs = a[7] | 0; p.range = a[8] | 0; p.speedLv = a[9] | 0; p.kick = !!a[10];
    if (G._fresh || Math.abs(p.dispX - p.x) + Math.abs(p.dispY - p.y) > 2) { p.dispX = p.x; p.dispY = p.y; }
  });
  if (s.ph === 'intro' && G.phase !== 'intro') { G.flame.fill(0); G.falls = []; G.parts = []; }
  G.phase = String(s.ph || 'play'); G.time = (s.tm || 0) / 10; G.round = s.rd | 0; G.sdOn = !!s.sd; MUSIC.fast = G.sdOn && G.phase === 'play';
  if (Array.isArray(s.bn)) { const k = String(s.bn[0]); if (!G.banner || G.banner.k !== k || Math.abs(G.banner.t - s.bn[2] / 10) > 0.4) G.banner = { k, a: Array.isArray(s.bn[1]) ? s.bn[1].map(v => typeof v === 'string' ? cleanName(v) : v) : [], t: s.bn[2] / 10, dur: s.bn[3] / 10 }; }
  if (Array.isArray(s.ev)) for (const e of s.ev.slice(0, 12)) { if (typeof e === 'string') { sfx.play(e); if (e === 'boom') G.shake = Math.min(7, G.shake + 2.5); } }
  G._fresh = false;
}
function guestStep(dt) {
  for (let c = 0; c < N; c++) { if (G.burn[c] > 0) G.burn[c] = Math.max(0.001, G.burn[c] - dt); if (G.flame[c] > 0) G.flame[c] = Math.max(0, G.flame[c] - dt); }
  for (const b of G.bombs) b.fuse = Math.max(0, b.fuse - dt);
  for (const p of G.players) {
    const k = Math.min(1, dt * 18);
    p.dispX += (p.x - p.dispX) * k; p.dispY += (p.y - p.dispY) * k;
    if (p.moving) p.anim += dt;
  }
}

/* ============================================================ mando en menús */
const PADNAV = { prev: {}, t: 0 };
function padMenus(dt) {
  const ps = pads(); if (!ps.length) return;
  const pressed = {};
  for (const pd of ps) {
    const b = i => pd.buttons[i] && pd.buttons[i].pressed;
    if (b(12) || (pd.axes[1] || 0) < -0.6) pressed.up = 1;
    if (b(13) || (pd.axes[1] || 0) > 0.6) pressed.down = 1;
    if (b(0)) pressed.a = 1; if (b(1)) pressed.b = 1; if (b(9)) pressed.start = 1;
  }
  const edge = k => pressed[k] && !PADNAV.prev[k];
  if (edge('start') && G.screen === 'play') togglePause();
  if (!$('ov').hidden) {
    const sec = Array.from($('ov').querySelectorAll('section')).find(s => !s.hidden);
    if (sec) {
      const items = Array.from(sec.querySelectorAll('button, input')).filter(el => !el.disabled && el.offsetParent !== null);
      const i = items.indexOf(document.activeElement);
      if (edge('down')) (items[(i + 1) % items.length] || items[0]).focus();
      if (edge('up')) (items[(i - 1 + items.length) % items.length] || items[0]).focus();
      if (edge('a') && document.activeElement && document.activeElement.tagName === 'BUTTON' && items.includes(document.activeElement)) { sfx.unlock(); document.activeElement.click(); }
      if (edge('b')) { const back = sec.querySelector('[data-go="title"], #room-cancel, #pause-resume, #over-menu, #match-menu'); if (back) back.click(); }
    }
  }
  PADNAV.prev = pressed;
}

/* ============================================================ bucle */
let last = performance.now(), acc = 0;
const DT = 1 / 60;
function frame(now) {
  requestAnimationFrame(frame);
  let d = (now - last) / 1000; last = now; if (d > 0.25) d = 0.25;
  acc += d;
  let n = 0;
  while (acc >= DT && n < 8) { step(DT); netTick(DT); acc -= DT; n++; }
  if (n >= 8) acc = 0;
  padMenus(d);
  render();
}
try { TOUCH.mode = matchMedia('(pointer: coarse)').matches && !matchMedia('(any-pointer: fine)').matches; } catch (e) { /* nada */ }
layout(); applyI18n();
if (/^#join-[A-Z0-9]{5}$/i.test(location.hash)) openJoin(location.hash.slice(6).toUpperCase());
else toTitle();
requestAnimationFrame(frame);
