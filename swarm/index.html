  .nd.lk { border-style: dashed; border-color: #2F3848; background: #06080D; color: #586377; }

  .nd.mx { background: var(--c); color: #05070C; } .nd.mx .ic { color: #05070C; } .nd.mx .pp i { border-color: #05070C; } .nd.mx .pp i.on { background: #05070C; }

  #up-info .ic { flex: none; width: 2.8rem; height: 2.8rem; color: var(--c); }
  #up-info .tx { flex: 1; min-width: 0; display: grid; gap: .3rem; }

  .chip svg { width: 1.05rem; height: 1.05rem; color: var(--c); }

<body>
<canvas id="c" tabindex="0" aria-label="Enjambre"></canvas>
<div id="ov">
  <section class="panel" id="s-title">
    <div class="logo" data-t="title"></div>
    <p class="tag" data-t="tagline"></p>
    <div class="btns">
      <button class="pri" id="go-solo" data-t="solo"></button>
      <button data-go="host" data-t="create_room"></button>
      <button data-go="join" data-t="join_room"></button>
      <button class="ghost" data-go="help" data-t="how_to_play"></button>
    </div>
    <p class="best" id="title-best"></p>
    <p class="notice" id="title-notice" role="status"></p>
    <p class="foot" data-t="foot"></p>
  </section>

  <section class="panel wide" id="s-help" hidden>
    <h2 data-t="how_to_play"></h2>
    <div class="help" id="help-body"></div>
    <div class="row"><button class="pri" data-go="title" data-t="back"></button></div>
  </section>

  <section class="panel" id="s-room" hidden>
    <h2 id="room-title"></h2>
    <label class="field" id="room-name-f"><span data-t="your_name"></span><input id="room-name" maxlength="14" autocomplete="off" spellcheck="false"></label>
    <div id="room-codebox" hidden>
      <div class="field"><span data-t="room_code"></span></div>
      <div id="room-code"></div>
      <div class="row"><button id="room-copy" data-t="copy_link"></button><button id="room-share" data-t="share" hidden></button></div>
    </div>
    <form id="join-form" hidden autocomplete="off">
      <label class="field"><span data-t="room_code"></span><input id="join-code" maxlength="5" inputmode="text" autocapitalize="characters" spellcheck="false" placeholder="ABCDE"></label>
      <button class="pri" type="submit" id="join-btn" data-t="join"></button>
    </form>
    <p class="msg" id="room-msg" role="status" aria-live="polite"></p>
    <div class="slots" id="room-slots"></div>
    <div class="row"><button class="ghost" id="room-cancel" data-t="leave"></button><button class="pri" id="room-start" data-t="start" hidden></button></div>
  </section>

  <section class="panel" id="s-pause" hidden>
    <h2 id="pause-title"></h2>
    <div class="chips" id="pause-ups"></div>
    <div class="btns"><button class="pri" id="pause-resume"></button><button class="ghost" id="pause-quit"></button></div>
  </section>

  <section class="panel wide" id="s-upgrade" hidden>
    <h2 data-t="choose"></h2>
    <p class="tag" id="up-sub"></p>
    <div class="tree" id="up-tree"></div>
    <p class="msg" id="up-wait"></p>
    <div id="up-info"><span class="ic"></span><div class="tx"><b class="nm"></b><span class="pp"></span><p class="ds"></p><p class="rq"></p></div>
      <button class="pri" type="button" id="up-pick"></button></div>
  </section>

  <section class="panel" id="s-over" hidden>
    <h2 id="over-title"></h2>
    <div class="stats" id="over-stats"></div>
    <p class="rec" id="over-rec"></p>
    <table id="over-table" hidden></table>
    <p class="msg" id="over-wait"></p>
    <div class="row"><button class="ghost" id="over-menu"></button><button class="pri" id="over-again"></button></div>
  </section>
</div>
<script>
'use strict';
/* =====================================================================
   Enjambre — supervivencia por oleadas con doble stick, en un solo
   archivo HTML y sin dependencias (PeerJS se carga solo para jugar online).
   Arena fija de 1600×900 vista desde arriba, 7 tipos de enemigos, un jefe
   cada 5 oleadas, mejoras acumulables y cooperativo online de 2 a 4
   jugadores: el anfitrión simula la partida y envía el estado; los
   invitados envían sus controles y suavizan lo que reciben.
   ===================================================================== */

    help: `<p><b>Goal:</b> survive as many waves as you can. Shoot the swarm, collect the gems it drops and pick one upgrade from the tree after every wave, starting once you beat the first boss. Every fifth wave the <b>Hive Mother</b> shows up.</p>
      <h3>Controls</h3><ul>
      <li><b>Keyboard and mouse:</b> WASD move · aim with the mouse · hold click to fire · Space or right click: dash · arrow keys also aim and fire · P / Esc pause · M sound</li>
      <li><b>Touch:</b> left side of the screen: move stick · right side: aim stick (fires automatically) · DASH button</li>
      <li><b>Gamepad:</b> left stick move · right stick aim and fire · RB or A dash · Start pause</li></ul>
      <h3>Tips</h3><ul>
      <li>The dash makes you untouchable for an instant: slip through enemies and bullets.</li>
      <li>The upgrade tree has four branches: Fire, Power, Defense and Move. Each upgrade unlocks the ones below it, so plan your path.</li>
      <li>Gems give experience. Each level gives +6% damage, +3% fire rate and heals 15.</li>
      <li>Upgrades stack and combine: Multi Shot + Piercing + Shrapnel fill the arena with bullets.</li>
      <li>Bullet types change your shots: Big Shot, Explosive and Shock. The color shows the last one you picked, and all of them stay active.</li>
      <li>From wave 8 the swarm gets smarter: it cuts you off, surrounds you and catches up if you run. The last few enemies of each wave come straight for you.</li>

function updatePBullets(dt) {

const canvas = $('c');

function updateCam(dt) {
  const fit = Math.min(cw / (W + 40), ch / (H + 40));
  const s = Math.max(fit, 0.55 * dpr);
  CAM.s = s;

  let fx0 = W / 2, fy0 = H / 2;
  if (G.screen === 'play') {
    const me = myPlayer();
    if (me && me.alive) { fx0 = me.x; fy0 = me.y; }
    else {
      let n = 0, sx = 0, sy = 0;
      for (const p of G.players) if (p.alive) { sx += p.x; sy += p.y; n++; }
      if (n) { fx0 = sx / n; fy0 = sy / n; }
    }

  let tx, ty;

  const top = G.screen === 'play' ? UI.topRes : 0, bot = G.screen === 'play' ? UI.botRes : 0;
  if (vh >= H + 40) ty = H / 2 + clamp((bot - top) / (2 * s), -(vh - H) / 2 + 10, (vh - H) / 2 - 10);
  else ty = clamp(fy0, vh / 2 - 20 - top / s, H + 20 - vh / 2 + bot / s);

/* ---------- suelo de la arena (pre-dibujado) */
const floorCv = document.createElement('canvas');

}

  const g = c.createRadialGradient(W / 2, H / 2, 80, W / 2, H / 2, W * 0.62);

  for (let row = 0, y = -s; y < H + s * 2; row++, y += s * 1.5) for (let x = (row % 2) * hw / 2 - hw; x < W + hw; x += hw) hexPath(c, x, y, s - 3);

  for (let i = 0; i < 16; i++) {
    const x = rv() * W, y = rv() * H, r = 60 + rv() * 160, col = rv() < 0.5 ? '63,230,255' : '155,255,74';

  c.strokeStyle = 'rgba(63,230,255,0.6)'; c.lineWidth = 4; c.strokeRect(2, 2, W - 4, H - 4);
  for (const o of OBS) {
    c.fillStyle = 'rgba(0,0,0,0.45)';
    if (o.c) { c.beginPath(); c.ellipse(o.x + 8, o.y + 12, o.r, o.r * 0.95, 0, 0, TAU); c.fill(); }
    else { rrect(c, o.x + 8, o.y + 12, o.w, o.h, 10); c.fill(); }
  }
  for (const o of OBS) {
    const y0 = o.c ? o.y - o.r : o.y, y1 = o.c ? o.y + o.r : o.y + o.h;
    const bg = c.createLinearGradient(0, y0, 0, y1);

    c.strokeStyle = 'rgba(140,230,255,0.8)'; c.lineWidth = 3; c.stroke();
    c.save(); c.clip();

    if (o.c) { c.beginPath(); hexPath(c, o.x, o.y, o.r * 0.62); c.stroke(); c.beginPath(); hexPath(c, o.x, o.y, o.r * 0.3); c.stroke(); }

function pollPad() {

}
let upOffer = [], upLv = {}, upSel = null, upSelT = 0, upPtr = false, upDone = false;
function upPips(u, lv, max, nw) {
  let h = '';
  for (let k = 0; k < max; k++) h += `<i class="${k < lv ? 'on' : k === nw ? 'nw' : ''}"></i>`;
  return h;
}
function upNode(id) {
  const u = UPD[id], lv = upLv[id] || 0, av = upOffer.includes(id), mx = id !== 'heal' && lv >= u.max;

  b.addEventListener('pointerdown', () => { upPtr = true; });
  b.addEventListener('focus', () => { if (!upPtr) upSelect(id); upPtr = false; });   // teclado y mando: enfocar ya muestra la mejora
  b.addEventListener('click', () => { upPtr = false; if (upSel === id && performance.now() - upSelT > 250) upChoose(); else upSelect(id); });
  b.addEventListener('dblclick', () => { upSelect(id); upChoose(); });

}
function upSelect(id) {

}

}
$('up-pick').addEventListener('click', upChoose);
function showUpgrade(offer, levels, picks) {

/* Moverse por el árbol con flechas o cruceta: al botón más cercano en esa dirección. */
function navSpatial(dx, dy) {
  const els = [...$('up-tree').querySelectorAll('.nd'), $('up-pick')].filter(el => !el.disabled && el.offsetParent !== null);
  const cur = document.activeElement;
  if (!els.includes(cur)) { const f = $('up-tree').querySelector('.nd.av') || els[0]; if (f) f.focus(); return; }
  const r0 = cur.getBoundingClientRect(), cx = r0.left + r0.width / 2, cy = r0.top + r0.height / 2;
  let best = null, bd = Infinity;
  for (const el of els) {
    if (el === cur) continue;
    const r = el.getBoundingClientRect(), ex = r.left + r.width / 2 - cx, ey = r.top + r.height / 2 - cy;
    const along = ex * dx + ey * dy, side = Math.abs(ex * dy - ey * dx);
    if (along <= 4) continue;
    const d = along + side * 2.2;
    if (d < bd) { bd = d; best = el; }
  }
  if (best) best.focus();
}
function chooseUpgrade(id) {
  sfx.play(SFX.LEVEL, 0.5);
  if (NET.role === 'guest') { NET.send({ t: 'pick', u: id }); NET.offer = null; hideOv(); return; }
  hostPick(G.players[0], id);
}

/* ============================================================ red (cooperativo online)
   El anfitrión simula toda la partida y envía instantáneas ~30 veces por segundo.
   Los invitados envían sus controles (y la posición que predicen, que el anfitrión
   solo acepta si es coherente) y suavizan el movimiento de lo que reciben.
   Conexión directa entre navegadores (WebRTC) mediante PeerJS. */
const PEERJS_URL = 'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';
const PEER_PREFIX = 'brightorbit-enjambre-';
const CODE_CHARS = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const NET = {
  role: null, peer: null, conn: null, code: '', guests: [], events: [], snapAcc: 0, sendAcc: 0, joinTimer: 0, ui: null,
  mySlot: -1, lobby: null, dashN: 0, offer: null, lastSnap: 0, snapDt: 1 / 30,
  send(msg) { try { if (this.conn && this.conn.open) this.conn.send(msg); } catch (e) { /* canal cerrado */ } },
};
function sendTo(conn, msg) { try { if (conn && conn.open) conn.send(msg); } catch (e) { /* canal cerrado */ } }
function loadPeerJS() {
  return new Promise((resolve, reject) => {
    if (window.Peer) { resolve(); return; }
    const s = document.createElement('script');
    s.src = PEERJS_URL; s.async = true;
    s.onload = () => (window.Peer ? resolve() : reject(new Error('PeerJS unavailable')));
    s.onerror = () => reject(new Error('PeerJS failed to load'));
    document.head.appendChild(s);
  });
}
function makeCode() { let c = ''; for (let i = 0; i < 5; i++) c += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]; return c; }
const inviteLink = code => `${location.origin}${location.pathname}#join-${code}`;
function netErrorText(err) {
  switch (err && err.type) {
    case 'peer-unavailable': return tr('not_found');
    case 'network': case 'server-error': case 'socket-error': case 'socket-closed': return tr('net_err');
    case 'browser-incompatible': return tr('browser_inc');
    default: return tr('generic_err');
  }
}
function netShutdown(sendQuit) {
  const peer = NET.peer, conns = NET.role === 'host' ? NET.guests.map(g => g.conn) : [NET.conn];
  if (sendQuit) for (const c of conns) sendTo(c, { t: 'q' });
  clearTimeout(NET.joinTimer);
  NET.peer = null; NET.conn = null; NET.guests = []; NET.role = null; NET.events = []; NET.mySlot = -1; NET.lobby = null; NET.offer = null;
  GE.clear(); GEL.length = 0;
  setTimeout(() => {
    for (const c of conns) { try { if (c) c.close(); } catch (e) { /* ya cerrada */ } }
    try { if (peer) peer.destroy(); } catch (e) { /* ya cerrado */ }
  }, sendQuit ? 300 : 0);
}
function leaveOnline() { netShutdown(true); G.mode = 'solo'; toTitle(); }
function myName() { return cleanName($('room-name').value) || tr('pilot'); }
function savedName() { try { return localStorage.getItem('enjambre-name') || ''; } catch (e) { return ''; } }
$('room-name').addEventListener('input', () => {
  try { localStorage.setItem('enjambre-name', cleanName($('room-name').value)); } catch (e) { /* nada */ }
  if (NET.role === 'host') { broadcastLobby(false); renderRoom(); }
});
function roomMsg(t, err) { const m = $('room-msg'); m.textContent = t; m.classList.toggle('err', !!err); }
function roomMode(mode) {

}
function slotRow(color, nameText, badge, dim) {

  const sw = document.createElement('span'); sw.className = 'sw'; sw.style.background = color;

/* ---------- anfitrión */
function openHostRoom() {
  netShutdown(false);
  roomMode('host');
  show('s-room');
  renderRoom();
  hostRoom(0);
}
async function hostRoom(attempt) {
  roomMsg(tr('creating'));
  try { await loadPeerJS(); } catch (e) { roomMsg(tr('peer_load'), true); return; }
  if (!ovIs('s-room') || NET.ui !== 'host') return;
  if (NET.peer) { try { NET.peer.destroy(); } catch (e) { /* nada */ } }
  const code = makeCode();
  const peer = new Peer(PEER_PREFIX + code, { debug: 0 });
  NET.peer = peer; NET.code = code; NET.role = 'host'; NET.guests = [];
  peer.on('open', () => {
    if (NET.peer !== peer) return;
    $('room-code').textContent = code;
    $('room-codebox').hidden = false;
    $('room-share').hidden = !navigator.share;
    roomMsg(tr('share_code'));
    renderRoom();
  });
  peer.on('connection', conn => {
    conn.on('data', m => { if (NET.peer === peer) hostOnMsg(conn, m); });
    conn.on('close', () => { if (NET.peer === peer) hostOnClose(conn); });
    conn.on('error', () => { if (NET.peer === peer) hostOnClose(conn); });
  });
  peer.on('disconnected', () => { if (NET.peer === peer) { try { peer.reconnect(); } catch (e) { /* nada */ } } });
  peer.on('error', err => {
    if (NET.peer !== peer) return;
    if (err.type === 'unavailable-id' && attempt < 3) { hostRoom(attempt + 1); return; }
    if (NET.guests.length) return;
    if (ovIs('s-room')) roomMsg(netErrorText(err), true);
  });
}
function hostOnMsg(conn, m) {
  if (!m || typeof m !== 'object') return;
  const g = NET.guests.find(q => q.conn === conn);
  switch (m.t) {
    case 'hello': {
      if (g) return;
      if (G.screen === 'play') { sendTo(conn, { t: 'busy' }); setTimeout(() => { try { conn.close(); } catch (e) { /* nada */ } }, 500); return; }
      if (NET.guests.length >= 3) { sendTo(conn, { t: 'full' }); setTimeout(() => { try { conn.close(); } catch (e) { /* nada */ } }, 500); return; }
      const nm = cleanName(m.nm) || tr('pilot');
      NET.guests.push({ conn, nm, pi: -1 });
      broadcastLobby(false);
      if (ovIs('s-room')) { renderRoom(); roomMsg(tr('guest_joined', nm) + ' ' + tr('waiting_guests')); }
      sfx.play(SFX.WAVE, 0.5);
      break; }
    case 'in': {
      if (!g || g.pi < 0 || G.screen !== 'play') return;
      const p = G.players[g.pi];
      if (!p) return;
      const mx = clamp(+m.mx || 0, -1, 1), my = clamp(+m.my || 0, -1, 1), l = Math.hypot(mx, my);
      p.inp.mx = l > 1 ? mx / l : mx; p.inp.my = l > 1 ? my / l : my;
      p.inp.aim = Number.isFinite(+m.a) ? +m.a : p.inp.aim;
      p.inp.fire = !!m.f;
      if ((m.d | 0) > p.inp.dash) p.inp.dash = m.d | 0;
      // posición predicha por el invitado: se acepta si es coherente con la simulación
      if (p.alive && Number.isFinite(+m.x) && Number.isFinite(+m.y)) {
        const x = +m.x, y = +m.y;
        if (Math.hypot(x - p.x, y - p.y) < 140) { p.x += (x - p.x) * 0.6; p.y += (y - p.y) * 0.6; pushOut(p, PR); }
      }
      break; }
    case 'pick': {
      if (!g || g.pi < 0) return;
      const p = G.players[g.pi];
      if (p && typeof m.u === 'string') hostPick(p, m.u);
      break; }
    case 'q': hostOnClose(conn); break;
  }
}
function hostOnClose(conn) {
  const g = NET.guests.find(q => q.conn === conn);
  if (!g) return;
  NET.guests = NET.guests.filter(q => q !== g);
  if (G.screen === 'play' && g.pi >= 0 && G.players[g.pi]) {
    const p = G.players[g.pi];
    p.connected = false; p.alive = false; p.picks = 0; p.offer = null;
    fx(['n', 'guest_left', p.name]);
    if (!G.players.some(q => q.alive && q.connected) && G.phase !== 'over') { G.overT = 1.2; }
  }
  broadcastLobby(false);
  if (ovIs('s-room') && NET.ui === 'host') { renderRoom(); }
  try { conn.close(); } catch (e) { /* nada */ }
}
function startOnline() {
  if (NET.role !== 'host') return;
  sfx.unlock(); goFullscreen();
  const ps = [makePlayer(0, myName(), 'local')];
  NET.guests.forEach((g, i) => { g.pi = i + 1; ps.push(makePlayer(i + 1, g.nm, 'net')); });
  const pl = ps.map(p => p.name);
  for (const g of NET.guests) sendTo(g.conn, { t: 'start', you: g.pi, pl });
  NET.events = [];
  newGame(ps, 'online');
}
function backToLobby() {
  setScreen('menu');
  G.players = []; resetPools();
  roomMode('host');
  $('room-code').textContent = NET.code;
  $('room-codebox').hidden = !NET.peer;
  $('room-share').hidden = !navigator.share;
  show('s-room');
  renderRoom();
  roomMsg(tr('waiting_guests'));
  broadcastLobby(true);
}
$('room-start').addEventListener('click', () => { sfx.unlock(); startOnline(); });
$('room-cancel').addEventListener('click', () => { netShutdown(true); show('s-title'); });
$('room-copy').addEventListener('click', async () => {
  const link = inviteLink(NET.code);

  catch (e) { roomMsg(tr('copy_this', link)); }

$('room-share').addEventListener('click', async () => {
  try { await navigator.share({ title: tr('title'), text: `${tr('title')} — ${tr('room_code')}: ${NET.code}`, url: inviteLink(NET.code) }); }
  catch (e) { /* cancelado */ }
});
/* Instantánea compacta: listas planas de enteros. */
function buildSnapshot() {
  const r = Math.round;
  const P = G.players.map(p => [r(p.x), r(p.y), r(p.aim * 100), Math.ceil(p.hp), p.maxHp, p.alive ? 1 : 0, p.inv > 0 ? 1 : 0, p.dashT > 0 ? 1 : 0,
    p.shield, p.shieldMax, p.xp, p.xpNext, p.lvl, p.kills, p.picks, p.connected ? 1 : 0, r(p.spd), r(p.dcdMax * 100), r(p.rate * 10), p.drones, p.flash > 0 ? 1 : 0, r(p.dmg)]);
  const E = [];
  for (let i = 0; i < EN.n; i++) {
    const e = EN.a[i];
    if (!e.alive) continue;
    E.push(e.id, e.t, r(e.x), r(e.y), r(e.ang * 100), r(clamp(e.hp / e.maxHp, 0, 1) * 1000), e.flash > 0 ? 1 : 0, e.st + (e.t === T_BOSS ? e.ph * 10 + (e.inv > 0 ? 100 : 0) : 0),
      r(e.aux * 100), e.spawnT > 0 ? r((1 - e.spawnT / e.spawnMax) * 100) : 100);
  }
  const B = [];
  for (let i = 0; i < PB.n; i++) { const b = PB.a[i]; if (b.alive) B.push(r(b.x), r(b.y), r(b.vx), r(b.vy), b.drone ? 9 : b.owner, b.drone ? 0 : b.vis); }
  const Q = [];
  for (let i = 0; i < EB.n; i++) { const b = EB.a[i]; if (b.alive) Q.push(r(b.x), r(b.y), r(b.vx), r(b.vy), b.k); }
  const M = [];
  for (let i = 0; i < GM.n; i++) { const g = GM.a[i]; if (g.alive) M.push(r(g.x), r(g.y), g.k); }

function guestClosed(conn, key) {

function applySnapshot(s) {

function guestStep(dt) {
