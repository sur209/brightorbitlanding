'use strict';
/* =====================================================================
   Steel Bastion (Bastión de Acero) — versión web (HTML5 Canvas, sin dependencias)
   Port de la versión Android. Mapa de 256x256 unidades; tanque = 16x16.
   ===================================================================== */

const UP = 0, RIGHT = 1, DOWN = 2, LEFT = 3;
const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];
const T_EMPTY = 0, T_BRICK = 1, T_STEEL = 2, T_WATER = 3, T_FOREST = 4;
const N = 64;

const rand = (a, b) => a + Math.random() * (b - a);
const clamp01 = v => Math.min(1, Math.max(0, v));
function mulberry32(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ------------------------------------------------------------ terreno */
class Terrain {
  constructor() { this.cells = new Uint8Array(N * N); this.dirty = new Uint8Array(N * N); this.anyDirty = false; }
  get(bx, by) { return (bx < 0 || by < 0 || bx >= N || by >= N) ? T_STEEL : this.cells[by * N + bx]; }
  set(bx, by, t) {
    if (bx < 0 || by < 0 || bx >= N || by >= N) return;
    const i = by * N + bx;
    if (this.cells[i] !== t) { this.cells[i] = t; this.dirty[i] = 1; this.anyDirty = true; }
  }
  clear() { this.cells.fill(0); this.dirty.fill(0); this.anyDirty = false; }
  clearDirty() { if (this.anyDirty) { this.dirty.fill(0); this.anyDirty = false; } }
  fillBits(bx, by, w, h, t) { for (let y = by; y < by + h; y++) for (let x = bx; x < bx + w; x++) this.set(x, y, t); }
  fillUnits(x, y, w, h, t) { this.fillBits((x / 4) | 0, (y / 4) | 0, (w / 4) | 0, (h / 4) | 0, t); }
  scan(x, y, w, h, test) {
    const bx0 = Math.max(0, Math.floor(x / 4)), by0 = Math.max(0, Math.floor(y / 4));
    const bx1 = Math.min(N - 1, Math.floor((x + w - 0.001) / 4)), by1 = Math.min(N - 1, Math.floor((y + h - 0.001) / 4));
    for (let by = by0; by <= by1; by++) for (let bx = bx0; bx <= bx1; bx++) if (test(this.cells[by * N + bx])) return true;
    return false;
  }
  blocksTank(x, y, w, h) {
    if (x < 0 || y < 0 || x + w > 256 || y + h > 256) return true;
    return this.scan(x, y, w, h, t => t === T_BRICK || t === T_STEEL || t === T_WATER);
  }
  blocksBullet(x, y, w, h) { return this.scan(x, y, w, h, t => t === T_BRICK || t === T_STEEL); }
  hasHazard(x, y, w, h) { return this.scan(x, y, w, h, t => t === T_STEEL || t === T_WATER); }
}

/* ------------------------------------------------------------ sectores
   .  vacío   B ladrillo   S acero   W agua   F bosque
   l r u d  medio ladrillo     1 2 3 4  medio acero          */
const SECTORS = [
  ['Avanzada', [
    '................', '.BBB..B..B..BBB.', '.B............B.', '.B..FF....FF..B.',
    '....FF.SS.FF....', '..BBB......BBB..', '..B....BB....B..', 'WW...B....B...WW',
    'WW...B....B...WW', '..B....BB....B..', '..BBB......BBB..', '....FF....FF....',
    '.B..FF.BB.FF..B.', '.B............B.', '.BBB........BBB.', '................']],
  ['Ribera', [
    '................', '..SS..B..B..SS..', '..BB..B..B..BB..', '......BBBB......',
    '.FFF........FFF.', '.FFF.BB..BB.FFF.', 'WWWW.BB..BB.WWWW', '................',
    '..B..SS..SS..B..', '..B..........B..', '..BBBB.FF.BBBB..', '.......FF.......',
    '.SS..B....B..SS.', '.....B....B.....', '..B..........B..', '..B..........B..']],
  ['Laberinto', [
    '................', '.BBBBB....BBBBB.', '.B...B....B...B.', '.B.F.B.SS.B.F.B.',
    '.B...B....B...B.', '.BB.BB.BB.BB.BB.', '................', 'SS.BBBB..BBBB.SS',
    '.....B....B.....', '.FF..B.WW.B..FF.', '.FF....WW....FF.', '...BBB....BBB...',
    '.B.....SS.....B.', '.B.BB......BB.B.', '.B............B.', '................']],
  ['Fundición', [

    'B.B.B......B.B.B', '....BBBSSBBB....', '.S............S.', '.S.FFFF..FFFF.S.',
    '.S.FFFF..FFFF.S.', '.S............S.', '....BBB..BBB....', 'BB....S..S....BB',
    '..BB........BB..', 'S...BB....BB...S', '..B..........B..', '..B..........B..']],
  ['Archipiélago', [
    '................', '..WW..B..B..WW..', '..WW..B..B..WW..', '......FFFF......',
    'BB..WWW..WWW..BB', '....W......W....', '.FF.W.BBBB.W.FF.', '.FF...B..B...FF.',
    '......B..B......', 'SS..WWW..WWW..SS', '................', '..BBB.FFFF.BBB..',
    '..B..........B..', 'WW...BB..BB...WW', '................', '................']],
  ['Cuadrícula', [

    '................', '..FFFF....FFFF..', '..F..B.BB.B..F..', '..F..B....B..F..',
    '..FFFF....FFFF..', '................', '.SB.BS.BB.SB.BS.', '................',
    'WW.BB.B..B.BB.WW', '...B........B...', '..BB........BB..', '................']],
  ['Trincheras', [
    '................', 'BBBBBB....BBBBBB', '......S..S......', '.BBBBBBuuBBBBBB.',
    '................', 'FF...SSSSSS...FF', 'FF............FF', '..BBBB.dd.BBBB..',
    '..B..........B..', 'WWW..BB..BB..WWW', '................', '.BBBB.BBBB.BBBB.',
    '................', '..SS..l..r..SS..', '..B..........B..', '................']],
  ['Ciudadela', [
    '................', '..B..........B..', '..B.SSSSSSSS.B..', '....B......B....',
    '.FF.B.BBBB.B.FF.', '.FF.B.B..B.B.FF.', '....B.B..B.B....', 'WW..B......B..WW',
    'WW..BBBuuBBB..WW', '................', 'S.BB..FFFF..BB.S', '..B....SS....B..',
    '..B..........B..', '.....BB..BB.....', '..SS........SS..', '................']],
];
const GREEK = ['Alfa', 'Beta', 'Gamma', 'Delta', 'Épsilon', 'Zeta', 'Eta', 'Theta', 'Iota', 'Kappa', 'Lambda', 'Sigma', 'Omega'];

function applyTile(t, bx, by, c) {
  switch (c) {
    case 'B': t.fillBits(bx, by, 4, 4, T_BRICK); break;
    case 'S': t.fillBits(bx, by, 4, 4, T_STEEL); break;
    case 'W': t.fillBits(bx, by, 4, 4, T_WATER); break;
    case 'F': t.fillBits(bx, by, 4, 4, T_FOREST); break;
    case 'l': t.fillBits(bx, by, 2, 4, T_BRICK); break;
    case 'r': t.fillBits(bx + 2, by, 2, 4, T_BRICK); break;
    case 'u': t.fillBits(bx, by, 4, 2, T_BRICK); break;
    case 'd': t.fillBits(bx, by + 2, 4, 2, T_BRICK); break;
    case '1': t.fillBits(bx, by, 2, 4, T_STEEL); break;
    case '2': t.fillBits(bx + 2, by, 2, 4, T_STEEL); break;
    case '3': t.fillBits(bx, by, 4, 2, T_STEEL); break;
    case '4': t.fillBits(bx, by + 2, 4, 2, T_STEEL); break;
  }
}

function generateSector(stage) {
  const r = mulberry32(stage * 31 + 7);
  const ri = n => Math.floor(r() * n);
  const g = Array.from({ length: 16 }, () => Array(16).fill('.'));
  const put = (x, y, c) => { if (x >= 0 && x <= 7 && y >= 1 && y <= 14) g[y][x] = c; };
  const count = 10 + ri(5);
  for (let n = 0; n < count; n++) {
    const k = ri(100), x = ri(8), y = 1 + ri(13);
    if (k < 42) { const w = 1 + ri(3), h = 1 + ri(2); for (let dy = 0; dy < h; dy++) for (let dx = 0; dx < w; dx++) put(x + dx, y + dy, 'B'); }
    else if (k < 56) { const len = 2 + ri(3); for (let i = 0; i < len; i++) put(x, y + i, 'B'); }
    else if (k < 68) { put(x, y, 'S'); if (r() < 0.5) put(x + 1, y, 'S'); }
    else if (k < 80) { for (let dy = 0; dy < 2; dy++) for (let dx = 0; dx < 2; dx++) put(x + dx, y + dy, 'F'); }
    else if (k < 88) { if (y >= 3 && y <= 11) { put(x, y, 'W'); if (r() < 0.5) put(x + 1, y, 'W'); else put(x, y + 1, 'W'); } }
    else { const c = r() < 0.5 ? 'u' : 'd'; for (let i = 0; i < 3; i++) put(x + i, y, c); }
  }
  const mirror = { l: 'r', r: 'l', '1': '2', '2': '1' };
  for (const row of g) for (let c = 0; c <= 7; c++) row[15 - c] = mirror[row[c]] || row[c];
  return g.map(row => row.join(''));
}

function buildSector(stage, terrain) {
  let name, rows;
  if (stage <= SECTORS.length) { [name, rows] = SECTORS[stage - 1]; }
  else {
    const n = stage - SECTORS.length;
    name = `Zona ${GREEK[(n - 1) % GREEK.length]}-${Math.floor((n - 1) / GREEK.length) + 1}`;
    rows = generateSector(stage);
  }
  for (let ty = 0; ty < 16; ty++) {
    const row = rows[ty] || '';
    for (let tx = 0; tx < 16; tx++) applyTile(terrain, tx * 4, ty * 4, row[tx] || '.');
  }
  return name;
}

/* ------------------------------------------------------------ datos */
const KINDS = [
  { i: 0, label: 'Rover',    speed: 30, hp: 1, bullet: 130, fmin: 0.9, fmax: 2.2, points: 100, color: 0x9DB86A },
  { i: 1, label: 'Dardo',    speed: 58, hp: 1, bullet: 140, fmin: 0.8, fmax: 2.0, points: 200, color: 0xF0B03A },
  { i: 2, label: 'Lancero',  speed: 34, hp: 1, bullet: 230, fmin: 0.5, fmax: 1.4, points: 300, color: 0xC46BE8 },
  { i: 3, label: 'Baluarte', speed: 26, hp: 4, bullet: 150, fmin: 0.8, fmax: 1.9, points: 400, color: 0xE05252 },
];
const POWERS = [
  { id: 'SHIELD',    label: 'ESCUDO',          color: 0x5FE3FF },
  { id: 'OVERDRIVE', label: 'SOBRECARGA',      color: 0xFFD84A },
  { id: 'REPAIR',    label: 'TANQUE EXTRA',    color: 0x7CF08A },
  { id: 'STASIS',    label: 'ESTASIS',         color: 0xA8D8FF },
  { id: 'FORTIFY',   label: 'FORTÍN DE ACERO', color: 0xC9D2DC },
  { id: 'NUKE',      label: 'PULSO',           color: 0xFF6B5A },
];
const makeTank = isPlayer => ({
  isPlayer, kind: KINDS[0], x: 0, y: 0, dir: UP, alive: false, hp: 1, speed: 46, spawnTimer: 0, shield: 0,
  carrier: false, flash: 0, tread: 0, aiTurn: 0, aiFire: 0, stuck: 0, stuckLimit: 0, cooldown: 0, rank: 0,
});
const isActive = t => t.alive && t.spawnTimer <= 0;

/* ------------------------------------------------------------ sonido (sintetizado) */
const SFX = { SHOOT: 0, BRICK: 1, STEEL: 2, EXPLODE: 3, BIG: 4, POWER_APPEAR: 5, PICKUP: 6, ARMOR: 7, STAGE: 8, GAMEOVER: 9, BLIP: 10 };
const RATE = 22050;
function synth(id) {
  const buf = s => new Float32Array(Math.floor(s * RATE));
  const square = (ph, duty = 0.5) => (ph - Math.floor(ph) < duty ? 1 : -1);
  const tri = ph => 1 - 4 * Math.abs(ph - Math.floor(ph) - 0.5);
  const noise = () => Math.random() * 2 - 1;
  const notes = (freqs, each, vol, wave) => {
    const b = buf(each * freqs.length + 0.08), per = Math.floor(each * RATE);
    let ph = 0;
    for (let i = 0; i < b.length; i++) {
      const n = Math.min(Math.floor(i / per), freqs.length - 1), local = (i - n * per) / RATE;
      ph += freqs[n] / RATE;
      b[i] = wave(ph) * vol * Math.exp(-local * 14);
    }
    return b;
  };
  const melody = (freqs, durs, vol, vibrato) => {
    const b = buf(durs.reduce((a, c) => a + c, 0) + 0.1);
    let idx = 0, ph = 0, ph2 = 0;
    freqs.forEach((f, n) => {
      const len = Math.floor(durs[n] * RATE);
      for (let j = 0; j < len && idx < b.length; j++) {
        const t = j / RATE, v = vibrato ? 1 + 0.015 * Math.sin(2 * Math.PI * 6 * t) : 1;
        ph += f * v / RATE; ph2 += f * 2 * v / RATE;
        const env = Math.min(1, t * 200) * Math.exp(-t * (2.5 / durs[n]));
        b[idx++] = (tri(ph) * 0.7 + square(ph2, 0.25) * 0.15) * env * vol;
      }
    });
    return b;
  };
  let b, ph = 0, lp = 0;
  switch (id) {
    case SFX.SHOOT: { const d = 0.11; b = buf(d);
      for (let i = 0; i < b.length; i++) { const t = i / RATE; ph += 880 * (1 - 0.65 * t / d) / RATE; const e = (1 - t / d) ** 2; b[i] = (square(ph) * 0.4 + noise() * 0.08) * e; }
      return b; }
    case SFX.BRICK: b = buf(0.14);
      for (let i = 0; i < b.length; i++) { const t = i / RATE; lp += (noise() - lp) * 0.35; b[i] = lp * Math.exp(-t * 28) * 1.1; }
      return b;
    case SFX.STEEL: b = buf(0.22);
      for (let i = 0; i < b.length; i++) { const t = i / RATE, w = 2 * Math.PI * t; b[i] = (Math.sin(w * 1760) * 0.5 + Math.sin(w * 2640) * 0.3 + Math.sin(w * 3960) * 0.15) * Math.exp(-t * 22) * 0.7; }
      return b;
    case SFX.EXPLODE: { const d = 0.5; b = buf(d);
      for (let i = 0; i < b.length; i++) { const t = i / RATE; lp += (noise() - lp) * (0.6 - 0.52 * t / d); ph += (95 - 60 * t / d) / RATE; b[i] = (lp * 0.9 + Math.sin(2 * Math.PI * ph) * 0.35) * Math.exp(-t * 7); }
      return b; }
    case SFX.BIG: { const d = 1.1; b = buf(d);
      for (let i = 0; i < b.length; i++) { const t = i / RATE; lp += (noise() - lp) * (0.3 - 0.26 * t / d); ph += (60 - 25 * t / d) / RATE; const e = Math.min(1, t * 80) * Math.exp(-t * 3.2); b[i] = (lp * 1.4 + Math.sin(2 * Math.PI * ph) * 0.45 * Math.exp(-t * 4)) * e; }
      return b; }
    case SFX.POWER_APPEAR: return notes([660, 880, 990, 1320], 0.09, 0.45, tri);
    case SFX.PICKUP: return notes([523, 659, 784, 1047, 1319, 1568], 0.07, 0.3, p => square(p, 0.25));
    case SFX.ARMOR: b = buf(0.1);
      for (let i = 0; i < b.length; i++) { const t = i / RATE; ph += 180 / RATE; b[i] = (square(ph) * 0.4 + noise() * 0.3) * Math.exp(-t * 35); }
      return b;
    case SFX.STAGE: return melody([392, 523, 659, 784, 659, 784, 1047], [0.11, 0.11, 0.11, 0.22, 0.11, 0.11, 0.45], 0.4, false);
    case SFX.GAMEOVER: return melody([523, 466, 415, 349], [0.25, 0.25, 0.25, 0.9], 0.45, true);
    default: b = buf(0.06);
      for (let i = 0; i < b.length; i++) { const t = i / RATE; b[i] = Math.sin(2 * Math.PI * 1200 * t) * Math.exp(-t * 50) * 0.5; }
      return b;
  }
}
const sfx = {
  ctx: null, master: null, bufs: [], last: new Array(11).fill(0), muted: false,
  unlock() {
    if (!this.ctx) {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AC();
        this.master = this.ctx.createGain();
        this.master.gain.value = this.muted ? 0 : 0.7;
        this.master.connect(this.ctx.destination);
        for (let i = 0; i < 11; i++) {
          const d = synth(i), b = this.ctx.createBuffer(1, d.length, RATE);
          b.getChannelData(0).set(d);
          this.bufs[i] = b;
        }
      } catch (e) { this.ctx = null; }
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  toggleMute() { this.muted = !this.muted; if (this.master) this.master.gain.value = this.muted ? 0 : 0.7; },
  play(id, vol = 1, rate = 1) {
    if (!this.ctx || !this.bufs[id]) return;
    const now = performance.now();
    if (now - this.last[id] < 35) return;
    this.last[id] = now;
    try {
      const s = this.ctx.createBufferSource(), g = this.ctx.createGain();
      s.buffer = this.bufs[id]; s.playbackRate.value = rate; g.gain.value = vol * 0.85;
      s.connect(g); g.connect(this.master); s.start();
    } catch (e) { /* sin audio */ }
  },
};

/* ------------------------------------------------------------ estado */
const S = { TITLE: 0, INTRO: 1, PLAYING: 2, CLEAR: 3, TALLY: 4, OVER: 5 };
const CORE_X = 120, CORE_Y = 240, PLAYER_X = 80, PLAYER_Y = 240, PER_STAGE = 20;
const SPAWN_X = [120, 240, 0], CARRIERS = [3, 10, 17], MAX_PARTICLES = 500;

function loadHi() { try { return parseInt(localStorage.getItem('bastion-hi') || '0', 10) || 0; } catch (e) { return 0; } }
function storeHi(v) { try { localStorage.setItem('bastion-hi', String(v)); } catch (e) { /* almacenamiento no disponible */ } }

const G = {
  state: S.TITLE, paused: false, terrain: new Terrain(), stage: 1, score: 0, hiScore: loadHi(), startHi: 0,
  newRecord: false, lives: 3, player: makeTank(true), enemies: [], bullets: [], particles: [], popups: [],
  power: null, coreAlive: true, queue: [], spawned: 0, spawnTimer: 0, spawnIdx: 0, respawnTimer: 0,
  stasis: 0, fortify: 0, fortifySteel: false, stateTimer: 0, tallyTime: 0, kills: [0, 0, 0, 0], shake: 0,
  time: 0, overReason: '', stageName: '', bannerText: '', bannerTime: 0, waterBlocks: [], terrainEpoch: 0,
};
const input = {
  keyDir: -1, padDir: -1, touchDir: -1, fireKey: false, firePad: false, fireTouch: false,
  joyActive: false, joyOX: 0, joyOY: 0, joyKX: 0, joyKY: 0,
  dir() { return this.keyDir >= 0 ? this.keyDir : this.padDir >= 0 ? this.padDir : this.touchDir; },
  fire() { return this.fireKey || this.firePad || this.fireTouch; },
  joyStart(x, y) { this.joyActive = true; this.joyOX = this.joyKX = x; this.joyOY = this.joyKY = y; this.touchDir = -1; },
  joyMove(x, y, radius) {
    let dx = x - this.joyOX, dy = y - this.joyOY, d = Math.hypot(dx, dy);
    const drag = radius * 1.4;
    if (d > drag) { const k = (d - drag) / d; this.joyOX += dx * k; this.joyOY += dy * k; dx = x - this.joyOX; dy = y - this.joyOY; d = Math.hypot(dx, dy); }
    const f = d > radius ? radius / d : 1;
    this.joyKX = this.joyOX + dx * f; this.joyKY = this.joyOY + dy * f;
    this.touchDir = d < radius * 0.22 ? -1 : Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? RIGHT : LEFT) : (dy > 0 ? DOWN : UP);
  },
  joyRelease() { this.joyActive = false; this.touchDir = -1; },
  releaseAll() { this.keyDir = this.padDir = this.touchDir = -1; this.fireKey = this.firePad = this.fireTouch = false; this.joyActive = false; },
};

/* ------------------------------------------------------------ flujo */
function update(dt) {
  G.time += dt;
  if (G.paused) return;
  switch (G.state) {
    case S.INTRO: G.stateTimer -= dt; if (G.stateTimer <= 0) G.state = S.PLAYING; break;
    case S.PLAYING: world(dt); break;
    case S.CLEAR:
      world(dt);
      if (G.state === S.CLEAR) {
        G.stateTimer -= dt;
        if (G.stateTimer <= 0) { G.state = S.TALLY; G.tallyTime = 0; saveHi(); resetInputs(); }
      }
      break;
    case S.TALLY: {
      const before = G.tallyTime;
      G.tallyTime += dt;
      for (let i = 0; i < KINDS.length; i++) { const t = 0.4 + i * 0.35; if (before < t && G.tallyTime >= t) sfx.play(SFX.BLIP); }
      if (G.tallyTime > 8) nextStage();
      break;
    }
    case S.OVER: world(dt); G.stateTimer -= dt; break;
  }
}

function onTap(x, y) {
  if (G.paused) {
    if (inRect(L.resumeRect, x, y)) resume();
    else if (inRect(L.quitRect, x, y)) toTitle();
    return;
  }
  confirm();
}
function confirm() {
  if (G.paused) { resume(); return; }
  if (G.state === S.TITLE) startGame();
  else if (G.state === S.TALLY) { if (G.tallyTime > 1.2) nextStage(); }
  else if (G.state === S.OVER) { if (G.stateTimer <= 0) toTitle(); }
}
const canPause = () => G.state === S.INTRO || G.state === S.PLAYING || G.state === S.CLEAR;
function togglePause() {
  if (G.paused) resume();
  else if (canPause()) { G.paused = true; resetInputs(); sfx.play(SFX.BLIP); }
}
function autoPause() { if (canPause()) G.paused = true; resetInputs(); saveHi(); }
function resume() { G.paused = false; resetInputs(); sfx.play(SFX.BLIP); }

function startGame() {
  G.stage = 1; G.score = 0; G.lives = 3; G.player.rank = 0; G.startHi = G.hiScore; G.newRecord = false;
  loadStage();
}
function nextStage() { G.stage++; loadStage(); }
function toTitle() {
  saveHi(); G.paused = false; G.state = S.TITLE;
  G.enemies = []; G.bullets = []; G.particles = []; G.popups = []; G.power = null;
  resetInputs();
}

function makeQueue(s) {

  const rover = PER_STAGE - heavy - lancer - dart;
  const list = [];
  for (let i = 0; i < rover; i++) list.push(KINDS[0]);
  for (let i = 0; i < dart; i++) list.push(KINDS[1]);
  for (let i = 0; i < lancer; i++) list.push(KINDS[2]);
  for (let i = 0; i < heavy; i++) list.push(KINDS[3]);
  for (let i = list.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [list[i], list[j]] = [list[j], list[i]]; }

function world(dt) {

  if (G.stasis > 0) G.stasis -= dt;
  if (G.bannerTime > 0) G.bannerTime -= dt;
  if (G.fortify > 0) {
    G.fortify -= dt;
    if (G.fortify <= 0) { G.fortifySteel = false; buildFortress(T_BRICK); }
    else if (G.fortify < 3) {
      const steel = Math.floor(G.fortify * 4) % 2 === 0;
      if (steel !== G.fortifySteel) { G.fortifySteel = steel; buildFortress(steel ? T_STEEL : T_BRICK); }
    }
  }
  updatePlayer(dt);
  if (G.state === S.PLAYING) updateSpawner(dt);
  updateEnemies(dt);
  updateBullets(dt);
  updatePower(dt);
  updateFx(dt);
  if (G.state === S.PLAYING && G.spawned >= G.queue.length && !G.enemies.some(e => e.alive)) { G.state = S.CLEAR; G.stateTimer = 2.8; }
  G.enemies = G.enemies.filter(e => e.alive);
}

function updatePlayer(dt) {
  const p = G.player;
  if (!p.alive) {
    if (G.respawnTimer > 0) { G.respawnTimer -= dt; if (G.respawnTimer <= 0 && G.state !== S.OVER) resetPlayer(3); }
    return;
  }
  if (p.flash > 0) p.flash -= dt;
  if (p.spawnTimer > 0) { p.spawnTimer -= dt; return; }
  if (p.shield > 0) p.shield -= dt;
  if (G.state === S.OVER) return;
  const d = input.dir();
  if (d >= 0) moveTank(p, d, p.speed * dt);
  p.cooldown -= dt;
  if (input.fire() && p.cooldown <= 0 && fire(p)) p.cooldown = p.rank >= 2 ? 0.16 : 0.26;
}

function updateSpawner(dt) {
  if (G.spawned >= G.queue.length) return;
  G.spawnTimer -= dt;
  if (G.spawnTimer > 0) return;
  if (G.enemies.filter(e => e.alive).length >= maxActive()) { G.spawnTimer = 0.3; return; }
  const sx = SPAWN_X[G.spawnIdx % SPAWN_X.length];
  G.spawnIdx++;
  if (anyTankOverlap(sx, 0, 16, 16)) { G.spawnTimer = 0.25; return; }
  const k = G.queue[G.spawned], e = makeTank(false);
  e.kind = k; e.hp = k.hp; e.speed = k.speed * (1 + Math.min(G.stage - 1, 10) * 0.02);
  e.x = sx; e.y = 0; e.dir = DOWN; e.alive = true; e.spawnTimer = 1;
  e.aiTurn = rand(0.6, 2); e.aiFire = rand(0.6, 1.6); e.carrier = CARRIERS.includes(G.spawned);
  G.enemies.push(e);
  G.spawned++;

}

function updateEnemies(dt) {
  for (const e of G.enemies) {
    if (!e.alive) continue;
    if (e.flash > 0) e.flash -= dt;
    if (e.spawnTimer > 0) { e.spawnTimer -= dt; continue; }
    if (G.stasis > 0) continue;
    e.aiTurn -= dt;
    const moved = moveTank(e, e.dir, e.speed * dt);
    if (!moved) {
      if (e.stuck === 0) {
        e.stuckLimit = Math.random() < 0.5 ? 0 : rand(0.4, 0.9);
        if (e.stuckLimit > 0) e.aiFire = Math.min(e.aiFire, 0.1);
      }
      e.stuck += dt;
      if (e.stuck >= e.stuckLimit) { chooseDir(e, true); e.stuck = 0; }
    } else {
      e.stuck = 0;
      if (e.aiTurn <= 0) chooseDir(e, false);
    }
    e.aiFire -= dt;
    if (e.aiFire > 0.15 && lineOfFire(e)) e.aiFire = 0.15;

  }
}
function aligned(e, tx, ty) {
  const cx = e.x + 8, cy = e.y + 8;
  switch (e.dir) {
    case UP: return Math.abs(tx - cx) < 6 && ty < cy;
    case DOWN: return Math.abs(tx - cx) < 6 && ty > cy;
    case LEFT: return Math.abs(ty - cy) < 6 && tx < cx;
    default: return Math.abs(ty - cy) < 6 && tx > cx;
  }
}
const lineOfFire = e => (isActive(G.player) && aligned(e, G.player.x + 8, G.player.y + 8)) || (G.coreAlive && aligned(e, CORE_X + 8, CORE_Y + 8));
function chooseDir(e, blocked) {
  const r = Math.random();
  let d;
  if (r < 0.5) {
    const useCore = !isActive(G.player) || Math.random() < coreBias();
    const tx = useCore ? CORE_X + 8 : G.player.x + 8, ty = useCore ? CORE_Y + 8 : G.player.y + 8;
    const dx = tx - (e.x + 8), dy = ty - (e.y + 8);
    const horizontal = (Math.abs(dx) > Math.abs(dy)) !== (Math.random() < 0.3);
    d = horizontal ? (dx > 0 ? RIGHT : LEFT) : (dy > 0 ? DOWN : UP);
  } else if (r < 0.65) d = DOWN;
  else d = Math.floor(Math.random() * 4);
  if (blocked && d === e.dir) d = (d + 1 + Math.floor(Math.random() * 3)) % 4;
  turn(e, d);
  e.aiTurn = rand(0.8, 2.8);
}

const overlap = (ax, ay, aw, ah, bx, by, bw, bh) => ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
function anyTankOverlap(x, y, w, h) {

  for (const e of G.enemies) if (e.alive && overlap(x, y, w, h, e.x, e.y, 16, 16)) return true;
  return false;
}
function tankBlocks(t, o, x, y) {

  if (!overlap(x, y, 16, 16, o.x, o.y, 16, 16)) return false;

}

}
function turn(t, d) {

function fire(t) {
  const maxB = t.isPlayer && t.rank >= 2 ? 2 : 1;
  let n = 0;
  for (const b of G.bullets) if (b.alive && b.owner === t) n++;
  if (n >= maxB) return false;
  const spd = t.isPlayer ? (t.rank >= 1 ? 240 : 160) : t.kind.bullet;
  const bx = t.x + 8 + DX[t.dir] * 7, by = t.y + 8 + DY[t.dir] * 7;

    const b = list[i];

    while (remaining > 0 && b.alive) {
      const s = Math.min(2, remaining);
      remaining -= s;
      b.x += DX[b.dir] * s; b.y += DY[b.dir] * s;
      collideBullet(b);

}

    sparks(Math.min(256, Math.max(0, b.x)), Math.min(256, Math.max(0, b.y)), 5, 0xB8C2CF);
    if (b.owner.isPlayer) sfx.play(SFX.STEEL, 0.5);

  if (G.coreAlive && overlap(l, t, 4, 4, CORE_X, CORE_Y, 16, 16)) { b.alive = false; destroyCore(); return; }

  if (b.owner.isPlayer) {

function impact(b) {

    case DOWN: left = b.x - 8; right = b.x + 8; top = b.y; bottom = b.y + 7; break;
    case LEFT: left = b.x - 7; right = b.x; top = b.y - 8; bottom = b.y + 8; break;

/* ---------- terreno pre-renderizado */
const terrainCv = document.createElement('canvas'), tctx = terrainCv.getContext('2d');

function ensureBitmaps() {
  // Cada bit del terreno ocupa un número entero de píxeles (evita restos al borrar).
  const px = N * Math.max(1, Math.round(L.mapSize / N));
  if (px === bmpPx) return;
  bmpPx = px;
  for (const [cv, c2] of [[terrainCv, tctx], [forestCv, fctx]]) {
    cv.width = px; cv.height = px;
    c2.setTransform(px / 256, 0, 0, px / 256, 0, 0);

}
function drawBit(bx, by, v) {

    c.fillStyle = css(BRICK); c.fillRect(x, y, 4, 4);

    c.fillStyle = css(STEEL_HI); c.fillRect(ox, oy, 8, 1); c.fillRect(ox, oy, 1, 8);
    c.fillStyle = css(STEEL_LO); c.fillRect(ox, oy + 7, 8, 1); c.fillRect(ox + 7, oy, 1, 8);

}
function syncTerrain() {

}

/* ---------- dibujo principal */
function render() {

  fillC(BG); ctx.fillRect(0, 0, L.w, L.h);
  if (G.state === S.TITLE) { drawTitle(); return; }
  if (G.state === S.TALLY) { drawTally(); return; }

  syncTerrain();
  drawWorld();
  drawHud();
  if (!G.paused && G.state !== S.OVER) { if (touchMode) drawControls(); else drawKeyHints(); }
  if (G.state === S.INTRO) drawIntro();

}

function drawWorld() {

  for (const e of G.enemies) if (e.alive) drawTankEntity(e);
  if (G.player.alive) drawTankEntity(G.player);
  for (const b of G.bullets) drawBullet(b);
  ctx.drawImage(forestCv, 0, 0, 256, 256);
  if (G.power) drawPowerUp(G.power);
  drawParticles();
  for (const p of G.popups) label(p.text, p.x, p.y, 6, p.color, 'center', clamp01(p.life / 0.4));
  if (G.bannerTime > 0) {
    const a = clamp01(G.bannerTime / 0.4);
    label(G.bannerText, 128.8, 31, 13, 0x000000, 'center', a * 0.66, 0.12);
    label(G.bannerText, 128, 30, 13, ACCENT, 'center', a, 0.12);

}

function drawWater() {
  if (!G.waterBlocks.length) return;
  fillC(0x17406B);
  for (const code of G.waterBlocks) ctx.fillRect((code % 32) * 8, ((code / 32) | 0) * 8, 8, 8);
  ctx.strokeStyle = css(0x3C7DBA); ctx.lineWidth = 0.6; ctx.lineCap = 'round';
  ctx.beginPath();
  for (const code of G.waterBlocks) {
    const ox = (code % 32) * 8, oy = ((code / 32) | 0) * 8;
    const ph = Math.sin(G.time * 2.2 + ox * 0.15 + oy * 0.23);

    ctx.moveTo(x1, oy + 6); ctx.lineTo(x1 + 3, oy + 6);

function hexPath(cx, cy, r) {

}

const enemyColor = e => e.kind.i === 3 ? BULWARK_HP[Math.min(3, Math.max(0, e.hp - 1))] : e.kind.color;

  fillC(color); ctx.fillRect(x - s * 0.32, y - s * 0.34, s * 0.64, s * 0.74);
  fillC(tint(color, 0.4)); circle(ctx, x, y + s * 0.04, s * 0.2); ctx.fill();
  ctx.fillRect(x - s * 0.06, y - s * 0.56, s * 0.12, s * 0.56);
}
function drawPauseButton() {
  const pr = L.pauseRect, cx = rcx(pr), cy = rcy(pr), r = rw(pr) / 2;
  fillC(0xFFFFFF, 0.13); circle(ctx, cx, cy, r); ctx.fill();
  ctx.strokeStyle = css(0xFFFFFF, 0.33); ctx.lineWidth = 1.5 * L.density; ctx.stroke();
  fillC(0xFFFFFF, 0.8);
  const bw = rw(pr) * 0.1, bh = rw(pr) * 0.32;
  ctx.fillRect(cx - bw * 2, cy - bh, bw, bh * 2); ctx.fillRect(cx + bw, cy - bh, bw, bh * 2);
}
function drawHud() {
  const f = L.font;
  drawPauseButton();
  if (L.portrait) {
    const y = rcy(L.pauseRect) + f * 0.35, x0 = L.pauseRect.r + f;
    label(`SECTOR ${G.stage}`, x0, y, f, ACCENT, 'left');
    label(String(G.score), L.w / 2, y, f * 1.1, TEXT);
    drawMiniTank(L.w - f * 6, y - f * 0.35, f * 0.9, PLAYER);
    label(`×${G.lives}`, L.w - f * 5.2, y, f, TEXT, 'left');
    drawMiniTank(L.w - f * 2.8, y - f * 0.35, f * 0.9, 0x8A93A0);
    label(String(reserve()), L.w - f * 2, y, f, TEXT, 'left');
    return;
  }
  const lx = rcx(L.left);
  let y = L.pauseRect.b + f * 1.8;
  label('PUNTOS', lx, y, f * 0.7, MUTED);
  label(String(G.score), lx, y + f * 1.3, f * 1.25, TEXT);
  y += f * 3.2;
  label('RÉCORD', lx, y, f * 0.7, MUTED);
  label(String(G.hiScore), lx, y + f * 1.3, f * 1.05, ACCENT);

  const rx = rcx(L.right);
  y = f * 1.6;
  label('SECTOR', rx, y, f * 0.7, MUTED);
  label(String(G.stage), rx, y + f * 1.5, f * 1.5, ACCENT);
  y += f * 2.6;
  const s = Math.min(f * 0.85, rw(L.right) / 7.5), gap = s * 1.3, x0 = rx - gap * 2;
  for (let i = 0; i < reserve(); i++) drawMiniTank(x0 + (i % 5) * gap, y + s * 0.6 + Math.floor(i / 5) * gap, s, 0x8A93A0);
  y += gap * 4 + f * 0.9;
  drawMiniTank(rx - f * 1.1, y - f * 0.35, f * 1.1, PLAYER);
  label(`× ${Math.max(G.lives, 0)}`, rx - f * 0.2, y, f * 1.05, TEXT, 'left');
  y += f * 1.4;
  for (let i = 0; i < 3; i++) {
    const cx = rx + (i - 1) * f * 0.9;
    ctx.beginPath(); ctx.moveTo(cx, y - f * 0.35); ctx.lineTo(cx + f * 0.3, y); ctx.lineTo(cx, y + f * 0.35); ctx.lineTo(cx - f * 0.3, y); ctx.closePath();
    fillC(i < G.player.rank ? 0xFFD84A : 0x2A313B); ctx.fill();
  }
  if (G.stasis > 0 || G.fortify > 0) {
    y += f * 1.2;
    const txt = G.stasis > 0 ? `ESTASIS ${Math.ceil(G.stasis)}` : `FORTÍN ${Math.ceil(G.fortify)}`;
    label(txt, rx, y, f * 0.65, G.stasis > 0 ? 0xA8D8FF : STEEL_HI);
  }
}
function drawKeyHints() {
  if (L.portrait) return;
  const f = L.font;
  const rows = [['MOVER', 'Flechas / WASD'], ['DISPARAR', 'Espacio'], ['PAUSA', 'P / Esc'], ['SONIDO', sfx.muted ? 'M (silenciado)' : 'M']];
  let y = L.h - f * (rows.length * 1.9 + 0.6);
  const lx = rcx(L.left);
  for (const [k, v] of rows) {
    label(k, lx, y, f * 0.6, MUTED);
    label(v, lx, y + f * 0.95, f * 0.75, TEXT, 'center', 0.85);
    y += f * 1.9;
  }
}
function drawControls() {
  const d = L.density;
  const jx = input.joyActive ? input.joyOX : L.joyX, jy = input.joyActive ? input.joyOY : L.joyY;
  const kx = input.joyActive ? input.joyKX : L.joyX, ky = input.joyActive ? input.joyKY : L.joyY;
  fillC(0xFFFFFF, input.joyActive ? 0.13 : 0.08); circle(ctx, jx, jy, L.joyR); ctx.fill();
  ctx.strokeStyle = css(0xFFFFFF, 0.2); ctx.lineWidth = 2 * d; ctx.stroke();
  for (let i = 0; i < 4; i++) {
    const ax = jx + DX[i] * L.joyR * 0.72, ay = jy + DY[i] * L.joyR * 0.72, s = L.joyR * 0.11;
    ctx.beginPath();
    ctx.moveTo(ax + DX[i] * s, ay + DY[i] * s);
    ctx.lineTo(ax - DX[i] * s + DY[i] * s, ay - DY[i] * s + DX[i] * s);
    ctx.lineTo(ax - DX[i] * s - DY[i] * s, ay - DY[i] * s - DX[i] * s);
    ctx.closePath();
    if (i === input.touchDir) fillC(PLAYER, 0.8); else fillC(0xFFFFFF, 0.27);
    ctx.fill();
  }
  if (input.joyActive) fillC(PLAYER, 0.53); else fillC(0xFFFFFF, 0.27);
  circle(ctx, kx, ky, L.joyR * 0.42); ctx.fill();

  const pressed = input.fireTouch;
  fillC(0xFF7A59, pressed ? 0.4 : 0.16); circle(ctx, L.fireX, L.fireY, L.fireR); ctx.fill();
  ctx.strokeStyle = css(0xFF7A59, 0.6); ctx.stroke();
  ctx.strokeStyle = pressed ? css(0xFFD2C4) : css(0xFF9A80, 0.73);
  const cr = L.fireR * 0.32, fx = L.fireX, fy = L.fireY;
  circle(ctx, fx, fy, cr); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(fx - cr * 1.7, fy); ctx.lineTo(fx - cr * 0.6, fy); ctx.moveTo(fx + cr * 0.6, fy); ctx.lineTo(fx + cr * 1.7, fy);
  ctx.moveTo(fx, fy - cr * 1.7); ctx.lineTo(fx, fy - cr * 0.6); ctx.moveTo(fx, fy + cr * 0.6); ctx.lineTo(fx, fy + cr * 1.7);
  ctx.stroke();
  label('FUEGO', fx, fy + L.fireR + L.font * 0.9, L.font * 0.6, 0xFF9A80, 'center', 0.6);
}

/* ---------- superposiciones */
function drawIntro() {
  const t = G.stateTimer, a = t > 0.6 ? 1 : t / 0.6, half = L.mapSize / 2 * a;
  fillC(0x0D1117);
  ctx.fillRect(L.mapX, L.mapY, L.mapSize, half);
  ctx.fillRect(L.mapX, L.mapY + L.mapSize - half, L.mapSize, half);
  const cx = L.mapX + L.mapSize / 2, cy = L.mapY + L.mapSize / 2, s = L.mapSize;
  label(`SECTOR ${G.stage}`, cx, cy - s * 0.01, s * 0.1, ACCENT, 'center', a, 0.2);
  label(G.stageName.toUpperCase(), cx, cy + s * 0.08, s * 0.05, TEXT, 'center', a);
  label('Defiende el núcleo', cx, cy + s * 0.15, s * 0.035, MUTED, 'center', a);
}
function drawOver() {
  const prog = clamp01((3 - G.stateTimer) / 1.2);
  fillC(0x05070A, prog * 0.75); ctx.fillRect(L.mapX, L.mapY, L.mapSize, L.mapSize);
  const cx = L.mapX + L.mapSize / 2, s = L.mapSize, cy = L.mapY + s * 0.42 + (1 - prog) * s * 0.3;
  label('FIN DEL JUEGO', cx, cy, s * 0.11, 0xFF6B5A, 'center', prog, 0.15);
  label(G.overReason, cx, cy + s * 0.08, s * 0.04, TEXT, 'center', prog);
  label(`PUNTOS  ${G.score}`, cx, cy + s * 0.17, s * 0.055, ACCENT, 'center', prog);
  if (G.newRecord && (((G.time * 3) | 0) & 1) === 0) label('¡NUEVO RÉCORD!', cx, cy + s * 0.25, s * 0.045, 0xFFD84A, 'center', prog);
  if (G.stateTimer <= 0 && (((G.time * 2) | 0) & 1) === 0) label(touchMode ? 'Toca para continuar' : 'Pulsa Enter para continuar', cx, L.mapY + s * 0.9, s * 0.04, MUTED);
}
function button(r, s, color, f) {
  rrPath(ctx, r.l, r.t, rw(r), r.b - r.t, f * 0.5);
  fillC(color, 0.16); ctx.fill();
  ctx.strokeStyle = css(color); ctx.lineWidth = f * 0.12; ctx.stroke();
  label(s, rcx(r), rcy(r) + f * 0.38, f * 1.05, TEXT);
}
function drawPause() {
  fillC(0x000000, 0.69); ctx.fillRect(0, 0, L.w, L.h);
  const f = L.font;
  label('PAUSA', L.w / 2, L.resumeRect.t - f * 1.6, f * 2.4, TEXT, 'center', 1, 0.3);
  button(L.resumeRect, 'CONTINUAR', PLAYER, f);
  button(L.quitRect, 'SALIR AL MENÚ', 0xFF7A59, f);
}

/* ---------- pantallas */
function drawBackdrop() {
  const cell = Math.max(L.w, L.h) / 18, off = (G.time * cell * 0.15) % cell;
  fillC(0x111720);
  for (let x = -off; x < L.w; x += cell) ctx.fillRect(x, 0, L.density, L.h);
  for (let y = -off; y < L.h; y += cell) ctx.fillRect(0, y, L.w, L.density);
}
function drawBrickBand(top, w, h) {
  const bh = h / 2, bw = bh * 2;
  for (let row = 0; row < 2; row++) {
    const y = top + row * bh;
    for (let x = row === 0 ? 0 : -bw / 2; x < w; x += bw) {
      fillC(BRICK); ctx.fillRect(x, y, bw, bh);
      fillC(BRICK_HI); ctx.fillRect(x, y, bw, bh * 0.15);
      fillC(MORTAR); ctx.fillRect(x, y + bh * 0.85, bw, bh * 0.15); ctx.fillRect(x, y, bh * 0.15, bh);
    }
  }
}
function drawTitle() {
  const w = L.w, h = L.h, u = Math.min(h, w * 0.6), cx = w / 2;
  drawBackdrop();
  const bandH = u * 0.08;
  drawBrickBand(h - bandH, w, bandH);
  label('STEEL', cx + u * 0.008, h * 0.27 + u * 0.008, u * 0.17, 0x0B3B3B, 'center', 1, 0.06);
  label('STEEL', cx, h * 0.27, u * 0.17, TEXT, 'center', 1, 0.06);
  label('BASTION', cx, h * 0.37, u * 0.07, ACCENT, 'center', 1, 0.45);
  const k = u * 0.11 / 16, ty = h * 0.53;
  ctx.save(); ctx.translate(cx, ty); ctx.scale(k, k); drawTank(0, 0, UP, PLAYER, -1, G.time * 25, 0); ctx.restore();
  KINDS.forEach((kind, i) => {
    const side = i % 2 === 0 ? -1 : 1, ex = cx + side * u * (0.32 + Math.floor(i / 2) * 0.2);
    const bob = Math.sin(G.time * 2 + i) * u * 0.006;
    ctx.save(); ctx.translate(ex, ty + bob); ctx.scale(k * 0.8, k * 0.8);
    drawTank(0, 0, side < 0 ? RIGHT : LEFT, kind.color, i, G.time * 12, 0);
    ctx.restore();
  });
  if ((((G.time * 1.6) | 0) & 1) === 0) label(touchMode ? 'TOCA PARA EMPEZAR' : 'PULSA ENTER O HAZ CLIC PARA EMPEZAR', cx, h * 0.72, u * 0.055, TEXT);
  label(`RÉCORD  ${G.hiScore}`, cx, h * 0.8, u * 0.04, ACCENT);
  const hint = touchMode
    ? 'Joystick a la izquierda  ·  Disparo a la derecha  ·  Protege el núcleo'
    : 'Flechas / WASD para mover  ·  Espacio para disparar  ·  P pausa  ·  M sonido';
  label(hint, cx, h - bandH - u * 0.035, u * 0.032, MUTED);
}
function drawTally() {
  const w = L.w, h = L.h, u = Math.min(h, w * 0.6), cx = w / 2;
  drawBackdrop();
  label(`SECTOR ${G.stage} ASEGURADO`, cx, h * 0.15, u * 0.075, ACCENT, 'center', 1, 0.12);
  const rowH = u * 0.1, startY = h * 0.3;
  const colIcon = cx - u * 0.42, colName = cx - u * 0.33, colCount = cx + u * 0.12, colPts = cx + u * 0.45;
  let total = 0;
  for (let i = 0; i < KINDS.length; i++) {
    if (G.tallyTime < 0.4 + i * 0.35) break;
    const y = startY + i * rowH, k = KINDS[i], sc = rowH * 0.7 / 16;
    ctx.save(); ctx.translate(colIcon, y - rowH * 0.25); ctx.scale(sc, sc); drawTank(0, 0, UP, k.color, i, 0, 0); ctx.restore();
    label(k.label, colName, y, u * 0.05, TEXT, 'left');
    label(`× ${G.kills[i]}`, colCount, y, u * 0.05, MUTED, 'right');
    label(String(G.kills[i] * k.points), colPts, y, u * 0.05, TEXT, 'right');
    total += G.kills[i];
  }
  if (G.tallyTime >= 0.4 + KINDS.length * 0.35) {
    const y = startY + KINDS.length * rowH;
    fillC(0x2C3440); ctx.fillRect(colIcon - rowH * 0.4, y - rowH * 0.6, colPts - colIcon + rowH * 0.4, 2 * L.density);
    label('DESTRUIDOS', colName, y, u * 0.05, MUTED, 'left');
    label(String(total), colCount, y, u * 0.05, TEXT, 'right');
    label(`PUNTOS  ${G.score}`, cx, y + rowH * 1.2, u * 0.065, ACCENT);
  }
  if (G.tallyTime > 1.2 && (((G.time * 2) | 0) & 1) === 0) label(touchMode ? 'Toca para continuar' : 'Pulsa Enter para continuar', cx, h * 0.93, u * 0.04, MUTED);
}

/* ============================================================ entrada */
let joyId = -1, fireId = -1;
let held = [];
function resetInputs() { held = []; joyId = -1; fireId = -1; input.releaseAll(); }

function pointerDown(id, x, y) {
  if (G.paused) { onTap(x, y); return; }
  if (G.state === S.TITLE || G.state === S.TALLY || G.state === S.OVER) { onTap(x, y); return; }
  if (inRect(L.pauseRect, x, y)) { resetInputs(); togglePause(); return; }
  if (x < L.w / 2) { if (joyId < 0) { joyId = id; input.joyStart(x, y); } }
  else if (fireId < 0) { fireId = id; input.fireTouch = true; }
}
function pointerUp(id) {
  if (id === joyId) { joyId = -1; input.joyRelease(); }
  if (id === fireId) { fireId = -1; input.fireTouch = false; }
}
canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  canvas.focus();
  sfx.unlock();
  if (e.pointerType === 'touch') touchMode = true;
  try { canvas.setPointerCapture(e.pointerId); } catch (_) { /* opcional */ }
  pointerDown(e.pointerId, e.clientX * dpr, e.clientY * dpr);
});
canvas.addEventListener('pointermove', e => {
  if (e.pointerId === joyId) input.joyMove(e.clientX * dpr, e.clientY * dpr, L.joyR);
});
canvas.addEventListener('pointerup', e => pointerUp(e.pointerId));
canvas.addEventListener('pointercancel', e => pointerUp(e.pointerId));
canvas.addEventListener('contextmenu', e => e.preventDefault());

const KEYDIR = { ArrowUp: UP, KeyW: UP, ArrowRight: RIGHT, KeyD: RIGHT, ArrowDown: DOWN, KeyS: DOWN, ArrowLeft: LEFT, KeyA: LEFT };
const FIRE_KEYS = new Set(['Space', 'KeyJ', 'KeyK', 'Enter', 'NumpadEnter']);
const PAUSE_KEYS = new Set(['KeyP', 'Escape']);
window.addEventListener('keydown', e => {
  const d = KEYDIR[e.code];
  if (d !== undefined || FIRE_KEYS.has(e.code) || PAUSE_KEYS.has(e.code) || e.code === 'KeyM' || e.code === 'KeyQ') {
    e.preventDefault();
    sfx.unlock();
    touchMode = false;
  }
  if (d !== undefined) { if (!held.includes(d)) held.push(d); input.keyDir = held[held.length - 1]; return; }
  if (FIRE_KEYS.has(e.code)) {
    input.fireKey = true;
    if (!e.repeat && (G.paused || G.state === S.TITLE || G.state === S.TALLY || G.state === S.OVER)) confirm();
    return;
  }
  if (PAUSE_KEYS.has(e.code) && !e.repeat) { resetInputs(); togglePause(); return; }
  if (e.code === 'KeyQ' && G.paused) { toTitle(); return; }
  if (e.code === 'KeyM' && !e.repeat) sfx.toggleMute();
});
window.addEventListener('keyup', e => {
  const d = KEYDIR[e.code];
  if (d !== undefined) { held = held.filter(v => v !== d); input.keyDir = held.length ? held[held.length - 1] : -1; return; }
  if (FIRE_KEYS.has(e.code)) input.fireKey = false;
});
window.addEventListener('blur', () => autoPause());
document.addEventListener('visibilitychange', () => { if (document.hidden) autoPause(); });

let padA = false, padStart = false;
function pollPad() {
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  let gp = null;
  for (const p of pads) if (p && p.connected) { gp = p; break; }
  if (!gp) { input.padDir = -1; input.firePad = false; return; }
  const btn = i => !!(gp.buttons[i] && gp.buttons[i].pressed);
  let x = gp.axes[0] || 0, y = gp.axes[1] || 0;
  if (btn(12)) y = -1; if (btn(13)) y = 1; if (btn(14)) x = -1; if (btn(15)) x = 1;
  input.padDir = Math.max(Math.abs(x), Math.abs(y)) < 0.45 ? -1 : Math.abs(x) > Math.abs(y) ? (x > 0 ? RIGHT : LEFT) : (y > 0 ? DOWN : UP);
  const a = btn(0) || btn(2) || btn(5) || btn(7);
  input.firePad = a;
  if (a && !padA) { sfx.unlock(); touchMode = false; if (G.paused || G.state === S.TITLE || G.state === S.TALLY || G.state === S.OVER) confirm(); }
  padA = a;
  const st = btn(9);
  if (st && !padStart) togglePause();
  padStart = st;
}

/* ============================================================ bucle */
const STEP = 1 / 60;
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(0.1, (now - last) / 1000);
  last = now;
  pollPad();
  let n = 0;
  while (acc >= STEP && n < 5) { update(STEP); acc -= STEP; n++; }
  if (n === 5) acc = 0;
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
canvas.focus();
</script>
</body>
