<canvas id="c" tabindex="0" aria-label="Steel Bastion: tank game"></canvas>
<script>
'use strict';
/* =====================================================================
   Steel Bastion (Bastión de Acero) — versión web (HTML5 Canvas, sin dependencias)
   Port de la versión Android. Mapa de 256x256 unidades; tanque = 16x16.
   ===================================================================== */

const UP = 0, RIGHT = 1, DOWN = 2, LEFT = 3;
const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];
const T_EMPTY = 0, T_BRICK = 1, T_STEEL = 2, T_WATER = 3, T_FOREST = 4;
const N = 64;

const rand = (a, b) => a + Math.random() * (b - a);
const clamp01 = v => Math.min(1, Math.max(0, v));
function mulberry32(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ------------------------------------------------------------ terreno */
class Terrain {
  constructor() { this.cells = new Uint8Array(N * N); this.dirty = new Uint8Array(N * N); this.anyDirty = false; this.log = []; }
  get(bx, by) { return (bx < 0 || by < 0 || bx >= N || by >= N) ? T_STEEL : this.cells[by * N + bx]; }
  set(bx, by, t) {
    if (bx < 0 || by < 0 || bx >= N || by >= N) return;
    const i = by * N + bx;
    if (this.cells[i] !== t) { this.cells[i] = t; this.dirty[i] = 1; this.anyDirty = true; this.log.push(i); }
  }
  clear() { this.cells.fill(0); this.dirty.fill(0); this.anyDirty = false; this.log.length = 0; }
  clearDirty() { if (this.anyDirty) { this.dirty.fill(0); this.anyDirty = false; } }
  fillBits(bx, by, w, h, t) { for (let y = by; y < by + h; y++) for (let x = bx; x < bx + w; x++) this.set(x, y, t); }
  fillUnits(x, y, w, h, t) { this.fillBits((x / 4) | 0, (y / 4) | 0, (w / 4) | 0, (h / 4) | 0, t); }
  scan(x, y, w, h, test) {
    const bx0 = Math.max(0, Math.floor(x / 4)), by0 = Math.max(0, Math.floor(y / 4));
    const bx1 = Math.min(N - 1, Math.floor((x + w - 0.001) / 4)), by1 = Math.min(N - 1, Math.floor((y + h - 0.001) / 4));
    for (let by = by0; by <= by1; by++) for (let bx = bx0; bx <= bx1; bx++) if (test(this.cells[by * N + bx])) return true;
    return false;
  }
  blocksTank(x, y, w, h) {
    if (x < 0 || y < 0 || x + w > 256 || y + h > 256) return true;
    return this.scan(x, y, w, h, t => t === T_BRICK || t === T_STEEL || t === T_WATER);
  }
  blocksBullet(x, y, w, h) { return this.scan(x, y, w, h, t => t === T_BRICK || t === T_STEEL); }
  hasHazard(x, y, w, h) { return this.scan(x, y, w, h, t => t === T_STEEL || t === T_WATER); }
}

/* ------------------------------------------------------------ sectores
   .  vacío   B ladrillo   S acero   W agua   F bosque
   l r u d  medio ladrillo     1 2 3 4  medio acero          */
const SECTORS = [
  ['Outpost', [
    '................', '.BBB..B..B..BBB.', '.B............B.', '.B..FF....FF..B.',
    '....FF.SS.FF....', '..BBB......BBB..', '..B....BB....B..', 'WW...B....B...WW',
    'WW...B....B...WW', '..B....BB....B..', '..BBB......BBB..', '....FF....FF....',
    '.B..FF.BB.FF..B.', '.B............B.', '.BBB........BBB.', '................']],
  ['Riverbank', [
    '................', '..SS..B..B..SS..', '..BB..B..B..BB..', '......BBBB......',
    '.FFF........FFF.', '.FFF.BB..BB.FFF.', 'WWWW.BB..BB.WWWW', '................',
    '..B..SS..SS..B..', '..B..........B..', '..BBBB.FF.BBBB..', '.......FF.......',
    '.SS..B....B..SS.', '.....B....B.....', '..B..........B..', '..B..........B..']],
  ['Labyrinth', [
    '................', '.BBBBB....BBBBB.', '.B...B....B...B.', '.B.F.B.SS.B.F.B.',
    '.B...B....B...B.', '.BB.BB.BB.BB.BB.', '................', 'SS.BBBB..BBBB.SS',
    '.....B....B.....', '.FF..B.WW.B..FF.', '.FF....WW....FF.', '...BBB....BBB...',
    '.B.....SS.....B.', '.B.BB......BB.B.', '.B............B.', '................']],
  ['Foundry', [
    '................', '.SSS.BBBBBB.SSS.', '................', 'B.B.B.S..S.B.B.B',
    'B.B.B......B.B.B', '....BBBSSBBB....', '.S............S.', '.S.FFFF..FFFF.S.',
    '.S.FFFF..FFFF.S.', '.S............S.', '....BBB..BBB....', 'BB....S..S....BB',
    '..BB........BB..', 'S...BB....BB...S', '..B..........B..', '..B..........B..']],
  ['Archipelago', [
    '................', '..WW..B..B..WW..', '..WW..B..B..WW..', '......FFFF......',
    'BB..WWW..WWW..BB', '....W......W....', '.FF.W.BBBB.W.FF.', '.FF...B..B...FF.',
    '......B..B......', 'SS..WWW..WWW..SS', '................', '..BBB.FFFF.BBB..',
    '..B..........B..', 'WW...BB..BB...WW', '................', '................']],
  ['Grid', [
    '................', '.SB.BS.BB.SB.BS.', '................', '.BS.SB.SS.BS.SB.',
    '................', '..FFFF....FFFF..', '..F..B.BB.B..F..', '..F..B....B..F..',
    '..FFFF....FFFF..', '................', '.SB.BS.BB.SB.BS.', '................',
    'WW.BB.B..B.BB.WW', '...B........B...', '..BB........BB..', '................']],
  ['Trenches', [
    '................', 'BBBBBB....BBBBBB', '......S..S......', '.BBBBBBuuBBBBBB.',
    '................', 'FF...SSSSSS...FF', 'FF............FF', '..BBBB.dd.BBBB..',
    '..B..........B..', 'WWW..BB..BB..WWW', '................', '.BBBB.BBBB.BBBB.',
    '................', '..SS..l..r..SS..', '..B..........B..', '................']],
  ['Citadel', [
    '................', '..B..........B..', '..B.SSSSSSSS.B..', '....B......B....',
    '.FF.B.BBBB.B.FF.', '.FF.B.B..B.B.FF.', '....B.B..B.B....', 'WW..B......B..WW',
    'WW..BBBuuBBB..WW', '................', 'S.BB..FFFF..BB.S', '..B....SS....B..',
    '..B..........B..', '.....BB..BB.....', '..SS........SS..', '................']],
];
const GREEK = ['Alpha', 'Beta', 'Gamma', 'Delta', 'Epsilon', 'Zeta', 'Eta', 'Theta', 'Iota', 'Kappa', 'Lambda', 'Sigma', 'Omega'];

function applyTile(t, bx, by, c) {
  switch (c) {
    case 'B': t.fillBits(bx, by, 4, 4, T_BRICK); break;
    case 'S': t.fillBits(bx, by, 4, 4, T_STEEL); break;
    case 'W': t.fillBits(bx, by, 4, 4, T_WATER); break;
    case 'F': t.fillBits(bx, by, 4, 4, T_FOREST); break;
    case 'l': t.fillBits(bx, by, 2, 4, T_BRICK); break;
    case 'r': t.fillBits(bx + 2, by, 2, 4, T_BRICK); break;
    case 'u': t.fillBits(bx, by, 4, 2, T_BRICK); break;
    case 'd': t.fillBits(bx, by + 2, 4, 2, T_BRICK); break;
    case '1': t.fillBits(bx, by, 2, 4, T_STEEL); break;
    case '2': t.fillBits(bx + 2, by, 2, 4, T_STEEL); break;
    case '3': t.fillBits(bx, by, 4, 2, T_STEEL); break;
    case '4': t.fillBits(bx, by + 2, 4, 2, T_STEEL); break;
  }
}

function generateSector(stage) {
  const r = mulberry32(stage * 31 + 7);
  const ri = n => Math.floor(r() * n);
  const g = Array.from({ length: 16 }, () => Array(16).fill('.'));
  const put = (x, y, c) => { if (x >= 0 && x <= 7 && y >= 1 && y <= 14) g[y][x] = c; };
  const count = 10 + ri(5);
  for (let n = 0; n < count; n++) {
    const k = ri(100), x = ri(8), y = 1 + ri(13);
    if (k < 42) { const w = 1 + ri(3), h = 1 + ri(2); for (let dy = 0; dy < h; dy++) for (let dx = 0; dx < w; dx++) put(x + dx, y + dy, 'B'); }
    else if (k < 56) { const len = 2 + ri(3); for (let i = 0; i < len; i++) put(x, y + i, 'B'); }
    else if (k < 68) { put(x, y, 'S'); if (r() < 0.5) put(x + 1, y, 'S'); }
    else if (k < 80) { for (let dy = 0; dy < 2; dy++) for (let dx = 0; dx < 2; dx++) put(x + dx, y + dy, 'F'); }
    else if (k < 88) { if (y >= 3 && y <= 11) { put(x, y, 'W'); if (r() < 0.5) put(x + 1, y, 'W'); else put(x, y + 1, 'W'); } }
    else { const c = r() < 0.5 ? 'u' : 'd'; for (let i = 0; i < 3; i++) put(x + i, y, c); }
  }
  const mirror = { l: 'r', r: 'l', '1': '2', '2': '1' };
  for (const row of g) for (let c = 0; c <= 7; c++) row[15 - c] = mirror[row[c]] || row[c];
  return g.map(row => row.join(''));
}

function buildSector(stage, terrain) {
  let name, rows;
  if (stage <= SECTORS.length) { [name, rows] = SECTORS[stage - 1]; }
  else {
    const n = stage - SECTORS.length;
    name = `Zone ${GREEK[(n - 1) % GREEK.length]}-${Math.floor((n - 1) / GREEK.length) + 1}`;
    rows = generateSector(stage);
  }
  for (let ty = 0; ty < 16; ty++) {
    const row = rows[ty] || '';
    for (let tx = 0; tx < 16; tx++) applyTile(terrain, tx * 4, ty * 4, row[tx] || '.');
  }
  return name;
}

/* ------------------------------------------------------------ datos */
const KINDS = [
  { i: 0, label: 'Rover',    speed: 30, hp: 1, bullet: 130, fmin: 0.9, fmax: 2.2, points: 100, color: 0x9DB86A },
  { i: 1, label: 'Dart',     speed: 58, hp: 1, bullet: 140, fmin: 0.8, fmax: 2.0, points: 200, color: 0xF0B03A },
  { i: 2, label: 'Lancer',   speed: 34, hp: 1, bullet: 230, fmin: 0.5, fmax: 1.4, points: 300, color: 0xC46BE8 },
  { i: 3, label: 'Bulwark',  speed: 26, hp: 4, bullet: 150, fmin: 0.8, fmax: 1.9, points: 400, color: 0xE05252 },
];
const POWERS = [
  { id: 'SHIELD',    label: 'SHIELD',          color: 0x5FE3FF },
  { id: 'OVERDRIVE', label: 'OVERDRIVE',       color: 0xFFD84A },
  { id: 'REPAIR',    label: 'EXTRA TANK',      color: 0x7CF08A },
  { id: 'STASIS',    label: 'STASIS',          color: 0xA8D8FF },
  { id: 'FORTIFY',   label: 'STEEL FORT',      color: 0xC9D2DC },
  { id: 'NUKE',      label: 'PULSE',           color: 0xFF6B5A },
];
const makeTank = isPlayer => ({
  isPlayer, kind: KINDS[0], x: 0, y: 0, dir: UP, alive: false, hp: 1, speed: 46, spawnTimer: 0, shield: 0,
  carrier: false, flash: 0, tread: 0, aiTurn: 0, aiFire: 0, stuck: 0, stuckLimit: 0, cooldown: 0, rank: 0,
});
const isActive = t => t.alive && t.spawnTimer <= 0;

/* ------------------------------------------------------------ sonido (sintetizado) */
const SFX = { SHOOT: 0, BRICK: 1, STEEL: 2, EXPLODE: 3, BIG: 4, POWER_APPEAR: 5, PICKUP: 6, ARMOR: 7, STAGE: 8, GAMEOVER: 9, BLIP: 10 };
const RATE = 22050;
function synth(id) {
  const buf = s => new Float32Array(Math.floor(s * RATE));
  const square = (ph, duty = 0.5) => (ph - Math.floor(ph) < duty ? 1 : -1);
  const tri = ph => 1 - 4 * Math.abs(ph - Math.floor(ph) - 0.5);
  const noise = () => Math.random() * 2 - 1;
  const notes = (freqs, each, vol, wave) => {
    const b = buf(each * freqs.length + 0.08), per = Math.floor(each * RATE);
    let ph = 0;
    for (let i = 0; i < b.length; i++) {
      const n = Math.min(Math.floor(i / per), freqs.length - 1), local = (i - n * per) / RATE;
      ph += freqs[n] / RATE;
      b[i] = wave(ph) * vol * Math.exp(-local * 14);
    }
    return b;
  };
  const melody = (freqs, durs, vol, vibrato) => {
    const b = buf(durs.reduce((a, c) => a + c, 0) + 0.1);
    let idx = 0, ph = 0, ph2 = 0;
    freqs.forEach((f, n) => {
      const len = Math.floor(durs[n] * RATE);
      for (let j = 0; j < len && idx < b.length; j++) {
        const t = j / RATE, v = vibrato ? 1 + 0.015 * Math.sin(2 * Math.PI * 6 * t) : 1;
        ph += f * v / RATE; ph2 += f * 2 * v / RATE;
        const env = Math.min(1, t * 200) * Math.exp(-t * (2.5 / durs[n]));
        b[idx++] = (tri(ph) * 0.7 + square(ph2, 0.25) * 0.15) * env * vol;
      }
    });
    return b;
  };
  let b, ph = 0, lp = 0;
  switch (id) {
    case SFX.SHOOT: { const d = 0.11; b = buf(d);
      for (let i = 0; i < b.length; i++) { const t = i / RATE; ph += 880 * (1 - 0.65 * t / d) / RATE; const e = (1 - t / d) ** 2; b[i] = (square(ph) * 0.4 + noise() * 0.08) * e; }
      return b; }
    case SFX.BRICK: b = buf(0.14);
      for (let i = 0; i < b.length; i++) { const t = i / RATE; lp += (noise() - lp) * 0.35; b[i] = lp * Math.exp(-t * 28) * 1.1; }
      return b;
    case SFX.STEEL: b = buf(0.22);
      for (let i = 0; i < b.length; i++) { const t = i / RATE, w = 2 * Math.PI * t; b[i] = (Math.sin(w * 1760) * 0.5 + Math.sin(w * 2640) * 0.3 + Math.sin(w * 3960) * 0.15) * Math.exp(-t * 22) * 0.7; }
      return b;
    case SFX.EXPLODE: { const d = 0.5; b = buf(d);
      for (let i = 0; i < b.length; i++) { const t = i / RATE; lp += (noise() - lp) * (0.6 - 0.52 * t / d); ph += (95 - 60 * t / d) / RATE; b[i] = (lp * 0.9 + Math.sin(2 * Math.PI * ph) * 0.35) * Math.exp(-t * 7); }
      return b; }
    case SFX.BIG: { const d = 1.1; b = buf(d);
      for (let i = 0; i < b.length; i++) { const t = i / RATE; lp += (noise() - lp) * (0.3 - 0.26 * t / d); ph += (60 - 25 * t / d) / RATE; const e = Math.min(1, t * 80) * Math.exp(-t * 3.2); b[i] = (lp * 1.4 + Math.sin(2 * Math.PI * ph) * 0.45 * Math.exp(-t * 4)) * e; }
      return b; }
    case SFX.POWER_APPEAR: return notes([660, 880, 990, 1320], 0.09, 0.45, tri);
    case SFX.PICKUP: return notes([523, 659, 784, 1047, 1319, 1568], 0.07, 0.3, p => square(p, 0.25));
    case SFX.ARMOR: b = buf(0.1);
      for (let i = 0; i < b.length; i++) { const t = i / RATE; ph += 180 / RATE; b[i] = (square(ph) * 0.4 + noise() * 0.3) * Math.exp(-t * 35); }
      return b;
    case SFX.STAGE: return melody([392, 523, 659, 784, 659, 784, 1047], [0.11, 0.11, 0.11, 0.22, 0.11, 0.11, 0.45], 0.4, false);
    case SFX.GAMEOVER: return melody([523, 466, 415, 349], [0.25, 0.25, 0.25, 0.9], 0.45, true);
    default: b = buf(0.06);
      for (let i = 0; i < b.length; i++) { const t = i / RATE; b[i] = Math.sin(2 * Math.PI * 1200 * t) * Math.exp(-t * 50) * 0.5; }
      return b;
  }
}
const sfx = {
  ctx: null, master: null, bufs: [], last: new Array(11).fill(0), muted: false,
  unlock() {
    if (!this.ctx) {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AC();
        this.master = this.ctx.createGain();
        this.master.gain.value = this.muted ? 0 : 0.7;
        this.master.connect(this.ctx.destination);
        for (let i = 0; i < 11; i++) {
          const d = synth(i), b = this.ctx.createBuffer(1, d.length, RATE);
          b.getChannelData(0).set(d);
          this.bufs[i] = b;
        }
      } catch (e) { this.ctx = null; }
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  toggleMute() { this.muted = !this.muted; if (this.master) this.master.gain.value = this.muted ? 0 : 0.7; },
  play(id, vol = 1, rate = 1) {
    netEvent(['a', id, vol, rate]);
    if (!this.ctx || !this.bufs[id]) return;
    const now = performance.now();
    if (now - this.last[id] < 35) return;
    this.last[id] = now;
    try {
      const s = this.ctx.createBufferSource(), g = this.ctx.createGain();
      s.buffer = this.bufs[id]; s.playbackRate.value = rate; g.gain.value = vol * 0.85;
      s.connect(g); g.connect(this.master); s.start();
    } catch (e) { /* sin audio */ }
  },
};

/* ------------------------------------------------------------ estado */
const S = { TITLE: 0, INTRO: 1, PLAYING: 2, CLEAR: 3, TALLY: 4, OVER: 5 };
const CORE_X = 120, CORE_Y = 240, PLAYER_Y = 240, PER_STAGE = 20;
const PLAYER_XS = [80, 160];
const PLAYER_COLORS = [0x35D0C8, 0x7C8CFF];
const SPAWN_X = [120, 240, 0], CARRIERS = [3, 10, 17], MAX_PARTICLES = 500;
const HI_KEYS = ['bastion-hi', 'bastion-hi-coop'];

function loadHi(coop) { try { return parseInt(localStorage.getItem(HI_KEYS[coop ? 1 : 0]) || '0', 10) || 0; } catch (e) { return 0; } }
function storeHi(coop, v) { try { localStorage.setItem(HI_KEYS[coop ? 1 : 0], String(v)); } catch (e) { /* almacenamiento no disponible */ } }

const makePlayer = pid => Object.assign(makeTank(true), { pid, lives: 3, score: 0, respawnTimer: 0, stun: 0, inGame: pid === 0 });

const G = {
  state: S.TITLE, paused: false, terrain: new Terrain(), stage: 1, coop: false, hiScore: loadHi(false), startHi: 0,
  newRecord: false, players: [makePlayer(0), makePlayer(1)], enemies: [], bullets: [], particles: [], popups: [],
  power: null, coreAlive: true, queue: [], spawned: 0, spawnTimer: 0, spawnIdx: 0,
  stasis: 0, fortify: 0, fortifySteel: false, stateTimer: 0, tallyTime: 0, kills: [0, 0, 0, 0], shake: 0,
  time: 0, overReason: '', stageName: '', bannerText: '', bannerTime: 0, waterBlocks: [], terrainEpoch: 0,
};
const teamScore = () => G.players.reduce((a, p) => a + (p.inGame ? p.score : 0), 0);
const otherPlayer = p => G.players[1 - p.pid];

const input = {
  keyDir: -1, padDir: -1, touchDir: -1, fireKey: false, firePad: false, fireTouch: false,
  joyActive: false, joyOX: 0, joyOY: 0, joyKX: 0, joyKY: 0,
  dir() { return this.keyDir >= 0 ? this.keyDir : this.padDir >= 0 ? this.padDir : this.touchDir; },
  fire() { return this.fireKey || this.firePad || this.fireTouch; },

    if (!G.terrain.hasHazard(x, y, 16, 16)) break;

  sfx.play(SFX.POWER_APPEAR);
}
function updatePower(dt) {
  const pw = G.power;
  if (!pw) return;
  pw.life -= dt;
  if (pw.life <= 0) { G.power = null; return; }
  for (const p of G.players) {
    if (!p.inGame || !isActive(p) || !overlap(p.x + 2, p.y + 2, 12, 12, pw.x, pw.y, 16, 16)) continue;
    G.power = null;
    const text = applyPower(pw.type.id, p);
    addScore(p, 500);
    popup(pw.x + 8, pw.y + 6, '500', pw.type.color);
    G.bannerText = text || pw.type.label; G.bannerTime = 1.8;

}
function applyPower(id, p) {
  switch (id) {
    case 'SHIELD': p.shield = Math.max(p.shield, 10); break;
    case 'OVERDRIVE': p.rank = Math.min(3, p.rank + 1); break;
    case 'REPAIR': {
      const mate = otherPlayer(p);
      if (G.coop && mate.inGame && !mate.alive && mate.lives <= 0) {
        mate.lives = 1; resetPlayer(mate, 3);

    }

    case 'FORTIFY': G.fortify = 18; G.fortifySteel = true; buildFortress(T_STEEL); break;
    case 'NUKE':

/* ------------------------------------------------------------ efectos
   En partidas online, el anfitrión registra cada efecto y se lo envía al invitado,
   que los reproduce localmente (partículas y sonidos no forman parte del estado). */
const r1 = v => Math.round(v * 10) / 10;
function netEvent(ev) { if (NET.role === 'host' && NET.events.length < 300) NET.events.push(ev); }
function addParticle(x, y, vx, vy, life, size, color, ring = false) {
  if (G.particles.length < MAX_PARTICLES) G.particles.push({ x, y, vx, vy, life, maxLife: life, size, color, ring });
}
function popup(x, y, text, color) {
  netEvent(['p', r1(x), r1(y), text, color]);
  G.popups.push({ x, y, text, color, life: 1.1 });
}
function muzzle(x, y) {
  netEvent(['m', r1(x), r1(y)]);
  addParticle(x, y, 0, 0, 0.07, 3, 0xFFE9A8);
}
const FIRE_COLORS = [0xFFF3B0, 0xFFC14D, 0xFF7A3D, 0xE04A2F, 0x7D838C];
function explosion(x, y, big) {
  netEvent(['x', r1(x), r1(y), big ? 1 : 0]);
  const n = big ? 28 : 8;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = rand(8, big ? 75 : 40);
    addParticle(x, y, Math.cos(a) * sp, Math.sin(a) * sp, rand(0.25, big ? 0.8 : 0.4), rand(0.8, big ? 2.8 : 1.5), FIRE_COLORS[Math.floor(Math.random() * FIRE_COLORS.length)]);
  }
  if (big) { addParticle(x, y, 0, 0, 0.16, 11, 0xFFF0C0); addParticle(x, y, 26, 0, 0.45, 3, 0xFFD27A, true); }
}
function sparks(x, y, n, color) {
  netEvent(['s', r1(x), r1(y), n, color]);
  for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, sp = rand(25, 70); addParticle(x, y, Math.cos(a) * sp, Math.sin(a) * sp, rand(0.1, 0.25), rand(0.5, 0.9), color); }
}
function debris(x, y, color) {
  netEvent(['d', r1(x), r1(y), color]);
  for (let i = 0; i < 7; i++) { const a = Math.random() * Math.PI * 2, sp = rand(10, 45); addParticle(x, y, Math.cos(a) * sp, Math.sin(a) * sp, rand(0.25, 0.5), rand(0.6, 1.3), color); }
  addParticle(x, y, 0, 0, 0.1, 4, 0xFFE9A8);
}
function applyEvents(list) {
  for (const ev of list) {
    switch (ev[0]) {
      case 'p': G.popups.push({ x: ev[1], y: ev[2], text: ev[3], color: ev[4], life: 1.1 }); break;
      case 'm': addParticle(ev[1], ev[2], 0, 0, 0.07, 3, 0xFFE9A8); break;
      case 'x': explosion(ev[1], ev[2], !!ev[3]); break;
      case 's': sparks(ev[1], ev[2], ev[3], ev[4]); break;
      case 'd': debris(ev[1], ev[2], ev[3]); break;
      case 'a': sfx.play(ev[1], ev[2], ev[3]); break;
    }
  }
}
function updateFx(dt) {
  const damp = Math.max(0, 1 - 3 * dt);
  for (const p of G.particles) {
    p.life -= dt;
    if (p.ring) continue;
    p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= damp; p.vy *= damp;
  }
  G.particles = G.particles.filter(p => p.life > 0);
  for (const p of G.popups) { p.life -= dt; p.y -= 12 * dt; }
  G.popups = G.popups.filter(p => p.life > 0);
}

/* ============================================================ pantalla y dibujo */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let dpr = 1;
let touchMode = (navigator.maxTouchPoints || 0) > 0 && window.matchMedia('(pointer: coarse)').matches;

const rect = () => ({ l: 0, t: 0, r: 0, b: 0 });
const L = {
  w: 0, h: 0, density: 1, portrait: false, mapX: 0, mapY: 0, mapSize: 0, scale: 1,
  left: rect(), right: rect(), joyX: 0, joyY: 0, joyR: 0, fireX: 0, fireY: 0, fireR: 0, font: 16,
  pauseRect: rect(), resumeRect: rect(), quitRect: rect(),
};
const setR = (o, l, t, r, b) => { o.l = l; o.t = t; o.r = r; o.b = b; };
const inRect = (o, x, y) => x >= o.l && x <= o.r && y >= o.t && y <= o.b;
const rw = o => o.r - o.l, rcx = o => (o.l + o.r) / 2, rcy = o => (o.t + o.b) / 2;

function computeLayout(w, h, density) {
  L.w = w; L.h = h; L.density = density;
  L.portrait = w < h;
  if (!L.portrait) {
    L.mapSize = Math.min(h * 0.96, w * 0.6);
    L.mapX = (w - L.mapSize) / 2; L.mapY = (h - L.mapSize) / 2;
    setR(L.left, 0, 0, L.mapX, h);
    setR(L.right, L.mapX + L.mapSize, 0, w, h);
    const side = rw(L.left);
    L.font = Math.min(Math.max(Math.min(side * 0.11, h * 0.045), 10 * density), 30 * density);
    L.joyR = Math.min(side * 0.33, h * 0.17);
    L.joyX = rcx(L.left); L.joyY = h - L.joyR - L.font * 1.2;
    L.fireR = L.joyR * 0.9;
    L.fireX = rcx(L.right); L.fireY = h - L.fireR - L.font * 1.2;
    const ps = Math.max(L.font * 2.2, 42 * density), m = L.font * 0.7;
    setR(L.pauseRect, m, m, m + ps, m + ps);
  } else {
    L.font = Math.min(Math.max(w * 0.04, 10 * density), 26 * density);
    const top = L.font * 3.4;
    L.mapSize = Math.min(w * 0.98, h * 0.6);
    L.mapX = (w - L.mapSize) / 2; L.mapY = top;
    setR(L.left, 0, 0, w / 2, top); setR(L.right, w / 2, 0, w, top);
    const below = L.mapY + L.mapSize, rem = h - below;
    L.joyR = Math.min(w * 0.2, rem * 0.38);
    L.joyX = w * 0.25; L.joyY = below + rem / 2;
    L.fireR = L.joyR * 0.9; L.fireX = w * 0.75; L.fireY = L.joyY;
    const ps = Math.max(L.font * 2, 42 * density);
    setR(L.pauseRect, L.font * 0.5, L.font * 0.6, L.font * 0.5 + ps, L.font * 0.6 + ps);
  }
  L.scale = L.mapSize / 256;
  const bh = Math.max(L.font * 2.6, 48 * density), bw = Math.min(w * 0.86, Math.max(L.font * 10, bh * 5)), cx = w / 2, cy = h / 2;
  setR(L.resumeRect, cx - bw / 2, cy - bh * 0.2, cx + bw / 2, cy + bh * 0.8);
  setR(L.quitRect, cx - bw / 2, cy + bh * 1.1, cx + bw / 2, cy + bh * 2.1);
}

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  const w = Math.max(1, Math.floor(window.innerWidth * dpr)), h = Math.max(1, Math.floor(window.innerHeight * dpr));
  canvas.width = w; canvas.height = h;
  computeLayout(w, h, dpr);
}
window.addEventListener('resize', resize);
resize();

/* ---------- colores */
const BG = 0x0A0D12, FLOOR = 0x151A21, GRID = 0x1B212A, PLAYER = 0x35D0C8, ACCENT = 0xF0B03A, TEXT = 0xE8EEF5,
  MUTED = 0x8C96A3, TREAD = 0x1C2026, LINK = 0x3A414B, METAL = 0xD7DEE6, BRICK = 0xB5583A, BRICK_HI = 0xD07A55,
  MORTAR = 0x5E2C1E, STEEL = 0x8A96A8, STEEL_HI = 0xC6D0DD, STEEL_LO = 0x4E5868, STEEL_IN = 0xA3AFBF;
const BULWARK_HP = [0xB0B6BE, 0xE0A040, 0xE07040, 0xE05252];
const css = (c, a = 1) => `rgba(${c >> 16 & 255},${c >> 8 & 255},${c & 255},${a})`;
const shade = (c, f) => { const k = 1 - f; return (((c >> 16 & 255) * k) << 16) | (((c >> 8 & 255) * k) << 8) | (((c & 255) * k) | 0); };
const tint = (c, f) => { const r = c >> 16 & 255, g = c >> 8 & 255, b = c & 255; return ((r + (255 - r) * f) << 16) | ((g + (255 - g) * f) << 8) | ((b + (255 - b) * f) | 0); };
const FONT = '"Roboto Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif';

function fillC(c, a = 1) { ctx.fillStyle = css(c, a); }
function circle(c2, x, y, r) { c2.beginPath(); c2.arc(x, y, r, 0, Math.PI * 2); }
function rrPath(c2, x, y, w, h, r) {
  c2.beginPath();
  c2.moveTo(x + r, y); c2.lineTo(x + w - r, y); c2.arcTo(x + w, y, x + w, y + r, r);
  c2.lineTo(x + w, y + h - r); c2.arcTo(x + w, y + h, x + w - r, y + h, r);
  c2.lineTo(x + r, y + h); c2.arcTo(x, y + h, x, y + h - r, r);
  c2.lineTo(x, y + r); c2.arcTo(x, y, x + r, y, r); c2.closePath();
}
function label(s, x, y, size, color, align = 'center', alpha = 1, spacing = 0) {
  ctx.font = `bold ${size}px ${FONT}`;
  ctx.fillStyle = css(color, alpha);
  ctx.textBaseline = 'alphabetic';
  if (!spacing) { ctx.textAlign = align; ctx.fillText(s, x, y); return; }
  const sp = size * spacing, chars = [...s];
  const ws = chars.map(c => ctx.measureText(c).width);
  const total = ws.reduce((a, c) => a + c, 0) + sp * (chars.length - 1);
  let cx = align === 'center' ? x - total / 2 : align === 'right' ? x - total : x;
  ctx.textAlign = 'left';
  chars.forEach((c, i) => { ctx.fillText(c, cx, y); cx += ws[i] + sp; });
}

/* ---------- terreno pre-renderizado */
const terrainCv = document.createElement('canvas'), tctx = terrainCv.getContext('2d');
const forestCv = document.createElement('canvas'), fctx = forestCv.getContext('2d');
let bmpPx = 0, builtEpoch = -1, forestEpoch = -1;

function ensureBitmaps() {
  // Cada bit del terreno ocupa un número entero de píxeles (evita restos al borrar).
  const px = N * Math.max(1, Math.round(L.mapSize / N));
  if (px === bmpPx) return;
  bmpPx = px;
  for (const [cv, c2] of [[terrainCv, tctx], [forestCv, fctx]]) {
    cv.width = px; cv.height = px;
    c2.setTransform(px / 256, 0, 0, px / 256, 0, 0);
  }
  builtEpoch = -1; forestEpoch = -1;
}
function drawBit(bx, by, v) {
  const x = bx * 4, y = by * 4, c = tctx;
  c.clearRect(x, y, 4, 4);
  if (v === T_BRICK) {
    c.fillStyle = css(BRICK); c.fillRect(x, y, 4, 4);
    c.fillStyle = css(BRICK_HI); c.fillRect(x, y, 4, 0.7);
    c.fillStyle = css(MORTAR); c.fillRect(x, y + 3.3, 4, 0.7);
    if ((bx & 1) === (by & 1)) c.fillRect(x, y, 0.7, 4);
  } else if (v === T_STEEL) {
    const ox = (bx >> 1) * 8, oy = (by >> 1) * 8;
    c.save(); c.beginPath(); c.rect(x, y, 4, 4); c.clip();
    c.fillStyle = css(STEEL); c.fillRect(ox, oy, 8, 8);
    c.fillStyle = css(STEEL_HI); c.fillRect(ox, oy, 8, 1); c.fillRect(ox, oy, 1, 8);
    c.fillStyle = css(STEEL_LO); c.fillRect(ox, oy + 7, 8, 1); c.fillRect(ox + 7, oy, 1, 8);
    c.fillStyle = css(STEEL_IN); c.fillRect(ox + 2.2, oy + 2.2, 3.6, 3.6);
    c.restore();
  }
}
function syncTerrain() {
  const t = G.terrain;
  if (builtEpoch !== G.terrainEpoch) {
    tctx.save(); tctx.setTransform(1, 0, 0, 1, 0, 0); tctx.clearRect(0, 0, bmpPx, bmpPx); tctx.restore();
    for (let i = 0; i < N * N; i++) { const v = t.cells[i]; if (v === T_BRICK || v === T_STEEL) drawBit(i % N, (i / N) | 0, v); }
    t.clearDirty(); builtEpoch = G.terrainEpoch;
  } else if (t.anyDirty) {
    for (let i = 0; i < N * N; i++) if (t.dirty[i]) drawBit(i % N, (i / N) | 0, t.cells[i]);
    t.clearDirty();
  }
  if (forestEpoch !== G.terrainEpoch) { forestEpoch = G.terrainEpoch; buildForest(); }
}
function buildForest() {
  const c = fctx, t = G.terrain;
  c.save(); c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, bmpPx, bmpPx); c.restore();
  const dots = (list, color) => { c.fillStyle = color; for (const [x, y, r] of list) { circle(c, x, y, r); c.fill(); } };
  for (let pass = 0; pass < 2; pass++) {
    for (let by = 0; by < 32; by++) for (let bx = 0; bx < 32; bx++) {
      if (t.get(bx * 2, by * 2) !== T_FOREST) continue;
      const ox = bx * 8, oy = by * 8;
      if (pass === 0) {
        dots([[ox + 2, oy + 2.2, 2.8], [ox + 6.2, oy + 2.8, 2.7], [ox + 2.6, oy + 6.2, 2.7], [ox + 6.4, oy + 6.4, 2.6]], 'rgba(35,79,42,0.94)');
        c.fillRect(ox + 1, oy + 1, 6, 6);
      } else {
        dots([[ox + 2, oy + 2, 1.6], [ox + 6, oy + 2.6, 1.5], [ox + 2.4, oy + 6, 1.5], [ox + 6.2, oy + 6.2, 1.4]], css(0x3F8A43));
        dots([[ox + 1.6, oy + 1.5, 0.6], [ox + 5.6, oy + 2.1, 0.6], [ox + 2, oy + 5.5, 0.55]], css(0x6CC067));
      }
    }
  }
}

/* ---------- dibujo principal */
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  fillC(BG); ctx.fillRect(0, 0, L.w, L.h);
  if (G.state === S.TITLE) { drawTitle(); return; }
  if (G.state === S.TALLY) { drawTally(); return; }
  ensureBitmaps();
  syncTerrain();
  drawWorld();
  drawHud();
  if (!G.paused && G.state !== S.OVER) { if (touchMode) drawControls(); else drawKeyHints(); }
  if (G.state === S.INTRO) drawIntro();
  else if (G.state === S.OVER) drawOver();
  if (G.paused) drawPause();
}

function drawWorld() {
  ctx.save();
  if (G.shake > 0) { const m = G.shake * 7 * L.scale; ctx.translate((Math.random() - 0.5) * m, (Math.random() - 0.5) * m); }
  ctx.translate(L.mapX, L.mapY);
  ctx.scale(L.scale, L.scale);
  ctx.beginPath(); ctx.rect(0, 0, 256, 256); ctx.clip();
  fillC(FLOOR); ctx.fillRect(0, 0, 256, 256);
  fillC(GRID);
  for (let i = 1; i < 16; i++) { const v = i * 16; ctx.fillRect(v - 0.2, 0, 0.4, 256); ctx.fillRect(0, v - 0.2, 256, 0.4); }
  drawWater();
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(terrainCv, 0, 0, 256, 256);
  drawCore();
  for (const e of G.enemies) if (e.alive) drawTankEntity(e);
  for (const p of G.players) if (p.inGame && p.alive) drawTankEntity(p);
  for (const b of G.bullets) drawBullet(b);
  ctx.drawImage(forestCv, 0, 0, 256, 256);
  if (G.power) drawPowerUp(G.power);
  drawParticles();
  for (const p of G.popups) label(p.text, p.x, p.y, 6, p.color, 'center', clamp01(p.life / 0.4));
  if (G.bannerTime > 0) {
    const a = clamp01(G.bannerTime / 0.4);
    label(G.bannerText, 128.8, 31, 13, 0x000000, 'center', a * 0.66, 0.12);
    label(G.bannerText, 128, 30, 13, ACCENT, 'center', a, 0.12);
  }
  ctx.restore();
  ctx.strokeStyle = css(0x2C3440); ctx.lineWidth = 2 * L.density;
  ctx.strokeRect(L.mapX - 1, L.mapY - 1, L.mapSize + 2, L.mapSize + 2);
}

function drawWater() {
  if (!G.waterBlocks.length) return;
  fillC(0x17406B);
  for (const code of G.waterBlocks) ctx.fillRect((code % 32) * 8, ((code / 32) | 0) * 8, 8, 8);
  ctx.strokeStyle = css(0x3C7DBA); ctx.lineWidth = 0.6; ctx.lineCap = 'round';
  ctx.beginPath();
  for (const code of G.waterBlocks) {
    const ox = (code % 32) * 8, oy = ((code / 32) | 0) * 8;
    const ph = Math.sin(G.time * 2.2 + ox * 0.15 + oy * 0.23);
    const x0 = ox + 1.2 + ph * 1.2, x1 = ox + 3.6 - ph * 1.2;
    ctx.moveTo(x0, oy + 2.6); ctx.lineTo(x0 + 3, oy + 2.6);
    ctx.moveTo(x1, oy + 6); ctx.lineTo(x1 + 3, oy + 6);
  }
  ctx.stroke();
}

function hexPath(cx, cy, r) {
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = Math.PI / 3 * i - Math.PI / 2, x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
}
function drawCore() {
  const cx = CORE_X + 8, cy = CORE_Y + 8;
  if (G.coreAlive) {
    const pulse = 0.5 + 0.5 * Math.sin(G.time * 3);
    fillC(0x4DE0FF, (40 + 50 * pulse) / 255); circle(ctx, cx, cy, 7.5 + pulse); ctx.fill();
    hexPath(cx, cy, 6.8); fillC(0x1E2A36); ctx.fill();
    ctx.strokeStyle = css(0x4DE0FF); ctx.lineWidth = 0.7; ctx.stroke();
    hexPath(cx, cy, 4); fillC(0x2E4A5E); ctx.fill();
    ctx.lineWidth = 0.4; ctx.beginPath();
    for (let i = 0; i < 3; i++) { const a = G.time * 1.5 + i * 2.094; ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a) * 4, cy + Math.sin(a) * 4); }
    ctx.stroke();
    fillC(0xBFF6FF); circle(ctx, cx, cy, 2 + pulse * 0.7); ctx.fill();
  } else {
    hexPath(cx, cy, 6.8); fillC(0x26272B); ctx.fill();
    ctx.strokeStyle = css(0x55555C); ctx.lineWidth = 0.6; ctx.stroke();
    ctx.strokeStyle = css(0x111114); ctx.lineWidth = 0.5; ctx.beginPath();
    ctx.moveTo(cx - 4, cy - 3); ctx.lineTo(cx + 1, cy + 1); ctx.lineTo(cx + 4, cy - 2);
    ctx.moveTo(cx + 1, cy + 1); ctx.lineTo(cx - 1, cy + 5); ctx.stroke();
    fillC(((G.time * 9) | 0) & 1 ? 0xB8361F : 0xFF6A3D);
    circle(ctx, cx - 2, cy + 2, 0.7); ctx.fill(); circle(ctx, cx + 2.5, cy - 1, 0.5); ctx.fill();
  }
}

const enemyColor = e => e.kind.i === 3 ? BULWARK_HP[Math.min(3, Math.max(0, e.hp - 1))] : e.kind.color;

function drawTankEntity(t) {
  const cx = t.x + 8, cy = t.y + 8;
  if (t.spawnTimer > 0) { drawWarp(cx, cy, t.isPlayer); return; }
  let body = t.isPlayer ? PLAYER_COLORS[t.pid] : enemyColor(t);
  if (!t.isPlayer && t.carrier && (((G.time * 7) | 0) & 1) === 0) body = 0xFF6FD8;
  if (t.flash > 0) body = 0xFFFFFF;
  drawTank(cx, cy, t.dir, body, t.isPlayer ? -1 - t.pid : t.kind.i, t.tread, t.rank);
  if (t.isPlayer && t.stun > 0) {
    fillC(0xFFE45C);
    for (let i = 0; i < 3; i++) { const a = G.time * 6 + i * 2.094; circle(ctx, cx + Math.cos(a) * 7, cy - 10 + Math.sin(a) * 2, 1.1); ctx.fill(); }
  }
  if (t.isPlayer && G.coop) label(`P${t.pid + 1}`, cx, cy - 10.5, 5, tint(PLAYER_COLORS[t.pid], 0.3), 'center', 0.9);
  if (!t.isPlayer && G.stasis > 0) {
    fillC(0xA8D8FF, 0.4); rrPath(ctx, cx - 8, cy - 8, 16, 16, 2); ctx.fill();
    ctx.strokeStyle = css(0xE6F6FF, 0.8); ctx.lineWidth = 0.4; ctx.beginPath();
    ctx.moveTo(cx - 5, cy - 5); ctx.lineTo(cx - 2, cy - 2); ctx.moveTo(cx + 3, cy + 1); ctx.lineTo(cx + 6, cy + 4); ctx.stroke();

  const bh = Math.max(u * 0.07, (touchMode ? 48 : 36) * d), gap = bh * 0.28;
  const bw = Math.min(w * 0.88, Math.max(u * 0.75, bh * 8));
  const menuH = TITLE_OPTS.length * bh + (TITLE_OPTS.length - 1) * gap;
  const noticeH = NET.notice && NET.noticeTime > 0 ? best * 2.2 : 0;
  let showTanks = true;
  const headH = () => logo + sub * 1.6 + (showTanks ? tank * 1.9 : 0) + best * 2.3;
  const avail = bottom - h * 0.06 - menuH - noticeH;
  if (headH() > avail) showTanks = false;
  if (headH() > avail) { const k = Math.max(0.45, avail / headH()); logo *= k; sub *= k; }
  let y = Math.max(h * 0.03, (bottom - (headH() + menuH + noticeH)) / 2);

  const lb = y + logo * 0.8;
  label('STEEL', cx + logo * 0.05, lb + logo * 0.05, logo, 0x0B3B3B, 'center', 1, 0.06);
  label('STEEL', cx, lb, logo, TEXT, 'center', 1, 0.06);
  y += logo;
  label('BASTION', cx, y + sub * 1.15, sub, ACCENT, 'center', 1, 0.45);
  y += sub * 1.6;
  if (showTanks) {
    const ty = y + tank * 0.95, k = tank / 16, spread = Math.min(u, w * 0.92);
    ctx.save(); ctx.translate(cx - tank * 0.58, ty); ctx.scale(k, k); drawTank(0, 0, UP, PLAYER_COLORS[0], -1, G.time * 25, 0); ctx.restore();
    ctx.save(); ctx.translate(cx + tank * 0.58, ty); ctx.scale(k, k); drawTank(0, 0, UP, PLAYER_COLORS[1], -2, G.time * 25, 0); ctx.restore();
    KINDS.forEach((kind, i) => {
      const side = i % 2 === 0 ? -1 : 1, ex = cx + side * spread * (0.27 + Math.floor(i / 2) * 0.15);
      const bob = Math.sin(G.time * 2 + i) * u * 0.006;
      ctx.save(); ctx.translate(ex, ty + bob); ctx.scale(k * 0.8, k * 0.8);
      drawTank(0, 0, side < 0 ? RIGHT : LEFT, kind.color, i, G.time * 12, 0);
      ctx.restore();
    });
    y += tank * 1.9;
  }
  const bestText = `BEST  ${loadHi(false)}   ·   CO-OP BEST  ${loadHi(true)}`;
  label(bestText, cx, y + best * 1.1, fitSize(bestText, best, w * 0.9), ACCENT);
  y += best * 2.3;

  titleRects.length = 0;
  TITLE_OPTS.forEach((o, i) => {
    const r = { id: o.id, l: cx - bw / 2, t: y, r: cx + bw / 2, b: y + bh };
    titleRects.push(r);
    const sel = i === titleSel;
    rrPath(ctx, r.l, r.t, bw, bh, bh * 0.3);
    fillC(i === 0 ? PLAYER : PLAYER_COLORS[1], sel ? 0.3 : 0.1); ctx.fill();
    ctx.strokeStyle = css(i === 0 ? PLAYER : PLAYER_COLORS[1], sel ? 1 : 0.5); ctx.lineWidth = Math.max(1.5, bh * 0.05); ctx.stroke();
    const ts = fitSize(o.label, bh * 0.38, bw * 0.86);
    label(o.label, cx, y + bh / 2 + ts * 0.36, ts, TEXT, 'center', sel ? 1 : 0.8, 0.04);
    y += bh + gap;
  });
  if (noticeH) label(NET.notice, cx, y + best * 0.9, fitSize(NET.notice, best, w * 0.92), 0xFF9A80);
  label(hint, cx, h - bandH - hintSize * 0.9, hintSize, MUTED);
}
function drawTally() {
  const w = L.w, h = L.h, u = screenUnit(), cx = w / 2;
  drawBackdrop();
  label(`SECTOR ${G.stage} SECURED`, cx, h * 0.15, u * 0.075, ACCENT, 'center', 1, 0.12);
  const rowH = u * 0.09, startY = h * 0.28;
  const colIcon = cx - u * 0.42, colName = cx - u * 0.33, colCount = cx + u * 0.12, colPts = cx + u * 0.45;
  let total = 0;
  for (let i = 0; i < KINDS.length; i++) {
    if (G.tallyTime < 0.4 + i * 0.35) break;
    const y = startY + i * rowH, k = KINDS[i], sc = rowH * 0.7 / 16;
    ctx.save(); ctx.translate(colIcon, y - rowH * 0.25); ctx.scale(sc, sc); drawTank(0, 0, UP, k.color, i, 0, 0); ctx.restore();
    label(k.label, colName, y, u * 0.05, TEXT, 'left');
    label(`× ${G.kills[i]}`, colCount, y, u * 0.05, MUTED, 'right');
    label(String(G.kills[i] * k.points), colPts, y, u * 0.05, TEXT, 'right');
    total += G.kills[i];
  }
  if (G.tallyTime >= 0.4 + KINDS.length * 0.35) {
    let y = startY + KINDS.length * rowH;
    fillC(0x2C3440); ctx.fillRect(colIcon - rowH * 0.4, y - rowH * 0.6, colPts - colIcon + rowH * 0.4, 2 * L.density);
    label('DESTROYED', colName, y, u * 0.05, MUTED, 'left');
    label(String(total), colCount, y, u * 0.05, TEXT, 'right');
    y += rowH * 1.2;
    if (G.coop) {
      label(`PLAYER 1  ${G.players[0].score}`, cx - u * 0.2, y, u * 0.05, PLAYER_COLORS[0]);
      label(`PLAYER 2  ${G.players[1].score}`, cx + u * 0.2, y, u * 0.05, PLAYER_COLORS[1]);
      y += rowH;
      label(`TEAM SCORE  ${teamScore()}`, cx, y, u * 0.065, ACCENT);
    } else label(`SCORE  ${teamScore()}`, cx, y, u * 0.065, ACCENT);
  }
  if (G.tallyTime > 1.2 && (((G.time * 2) | 0) & 1) === 0) label(continueText(), cx, h * 0.94, u * 0.04, MUTED);
}

/* ============================================================ red (cooperativo online)
   El anfitrión ejecuta la simulación completa; el invitado envía sus controles y dibuja
   el estado que recibe. La conexión es directa entre navegadores (WebRTC) mediante PeerJS. */
const PEERJS_URL = 'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';
const PEER_PREFIX = 'brightorbit-steelbastion-';
const CODE_CHARS = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const ENEMY_OWNER = { isPlayer: false };
const NET = {
  role: null, peer: null, conn: null, code: '', events: [], reserve: 0, ping: 0, pingTimer: 0,
  notice: '', noticeTime: 0, sentDir: -2, sentFire: null, snapAcc: 0, lastEpochSent: -1,
  joinTimer: 0, leaving: false,
  send(msg) { try { if (this.conn && this.conn.open) this.conn.send(msg); } catch (e) { /* canal cerrado */ } },
};

function loadPeerJS() {
  return new Promise((resolve, reject) => {
    if (window.Peer) { resolve(); return; }
    const s = document.createElement('script');
    s.src = PEERJS_URL; s.async = true;
    s.onload = () => (window.Peer ? resolve() : reject(new Error('PeerJS unavailable')));
    s.onerror = () => reject(new Error('PeerJS failed to load'));
    document.head.appendChild(s);
  });
}
function makeCode() { let c = ''; for (let i = 0; i < 5; i++) c += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]; return c; }
const inviteLink = code => `${location.origin}${location.pathname}#join-${code}`;

function netCleanup() {
  clearTimeout(NET.joinTimer);
  const { conn, peer } = NET;
  NET.conn = null; NET.peer = null; NET.role = null; NET.events = []; NET.ping = 0;
  NET.sentDir = -2; NET.sentFire = null; NET.lastEpochSent = -1;
  remoteInput.d = -1; remoteInput.f = false;
  try { if (conn) conn.close(); } catch (e) { /* ya cerrada */ }
  try { if (peer) peer.destroy(); } catch (e) { /* ya cerrado */ }
}
function setNotice(text) { NET.notice = text; NET.noticeTime = 7; }
function netErrorText(err) {
  switch (err && err.type) {
    case 'peer-unavailable': return 'Room not found. Check the code and make sure your friend is still waiting.';
    case 'network': case 'server-error': case 'socket-error': case 'socket-closed':
      return 'Couldn’t reach the online service. Check your internet connection.';
    case 'browser-incompatible': return 'This browser doesn’t support online play.';
    default: return 'Couldn’t connect. Please try again.';
  }
}

async function hostRoom(attempt = 0) {
  lobbyOpen('host');
  lobbySetMsg('Creating room…');
  try { await loadPeerJS(); } catch (e) { lobbySetMsg('Couldn’t load the online service. Check your connection and try again.', true); return; }
  if (lobby.mode !== 'host') return;
  netCleanup();
  const code = makeCode();
  const peer = new Peer(PEER_PREFIX + code, { debug: 0 });
  NET.peer = peer; NET.code = code;
  peer.on('open', () => {
    if (NET.peer !== peer) return;
    lobbyShowCode(code);
    lobbySetMsg('Send this code or the invite link to your friend. Waiting for them to join…');
  });
  peer.on('connection', conn => {
    if (NET.conn) {
      conn.on('open', () => { try { conn.send({ t: 'full' }); } catch (e) { /* nada */ } setTimeout(() => conn.close(), 500); });
      return;
    }
    setupConn(conn, 'host');
  });
  peer.on('error', err => {
    if (NET.peer !== peer) return;
    if (err.type === 'unavailable-id' && attempt < 3) { hostRoom(attempt + 1); return; }
    if (NET.role) return;
    lobbySetMsg(netErrorText(err), true);
  });
}

async function joinRoom(raw) {
  const code = String(raw || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (code.length !== 5) { lobbySetMsg('Enter the 5-character room code.', true); return; }
  lobbySetMsg('Connecting…');
  lobbyBusy(true);
  try { await loadPeerJS(); } catch (e) { lobbyBusy(false); lobbySetMsg('Couldn’t load the online service. Check your connection and try again.', true); return; }
  if (lobby.mode !== 'join') return;
  netCleanup();
  const peer = new Peer({ debug: 0 });
  NET.peer = peer;
  peer.on('open', () => {
    if (NET.peer !== peer) return;
    const conn = peer.connect(PEER_PREFIX + code, { reliable: true, serialization: 'json' });
    setupConn(conn, 'guest');
    NET.joinTimer = setTimeout(() => {
      if (NET.role || NET.peer !== peer) return;
      lobbyBusy(false);
      lobbySetMsg('Couldn’t connect. Your networks may not allow a direct connection between browsers. Try again or use another network.', true);
      netCleanup();
    }, 15000);
  });
  peer.on('error', err => {
    if (NET.peer !== peer || NET.role) return;
    clearTimeout(NET.joinTimer);
    lobbyBusy(false);
    lobbySetMsg(netErrorText(err), true);
  });
}

function setupConn(conn, role) {
  conn.on('open', () => {
    clearTimeout(NET.joinTimer);
    NET.conn = conn; NET.role = role; NET.leaving = false; NET.notice = '';
    lobbyClose(true);
    resetInputs();
    remoteInput.d = -1; remoteInput.f = false;
    if (role === 'host') startGame(true);
    else { G.coop = true; G.state = S.INTRO; G.stateTimer = 2; G.paused = false; G.players[1].inGame = true; }
    if (location.hash) history.replaceState(null, '', location.pathname + location.search);
  });
  conn.on('data', msg => onNetMessage(msg));
  conn.on('close', () => onNetClosed());
  conn.on('error', () => onNetClosed());
}

function onNetMessage(m) {
  if (!m || typeof m !== 'object') return;
  switch (m.t) {
    case 's': if (NET.role === 'guest') applySnapshot(m); break;
    case 'i': if (NET.role === 'host') { remoteInput.d = m.d | 0; remoteInput.f = !!m.f; } break;
    case 'p': if (NET.role === 'host') { if (G.paused) resumeGame(); else pauseGame(); } break;
    case 'c': if (NET.role === 'host') hostConfirm(); break;
    case 'q': onNetClosed('Your friend left the game.'); break;
    case 'ping': NET.send({ t: 'pong', ts: m.ts }); break;
    case 'pong': NET.ping = performance.now() - m.ts; break;
    case 'full': lobbyBusy(false); lobbySetMsg('This room already has two players.', true); netCleanup(); break;
  }
}

function onNetClosed(reason) {
  if (NET.leaving) return;
  if (!NET.role) { // aún en la sala de espera
    if (lobby.mode === 'join') { lobbyBusy(false); lobbySetMsg('Connection closed. Check the code and try again.', true); netCleanup(); }
    return;
  }
  netCleanup();
  toTitle();
  setNotice(reason || 'Connection lost: your friend disconnected.');
}
function leaveGame() {
  if (NET.role) {
    NET.send({ t: 'q' });
    NET.leaving = true;
    const { conn, peer } = NET;
    NET.conn = null; NET.peer = null; NET.role = null;
    setTimeout(() => { try { conn && conn.close(); } catch (e) { /* nada */ } try { peer && peer.destroy(); } catch (e) { /* nada */ } NET.leaving = false; }, 250);
  }
  remoteInput.d = -1; remoteInput.f = false;
  toTitle();
}

/* ---------- instantáneas del anfitrión */
function encodeTerrain() {
  let s = '';
  const c = G.terrain.cells;
  for (let i = 0; i < c.length; i += 2048) s += String.fromCharCode.apply(null, c.subarray(i, i + 2048));
  return btoa(s);
}
function decodeTerrain(b64) {
  const s = atob(b64), t = G.terrain;
  t.clear();
  for (let i = 0; i < s.length && i < t.cells.length; i++) t.cells[i] = s.charCodeAt(i);
}
function buildSnapshot() {
  const s = {
    t: 's', st: G.state, ps: G.paused ? 1 : 0, tm: r1(G.stateTimer), tt: r1(G.tallyTime), stg: G.stage, nm: G.stageName,
    core: G.coreAlive ? 1 : 0, sta: r1(G.stasis), fo: r1(G.fortify), sh: r1(G.shake),
    bn: G.bannerTime > 0 ? [G.bannerText, r1(G.bannerTime)] : 0, rv: reserve(), k: G.kills, hi: G.hiScore,
    nr: G.newRecord ? 1 : 0, or: G.overReason,
    pl: G.players.map(p => [p.inGame ? 1 : 0, p.alive ? 1 : 0, r1(p.x), r1(p.y), p.dir, r1(p.spawnTimer), r1(p.shield), r1(p.flash), r1(p.tread), p.rank, r1(p.stun), p.lives, p.score]),
    en: G.enemies.filter(e => e.alive).map(e => [e.kind.i, r1(e.x), r1(e.y), e.dir, e.hp, r1(e.spawnTimer), r1(e.flash), r1(e.tread), e.carrier ? 1 : 0]),
    bu: G.bullets.map(b => [r1(b.x), r1(b.y), b.dir, b.owner.isPlayer ? b.owner.pid + 1 : 0, b.power ? 1 : 0]),
    pw: G.power ? [G.power.x, G.power.y, POWERS.indexOf(G.power.type), r1(G.power.life)] : 0,
    ev: NET.events,
  };
  if (NET.lastEpochSent !== G.terrainEpoch) { s.full = encodeTerrain(); NET.lastEpochSent = G.terrainEpoch; }
  else if (G.terrain.log.length) {
    const seen = new Set(), tr = [];
    for (const i of G.terrain.log) if (!seen.has(i)) { seen.add(i); tr.push(i, G.terrain.cells[i]); }
    s.tr = tr;
  }
  G.terrain.log.length = 0;
  NET.events = [];
  return s;
}
function sendSnapshot() {
  const ch = NET.conn && NET.conn.dataChannel;
  if (ch && ch.bufferedAmount > 256 * 1024) return; // la red va lenta: esperar
  NET.send(buildSnapshot());
}
function applySnapshot(s) {
  G.state = s.st; G.paused = !!s.ps; G.stateTimer = s.tm; G.tallyTime = s.tt; G.stage = s.stg; G.stageName = s.nm;
  G.coreAlive = !!s.core; G.stasis = s.sta; G.fortify = s.fo; G.shake = s.sh;
  if (s.bn) { G.bannerText = s.bn[0]; G.bannerTime = s.bn[1]; } else G.bannerTime = 0;
  NET.reserve = s.rv; G.kills = s.k; G.hiScore = s.hi; G.newRecord = !!s.nr; G.overReason = s.or; G.coop = true;
  s.pl.forEach((a, i) => {
    const p = G.players[i];
    p.inGame = !!a[0]; p.alive = !!a[1]; p.x = a[2]; p.y = a[3]; p.dir = a[4]; p.spawnTimer = a[5]; p.shield = a[6];
    p.flash = a[7]; p.tread = a[8]; p.rank = a[9]; p.stun = a[10]; p.lives = a[11]; p.score = a[12];
  });
  G.enemies = s.en.map(a => ({ isPlayer: false, kind: KINDS[a[0]], x: a[1], y: a[2], dir: a[3], hp: a[4], spawnTimer: a[5], flash: a[6], tread: a[7], carrier: !!a[8], alive: true }));
  G.bullets = s.bu.map(a => ({ x: a[0], y: a[1], dir: a[2], owner: a[3] ? G.players[a[3] - 1] : ENEMY_OWNER, power: !!a[4], alive: true }));
  G.power = s.pw ? { x: s.pw[0], y: s.pw[1], type: POWERS[s.pw[2]], life: s.pw[3] } : null;
  if (s.full) { decodeTerrain(s.full); G.terrainEpoch++; computeWater(); }
  else if (s.tr) for (let i = 0; i < s.tr.length; i += 2) G.terrain.set(s.tr[i] % N, (s.tr[i] / N) | 0, s.tr[i + 1]);
  G.terrain.log.length = 0;
  if (s.ev && s.ev.length) applyEvents(s.ev);
}

/* ---------- sala de espera (HTML sobre el lienzo) */
const lobby = { mode: null, el: null };
function lobbyBuild() {
  const el = document.createElement('div');
  el.id = 'lobby';
  el.hidden = true;
  el.innerHTML = `
    <div class="lb-box" role="dialog" aria-modal="true" aria-labelledby="lb-title">
      <h2 id="lb-title">Online co-op</h2>
      <p id="lb-msg" aria-live="polite"></p>
      <div id="lb-code" hidden></div>
      <form id="lb-form" hidden autocomplete="off">
        <label for="lb-input">Room code</label>
        <input id="lb-input" maxlength="5" inputmode="text" autocapitalize="characters" spellcheck="false" placeholder="ABCDE">
        <button type="submit" id="lb-join">Join</button>
      </form>
      <div class="lb-row">
        <button type="button" id="lb-share" hidden>Share invite</button>
        <button type="button" id="lb-copy" hidden>Copy invite link</button>
        <button type="button" id="lb-cancel" class="lb-secondary">Cancel</button>
      </div>
    </div>`;
  document.body.appendChild(el);
  lobby.el = el;
  el.querySelector('#lb-cancel').addEventListener('click', () => lobbyClose(false));
  el.querySelector('#lb-form').addEventListener('submit', e => { e.preventDefault(); goFullscreen(); joinRoom(el.querySelector('#lb-input').value); });
  el.querySelector('#lb-input').addEventListener('input', e => { e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); });
  el.querySelector('#lb-share').addEventListener('click', async () => {
    try { await navigator.share({ title: 'Steel Bastion', text: `Join my Steel Bastion room (code ${NET.code}):`, url: inviteLink(NET.code) }); }
    catch (e) { /* compartir cancelado */ }
  });
  el.querySelector('#lb-copy').addEventListener('click', async () => {
    const link = inviteLink(NET.code);
    try { await navigator.clipboard.writeText(link); lobbySetMsg('Invite link copied! Send it to your friend. Waiting for them to join…'); }
    catch (e) { lobbySetMsg(`Copy this link and send it to your friend: ${link}`); }
  });
  el.addEventListener('pointerdown', e => e.stopPropagation());
}
function lobbyOpen(mode, code) {
  if (!lobby.el) lobbyBuild();
  lobby.mode = mode;
  const el = lobby.el;
  el.hidden = false;
  el.querySelector('#lb-title').textContent = mode === 'host' ? 'Create a room' : 'Join a room';
  el.querySelector('#lb-code').hidden = true;
  el.querySelector('#lb-copy').hidden = true;
  el.querySelector('#lb-share').hidden = true;
  el.querySelector('#lb-form').hidden = mode !== 'join';
  lobbyBusy(false);
  lobbySetMsg(mode === 'join' ? 'Enter the code your friend sent you.' : '');
  resetInputs();
  if (mode === 'join') {
    const inp = el.querySelector('#lb-input');
    inp.value = code || '';
    setTimeout(() => inp.focus(), 0);
    if (code) joinRoom(code);
  }
}
function lobbyShowCode(code) {
  const el = lobby.el;
  const box = el.querySelector('#lb-code');
  box.textContent = code; box.hidden = false;
  el.querySelector('#lb-copy').hidden = false;
  el.querySelector('#lb-share').hidden = !navigator.share;
}
function lobbySetMsg(text, isError) {
  if (!lobby.el) return;
  const m = lobby.el.querySelector('#lb-msg');
  m.textContent = text; m.classList.toggle('lb-error', !!isError);
}
function lobbyBusy(busy) {
  if (!lobby.el) return;
  lobby.el.querySelector('#lb-join').disabled = busy;
  lobby.el.querySelector('#lb-input').disabled = busy;
}
function lobbyClose(connected) {
  if (!lobby.el) return;
  lobby.el.hidden = true;
  lobby.mode = null;
  if (!connected) netCleanup();
  canvas.focus();
}
const lobbyIsOpen = () => !!(lobby.el && !lobby.el.hidden);

/* ============================================================ entrada */
let joyId = -1, fireId = -1;
let held = [];
function resetInputs() { held = []; joyId = -1; fireId = -1; input.releaseAll(); }

const isMenuState = () => G.state === S.TITLE || G.state === S.TALLY || G.state === S.OVER;
function goFullscreen() {
  const el = document.documentElement;
  if (!touchMode || document.fullscreenElement || !el.requestFullscreen) return;
  try { el.requestFullscreen({ navigationUI: 'hide' }).catch(() => {}); } catch (e) { /* no disponible (p. ej. iPhone) */ }
}
function buzz(pattern) { try { if (touchMode && navigator.vibrate) navigator.vibrate(pattern); } catch (e) { /* sin vibración */ } }
function titleChoose(id) {
  sfx.unlock();
  goFullscreen();
  if (id === 'solo') startGame(false);
  else if (id === 'host') hostRoom();
  else if (id === 'join') lobbyOpen('join');
}
function confirm() {
  if (lobbyIsOpen()) return;
  if (G.state === S.TITLE) { titleChoose(TITLE_OPTS[titleSel].id); return; }
  if (NET.role === 'guest') { NET.send({ t: 'c' }); return; }
  hostConfirm();
}
function togglePause() {
  if (NET.role === 'guest') { NET.send({ t: 'p' }); return; }
  if (G.paused) resumeGame(); else pauseGame();
}
function quitGame() { if (NET.role) leaveGame(); else toTitle(); }

function onTap(x, y) {
  if (G.paused) {
    if (inRect(L.resumeRect, x, y)) togglePause();
    else if (inRect(L.quitRect, x, y)) quitGame();
    return;
  }
  if (G.state === S.TITLE) {
    const r = titleRects.find(b => inRect(b, x, y));
    if (r) { titleSel = TITLE_OPTS.findIndex(o => o.id === r.id); titleChoose(r.id); }
    return;
  }
  confirm();
}
function pointerDown(id, x, y) {
  if (G.paused || isMenuState()) { onTap(x, y); return; }
  if (inRect(L.pauseRect, x, y)) { resetInputs(); togglePause(); return; }
  if (x < L.w / 2) { if (joyId < 0) { joyId = id; input.joyStart(x, y); } }
  else if (fireId < 0) { fireId = id; input.fireTouch = true; }
}
function pointerUp(id) {
  if (id === joyId) { joyId = -1; input.joyRelease(); }
  if (id === fireId) { fireId = -1; input.fireTouch = false; }
}
canvas.addEventListener('pointerdown', e => {
  if (lobbyIsOpen()) return;
  e.preventDefault();
  canvas.focus();
  sfx.unlock();
  if (e.pointerType === 'touch') touchMode = true;
  try { canvas.setPointerCapture(e.pointerId); } catch (_) { /* opcional */ }
  pointerDown(e.pointerId, e.clientX * dpr, e.clientY * dpr);
});
canvas.addEventListener('pointermove', e => {
  if (e.pointerId === joyId) input.joyMove(e.clientX * dpr, e.clientY * dpr, L.joyR);
});
canvas.addEventListener('pointerup', e => pointerUp(e.pointerId));
canvas.addEventListener('pointercancel', e => pointerUp(e.pointerId));
canvas.addEventListener('contextmenu', e => e.preventDefault());

const KEYDIR = { ArrowUp: UP, KeyW: UP, ArrowRight: RIGHT, KeyD: RIGHT, ArrowDown: DOWN, KeyS: DOWN, ArrowLeft: LEFT, KeyA: LEFT };
const FIRE_KEYS = new Set(['Space', 'KeyJ', 'KeyK', 'Enter', 'NumpadEnter']);
const PAUSE_KEYS = new Set(['KeyP', 'Escape']);
window.addEventListener('keydown', e => {
  if (lobbyIsOpen()) { if (e.code === 'Escape') lobbyClose(false); return; }
  const d = KEYDIR[e.code];
  if (d !== undefined || FIRE_KEYS.has(e.code) || PAUSE_KEYS.has(e.code) || e.code === 'KeyM' || e.code === 'KeyQ') {
    e.preventDefault();
    sfx.unlock();
    touchMode = false;
  }
  if (G.state === S.TITLE && !G.paused) {
    if (d === UP && !e.repeat) titleSel = (titleSel + TITLE_OPTS.length - 1) % TITLE_OPTS.length;
    else if (d === DOWN && !e.repeat) titleSel = (titleSel + 1) % TITLE_OPTS.length;
    else if (FIRE_KEYS.has(e.code) && !e.repeat) confirm();
    else if (e.code === 'KeyM' && !e.repeat) sfx.toggleMute();
    return;
  }
  if (d !== undefined) { if (!held.includes(d)) held.push(d); input.keyDir = held[held.length - 1]; return; }
  if (FIRE_KEYS.has(e.code)) {
    input.fireKey = true;
    if (!e.repeat && (G.paused || isMenuState())) confirm();
    return;
  }
  if (PAUSE_KEYS.has(e.code) && !e.repeat) { resetInputs(); togglePause(); return; }
  if (e.code === 'KeyQ' && G.paused) { quitGame(); return; }
  if (e.code === 'KeyM' && !e.repeat) sfx.toggleMute();
});
window.addEventListener('keyup', e => {
  const d = KEYDIR[e.code];
  if (d !== undefined) { held = held.filter(v => v !== d); input.keyDir = held.length ? held[held.length - 1] : -1; return; }
  if (FIRE_KEYS.has(e.code)) input.fireKey = false;
});
window.addEventListener('blur', () => { if (!NET.role) autoPause(); else resetInputs(); });
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) return;
  if (NET.role === 'host') { pauseGame(); sendSnapshot(); }
  else if (NET.role === 'guest') { resetInputs(); NET.send({ t: 'i', d: -1, f: false }); NET.sentDir = -1; NET.sentFire = false; }
  else autoPause();
});

let padA = false, padStart = false, padY = 0;
function pollPad() {
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  let gp = null;
  for (const p of pads) if (p && p.connected) { gp = p; break; }
  if (!gp) { input.padDir = -1; input.firePad = false; return; }
  const btn = i => !!(gp.buttons[i] && gp.buttons[i].pressed);
  let x = gp.axes[0] || 0, y = gp.axes[1] || 0;
  if (btn(12)) y = -1; if (btn(13)) y = 1; if (btn(14)) x = -1; if (btn(15)) x = 1;
  const dir = Math.max(Math.abs(x), Math.abs(y)) < 0.45 ? -1 : Math.abs(x) > Math.abs(y) ? (x > 0 ? RIGHT : LEFT) : (y > 0 ? DOWN : UP);
  if (G.state === S.TITLE && !lobbyIsOpen()) {
    const vy = dir === UP ? -1 : dir === DOWN ? 1 : 0;
    if (vy && vy !== padY) titleSel = (titleSel + vy + TITLE_OPTS.length) % TITLE_OPTS.length;
    padY = vy;
    input.padDir = -1;
  } else input.padDir = dir;
  const a = btn(0) || btn(2) || btn(5) || btn(7);
  input.firePad = a && G.state !== S.TITLE;
  if (a && !padA) { sfx.unlock(); touchMode = false; if (G.paused || isMenuState()) confirm(); }
  padA = a;
  const st = btn(9);
  if (st && !padStart && G.state !== S.TITLE) togglePause();
  padStart = st;
}

/* ============================================================ bucle */
const STEP = 1 / 60;
let last = performance.now(), acc = 0;
function netTick(dt) {
  if (!NET.role) return;
  NET.pingTimer -= dt;
  if (NET.pingTimer <= 0) { NET.pingTimer = 2; NET.send({ t: 'ping', ts: performance.now() }); }
  if (NET.role === 'host') {
    NET.snapAcc += dt;
    if (NET.snapAcc >= 1 / 60 - 0.002) { NET.snapAcc = 0; sendSnapshot(); }
  } else {
    const d = input.dir(), f = input.fire();
    if (d !== NET.sentDir || f !== NET.sentFire) { NET.send({ t: 'i', d, f }); NET.sentDir = d; NET.sentFire = f; }
  }
}
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  acc += dt;
  last = now;
  pollPad();
  if (NET.noticeTime > 0) NET.noticeTime -= dt;
  if (NET.role === 'guest') {
    G.time += dt;
    updateFx(dt);
    acc = 0;
  } else {
    let n = 0;
    while (acc >= STEP && n < 5) { update(STEP); acc -= STEP; n++; }
    if (n === 5) acc = 0;
  }
  netTick(dt);
  if (NET.role !== 'host') G.terrain.log.length = 0;
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
canvas.focus();
{
  const m = /^#join-([A-Za-z0-9]{5})$/.exec(location.hash);
  if (m) lobbyOpen('join', m[1].toUpperCase());
}
</script>
