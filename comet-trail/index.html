<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0B0A1A">
<meta name="description" content="Comet Trail: steer a comet, collect stardust and grow your trail. A snake game by Bright Orbit Games.">
<title>Comet Trail</title>
<style>
  html, body { margin: 0; height: 100%; background: #0B0A1A; overflow: hidden; }
  body { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; outline: none; }
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="Comet Trail: snake game"></canvas>
<script>
'use strict';
/* =====================================================================
   Comet Trail — Bright Orbit Games
   Snake on a 20x20 grid. Single file, no dependencies.
   ===================================================================== */

const COLS = 20, ROWS = 20;
const DIRS = { up: { x: 0, y: -1 }, down: { x: 0, y: 1 }, left: { x: -1, y: 0 }, right: { x: 1, y: 0 } };
const MODES = [
  { id: 'classic', label: 'CLASSIC', hint: 'Walls are deadly' },
  { id: 'wrap', label: 'NO WALLS', hint: 'Fly through the edges' },
];
const S = { TITLE: 0, READY: 1, PLAY: 2, OVER: 3 };

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let dpr = 1, W = 0, H = 0;
let touchMode = (navigator.maxTouchPoints || 0) > 0 && window.matchMedia('(pointer: coarse)').matches;

/* ------------------------------------------------------------ storage */
function loadBest() {
  try { const v = JSON.parse(localStorage.getItem('comet-trail-best') || '{}'); return { classic: v.classic | 0, wrap: v.wrap | 0 }; }
  catch (e) { return { classic: 0, wrap: 0 }; }
}
function saveBest() { try { localStorage.setItem('comet-trail-best', JSON.stringify(best)); } catch (e) { /* storage unavailable */ } }

/* ------------------------------------------------------------ sound */
const audio = {
  ctx: null, master: null, muted: false,
  unlock() {
    if (!this.ctx) {
      try {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.master = this.ctx.createGain();
        this.master.gain.value = this.muted ? 0 : 0.5;
        this.master.connect(this.ctx.destination);
      } catch (e) { this.ctx = null; }
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  toggleMute() { this.muted = !this.muted; if (this.master) this.master.gain.value = this.muted ? 0 : 0.5; },
  tone(freq, dur, type = 'sine', vol = 0.3, slideTo = 0, delay = 0) {
    if (!this.ctx) return;
    try {
      const t0 = this.ctx.currentTime + delay;
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t0);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(this.master);
      o.start(t0); o.stop(t0 + dur + 0.02);
    } catch (e) { /* no audio */ }
  },
  noise(dur, vol = 0.3) {
    if (!this.ctx) return;
    try {
      const n = Math.floor(this.ctx.sampleRate * dur), b = this.ctx.createBuffer(1, n, this.ctx.sampleRate), d = b.getChannelData(0);
      let lp = 0;
      for (let i = 0; i < n; i++) { lp += (Math.random() * 2 - 1 - lp) * 0.25; d[i] = lp * Math.exp(-4 * i / n); }
      const s = this.ctx.createBufferSource(), g = this.ctx.createGain();
      s.buffer = b; g.gain.value = vol; s.connect(g); g.connect(this.master); s.start();
    } catch (e) { /* no audio */ }
  },
  eat(combo) { this.tone(520 + Math.min(combo, 12) * 45, 0.09, 'triangle', 0.3, 0, 0); this.tone(780 + Math.min(combo, 12) * 60, 0.08, 'sine', 0.18, 0, 0.04); },
  star() { [660, 880, 1100, 1320].forEach((f, i) => this.tone(f, 0.12, 'triangle', 0.22, 0, i * 0.06)); },
  appear() { this.tone(1200, 0.15, 'sine', 0.12, 1800); },
  crash() { this.noise(0.6, 0.5); this.tone(220, 0.5, 'sawtooth', 0.15, 55); },
  blip() { this.tone(900, 0.05, 'square', 0.08); },
};

/* ------------------------------------------------------------ state */
let state = S.TITLE, paused = false, menuSel = 0, mode = 'classic';
let best = loadBest(), newBest = false;
let snake = [], prev = [], dir = DIRS.right, queue = [];
let stepTime = 0.14, acc = 0, time = 0;
let food = null, star = null, score = 0, eaten = 0, growPending = 0, combo = 0, lastEat = -10;
let particles = [], popups = [], shake = 0, overTime = 0;

const same = (a, b) => a.x === b.x && a.y === b.y;
const opposite = (a, b) => a.x === -b.x && a.y === -b.y;

function freeCell() {
  for (let tries = 0; tries < 500; tries++) {
    const c = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
    if (snake.some(s => same(s, c))) continue;
    if (food && same(food, c)) continue;
    if (star && same(star, c)) continue;
    return c;
  }
  return { x: 0, y: 0 };
}

function newGame(m) {
  mode = m;
  snake = [{ x: 7, y: 10 }, { x: 6, y: 10 }, { x: 5, y: 10 }, { x: 4, y: 10 }];
  prev = snake.map(s => ({ ...s }));
  dir = DIRS.right; queue = [];
  stepTime = 0.14; acc = 0;
  score = 0; eaten = 0; growPending = 0; combo = 0; lastEat = -10;
  star = null; food = null; food = freeCell();
  particles = []; popups = []; newBest = false;
  state = S.READY; paused = false;
  audio.blip();
}

function toTitle() { state = S.TITLE; paused = false; queue = []; }

function pushDir(d) {
  if (state === S.READY) {
    if (opposite(d, dir)) return;
    state = S.PLAY; acc = 0;
  }
  if (state !== S.PLAY || paused) return;
  const last = queue.length ? queue[queue.length - 1] : dir;
  if (same(d, last) || opposite(d, last)) return;
  if (queue.length < 3) queue.push(d);
}

function step() {
  prev = snake.map(s => ({ ...s }));
  if (queue.length) dir = queue.shift();
  const head = snake[0];
  let nx = head.x + dir.x, ny = head.y + dir.y;
  if (mode === 'wrap') { nx = (nx + COLS) % COLS; ny = (ny + ROWS) % ROWS; }
  else if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) { die(); return; }
  const next = { x: nx, y: ny };
  const eatFood = same(next, food);
  const eatStar = star && same(next, star);
  const grow = eatFood || growPending > 0;
  const body = grow ? snake : snake.slice(0, -1);
  if (body.some(s => same(s, next))) { die(); return; }

  snake.unshift(next);
  if (grow) { if (!eatFood) growPending--; } else snake.pop();

  const cx = next.x + 0.5, cy = next.y + 0.5;
  if (eatFood) {
    combo = time - lastEat < 2.2 ? combo + 1 : 0;
    lastEat = time;
    const pts = 10 + combo * 2;
    score += pts; eaten++;
    popups.push({ x: cx, y: cy, text: `+${pts}`, color: '#FFD27A', life: 0.9 });
    burst(cx, cy, 14, ['#FFE7A3', '#FFB86B', '#FF8FB1']);
    audio.eat(combo);
    if (eaten % 4 === 0) stepTime = Math.max(0.062, stepTime * 0.94);
    food = freeCell();
    if (!star && eaten >= 3 && Math.random() < 0.28) { star = { ...freeCell(), life: 6 }; audio.appear(); }
  }
  if (eatStar) {
    score += 50; growPending += 2;
    popups.push({ x: cx, y: cy, text: '+50', color: '#FFE45C', life: 1.1 });
    burst(cx, cy, 26, ['#FFF6B0', '#FFE45C', '#FFFFFF']);
    audio.star();
    star = null;
  }
}

function die() {
  state = S.OVER; overTime = 0; queue = [];
  const h = snake[0];
  burst(h.x + 0.5, h.y + 0.5, 40, ['#FFFFFF', '#9FB4FF', '#C38BFF', '#FF8FB1']);
  shake = 0.5;
  audio.crash();
  if (score > best[mode]) { best[mode] = score; newBest = true; saveBest(); }
}

function burst(x, y, n, colors) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = 2 + Math.random() * 7;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.4 + Math.random() * 0.5, max: 0.9, r: 0.06 + Math.random() * 0.1, color: colors[i % colors.length] });
  }
}

function update(dt) {
  time += dt;
  if (paused) return;
  if (shake > 0) shake = Math.max(0, shake - dt);
  if (state === S.PLAY) {
    acc += dt;
    while (acc >= stepTime && state === S.PLAY) { acc -= stepTime; step(); }
    if (star) { star.life -= dt; if (star.life <= 0) star = null; }
  }
  if (state === S.OVER) overTime += dt;
  const damp = Math.max(0, 1 - 3 * dt);
  for (const p of particles) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= damp; p.vy *= damp; }
  particles = particles.filter(p => p.life > 0);
  for (const p of popups) { p.life -= dt; p.y -= 1.2 * dt; }
  popups = popups.filter(p => p.life > 0);
}

/* ------------------------------------------------------------ layout */
const L = { font: 16, cell: 20, bx: 0, by: 0, size: 400, hudY: 0, pause: {}, buttons: [] };
const sky = [];
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  W = Math.max(1, Math.floor(window.innerWidth * dpr));
  H = Math.max(1, Math.floor(window.innerHeight * dpr));
  canvas.width = W; canvas.height = H;
  L.font = Math.max(12 * dpr, Math.min(W * 0.045, H * 0.035, 26 * dpr));
  const hud = L.font * 3.2, margin = L.font * 0.8;
  const avail = Math.min(W - margin * 2, H - hud - margin * 2);
  L.cell = Math.max(4, Math.floor(avail / COLS));
  L.size = L.cell * COLS;
  L.bx = Math.floor((W - L.size) / 2);
  L.by = Math.floor(hud + (H - hud - L.size) / 2);
  L.hudY = Math.min(hud * 0.62, L.by - L.font * 0.9);
  const ps = L.font * 2;
  L.pause = { x: L.bx, y: L.hudY - ps * 0.68, w: ps, h: ps };
  sky.length = 0;
  const count = Math.floor((W * H) / (9000 * dpr * dpr)) + 40;
  for (let i = 0; i < count; i++) sky.push({ x: Math.random() * W, y: Math.random() * H, r: (Math.random() * 1.2 + 0.3) * dpr, p: Math.random() * 6.28, s: 0.5 + Math.random() * 1.5 });
}
window.addEventListener('resize', resize);
resize();

/* ------------------------------------------------------------ drawing helpers */
const FONT = '"Segoe UI", "Helvetica Neue", Arial, sans-serif';
function text(s, x, y, size, color, align = 'center', weight = 'bold', alpha = 1, spacing = 0) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.font = `${weight} ${size}px ${FONT}`;
  ctx.fillStyle = color;
  ctx.textBaseline = 'middle';
  if (!spacing) { ctx.textAlign = align; ctx.fillText(s, x, y); ctx.restore(); return; }
  const sp = size * spacing, chars = [...s], ws = chars.map(c => ctx.measureText(c).width);
  const total = ws.reduce((a, c) => a + c, 0) + sp * (chars.length - 1);
  let cx = align === 'center' ? x - total / 2 : align === 'right' ? x - total : x;
  ctx.textAlign = 'left';
  chars.forEach((c, i) => { ctx.fillText(c, cx, y); cx += ws[i] + sp; });
  ctx.restore();
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function glowDot(x, y, r, inner, outer) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, inner); g.addColorStop(1, outer);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
}
function lerpColor(a, b, t) {
  const pa = [parseInt(a.slice(1, 3), 16), parseInt(a.slice(3, 5), 16), parseInt(a.slice(5, 7), 16)];
  const pb = [parseInt(b.slice(1, 3), 16), parseInt(b.slice(3, 5), 16), parseInt(b.slice(5, 7), 16)];
  return `rgb(${pa.map((v, i) => Math.round(v + (pb[i] - v) * t)).join(',')})`;
}
function button(id, label, x, y, w, h, color, selected) {
  L.buttons.push({ id, x, y, w, h });
  roundRect(x, y, w, h, h * 0.5);
  ctx.fillStyle = selected ? color : 'rgba(255,255,255,0.08)';
  ctx.fill();
  ctx.lineWidth = Math.max(1.5, dpr * 1.5);
  ctx.strokeStyle = color; ctx.stroke();
  text(label, x + w / 2, y + h / 2 + 1, h * 0.36, selected ? '#1B1236' : '#FFFFFF', 'center', 'bold', 1, 0.08);
}

/* ------------------------------------------------------------ render */
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  L.buttons = [];
  const bg = ctx.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0, '#141238'); bg.addColorStop(1, '#0B0A1A');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  for (const s of sky) {
    ctx.globalAlpha = 0.35 + 0.35 * Math.sin(time * s.s + s.p);
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(s.x, s.y, s.r, s.r);
  }
  ctx.globalAlpha = 1;
  if (state === S.TITLE) { drawTitle(); return; }
  drawBoard();
  drawHud();
  if (state === S.READY && !paused) {
    text(touchMode ? 'Swipe to start' : 'Press an arrow key to start', W / 2, L.by + L.size * 0.68, L.font * 1.05, '#FFFFFF', 'center', 'bold', 0.55 + 0.45 * Math.sin(time * 4));
  }
  if (state === S.OVER) drawOver();
  if (paused) drawPause();
}

function drawBoard() {
  ctx.save();
  if (shake > 0) { const m = shake * L.cell * 0.5; ctx.translate((Math.random() - 0.5) * m, (Math.random() - 0.5) * m); }
  const { bx, by, size, cell } = L;
  roundRect(bx - cell * 0.15, by - cell * 0.15, size + cell * 0.3, size + cell * 0.3, cell * 0.5);
  ctx.fillStyle = 'rgba(20,18,52,0.85)'; ctx.fill();
  ctx.lineWidth = Math.max(2, cell * 0.08);
  if (mode === 'classic') { ctx.strokeStyle = 'rgba(155,140,255,0.9)'; ctx.setLineDash([]); }
  else { ctx.strokeStyle = 'rgba(155,140,255,0.45)'; ctx.setLineDash([cell * 0.35, cell * 0.35]); ctx.lineDashOffset = -time * cell; }
  ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = 'rgba(255,255,255,0.07)';
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    ctx.beginPath(); ctx.arc(bx + (x + 0.5) * cell, by + (y + 0.5) * cell, cell * 0.06, 0, Math.PI * 2); ctx.fill();
  }

  ctx.save();
  ctx.beginPath(); ctx.rect(bx, by, size, size); ctx.clip();
  const P = (gx, gy) => [bx + gx * cell, by + gy * cell];

  // stardust
  if (food) {
    const [fx, fy] = P(food.x + 0.5, food.y + 0.5), pulse = 1 + 0.12 * Math.sin(time * 6);
    glowDot(fx, fy, cell * 0.75 * pulse, 'rgba(255,150,190,0.55)', 'rgba(255,150,190,0)');
    glowDot(fx, fy, cell * 0.28 * pulse, '#FFFFFF', '#FF8FB1');
  }
  // golden star
  if (star && (star.life > 1.5 || ((time * 8) | 0) % 2 === 0)) {
    const [sx, sy] = P(star.x + 0.5, star.y + 0.5);
    glowDot(sx, sy, cell * 0.95, 'rgba(255,228,92,0.5)', 'rgba(255,228,92,0)');
    ctx.save(); ctx.translate(sx, sy); ctx.rotate(time * 1.8);
    ctx.beginPath();
    for (let i = 0; i < 10; i++) { const r = i % 2 ? cell * 0.18 : cell * 0.42, a = i * Math.PI / 5 - Math.PI / 2; i ? ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r) : ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r); }
    ctx.closePath(); ctx.fillStyle = '#FFE45C'; ctx.fill();
    ctx.restore();
    ctx.strokeStyle = 'rgba(255,228,92,0.8)'; ctx.lineWidth = Math.max(1.5, cell * 0.06);
    ctx.beginPath(); ctx.arc(sx, sy, cell * 0.6, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (star.life / 6)); ctx.stroke();
  }

  // comet (snake), interpolated between steps
  const t = state === S.PLAY && !paused ? Math.min(1, acc / stepTime) : (state === S.PLAY ? Math.min(1, acc / stepTime) : 1);
  const pts = snake.map((s, i) => {
    const a = prev[i] || s;
    let dx = s.x - a.x, dy = s.y - a.y;
    if (Math.abs(dx) > 1 || Math.abs(dy) > 1) return { x: s.x + 0.5, y: s.y + 0.5, jump: true };
    return { x: a.x + dx * t + 0.5, y: a.y + dy * t + 0.5 };
  });
  const n = pts.length;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (let i = n - 1; i >= 1; i--) {
    const a = pts[i], b = pts[i - 1];
    const k = i / Math.max(1, n - 1);
    const r = cell * (0.42 - 0.2 * k);
    const color = lerpColor('#9FB4FF', '#764BA2', k);
    if (Math.hypot(a.x - b.x, a.y - b.y) < 1.5) {
      const [ax, ay] = P(a.x, a.y), [bx2, by2] = P(b.x, b.y);
      ctx.strokeStyle = color; ctx.lineWidth = r * 2;
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx2, by2); ctx.stroke();
    }
    const [cx, cy] = P(a.x, a.y);
    ctx.fillStyle = color; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
  }
  if (n) {
    const [hx, hy] = P(pts[0].x, pts[0].y);
    glowDot(hx, hy, cell * 1.1, 'rgba(170,200,255,0.45)', 'rgba(170,200,255,0)');
    glowDot(hx, hy, cell * 0.46, '#FFFFFF', '#B9C8FF');
    const ex = dir.x, ey = dir.y, px = -ey, py = ex;
    ctx.fillStyle = '#241A4A';
    for (const sgn of [-1, 1]) {
      ctx.beginPath();
      ctx.arc(hx + (ex * 0.14 + px * 0.17 * sgn) * cell, hy + (ey * 0.14 + py * 0.17 * sgn) * cell, cell * 0.075, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  for (const p of particles) {
    const [x, y] = P(p.x, p.y);
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(x, y, p.r * cell, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (const p of popups) {
    const [x, y] = P(p.x, p.y);
    text(p.text, x, y - cell * 0.6, cell * 0.6, p.color, 'center', 'bold', Math.min(1, p.life / 0.3));
  }
  ctx.restore();
  ctx.restore();
}

function drawHud() {
  const f = L.font, y = L.hudY, p = L.pause;
  roundRect(p.x, p.y, p.w, p.h, p.h / 2);
  ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fill();
  ctx.fillStyle = '#FFFFFF';
  const bw = p.w * 0.1, bh = p.h * 0.36;
  ctx.fillRect(p.x + p.w / 2 - bw * 2, p.y + p.h / 2 - bh / 2, bw, bh);
  ctx.fillRect(p.x + p.w / 2 + bw, p.y + p.h / 2 - bh / 2, bw, bh);
  L.buttons.push({ id: 'pause', x: p.x, y: p.y, w: p.w, h: p.h });

  text('SCORE', W / 2, y - f * 0.55, f * 0.6, '#A9A3D6', 'center', 'bold', 1, 0.15);
  text(String(score), W / 2, y + f * 0.45, f * 1.3, '#FFFFFF');
  const rx = L.bx + L.size;
  text(`BEST ${best[mode]}`, rx, y - f * 0.35, f * 0.72, '#FFD27A', 'right');
  text(mode === 'classic' ? 'CLASSIC' : 'NO WALLS', rx, y + f * 0.55, f * 0.6, '#A9A3D6', 'right', 'bold', 1, 0.12);
}

function panel(h) {
  const w = Math.min(L.size * 0.86, L.font * 20), x = (W - w) / 2, y = L.by + (L.size - h) / 2;
  roundRect(x, y, w, h, L.font);
  ctx.fillStyle = 'rgba(14,12,36,0.92)'; ctx.fill();
  ctx.strokeStyle = 'rgba(155,140,255,0.6)'; ctx.lineWidth = Math.max(1.5, dpr * 1.5); ctx.stroke();
  return { x, y, w, h };
}

function drawOver() {
  const f = L.font, a = Math.min(1, overTime / 0.5);
  ctx.globalAlpha = a;
  const pn = panel(f * 13.5);
  let y = pn.y + f * 2;
  text('GAME OVER', W / 2, y, f * 1.9, '#FF8FB1', 'center', 'bold', a, 0.12);
  y += f * 2.4;
  text('SCORE', W / 2, y, f * 0.65, '#A9A3D6', 'center', 'bold', a, 0.15);
  y += f * 1.3;
  text(String(score), W / 2, y, f * 2.2, '#FFFFFF', 'center', 'bold', a);
  y += f * 1.7;
  if (newBest) text('NEW BEST!', W / 2, y, f * 0.95, '#FFE45C', 'center', 'bold', a * (0.6 + 0.4 * Math.sin(time * 6)));
  else text(`Best: ${best[mode]}`, W / 2, y, f * 0.85, '#FFD27A', 'center', 'bold', a);
  y += f * 1.6;
  const bh = f * 2.3, bw = (pn.w - f * 2.5) / 2;
  button('again', 'PLAY AGAIN', pn.x + f, y, bw, bh, '#9FB4FF', menuSel === 0);
  button('menu', 'MENU', pn.x + f * 1.5 + bw, y, bw, bh, '#C38BFF', menuSel === 1);
  ctx.globalAlpha = 1;
}

function drawPause() {
  ctx.fillStyle = 'rgba(5,4,15,0.6)'; ctx.fillRect(0, 0, W, H);
  const f = L.font, pn = panel(f * 9.5);
  text('PAUSED', W / 2, pn.y + f * 2, f * 1.9, '#FFFFFF', 'center', 'bold', 1, 0.2);
  const bh = f * 2.3, bw = (pn.w - f * 2.5) / 2, y = pn.y + f * 4.6;
  button('resume', 'RESUME', pn.x + f, y, bw, bh, '#9FB4FF', menuSel === 0);
  button('menu', 'MENU', pn.x + f * 1.5 + bw, y, bw, bh, '#C38BFF', menuSel === 1);
}

function drawTitle() {
  const u = Math.min(W, H * 1.2), cx = W / 2;
  // decorative comet orbiting the title
  const ox = cx, oy = H * 0.3, rx = Math.min(W * 0.36, u * 0.42), ry = u * 0.12;
  for (let i = 18; i >= 0; i--) {
    const a = time * 1.1 - i * 0.07;
    const x = ox + Math.cos(a) * rx, y = oy + Math.sin(a) * ry;
    const k = i / 18;
    ctx.globalAlpha = 1 - k * 0.85;
    ctx.fillStyle = lerpColor('#9FB4FF', '#764BA2', k);
    ctx.beginPath(); ctx.arc(x, y, u * (0.022 - 0.012 * k), 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  const ha = time * 1.1;
  glowDot(ox + Math.cos(ha) * rx, oy + Math.sin(ha) * ry, u * 0.05, 'rgba(255,255,255,0.95)', 'rgba(170,200,255,0)');

  text('COMET', cx, H * 0.26, u * 0.12, '#FFFFFF', 'center', '900', 1, 0.1);
  text('TRAIL', cx, H * 0.36, u * 0.07, '#FFD27A', 'center', 'bold', 1, 0.5);
  text('Collect stardust. Grow your trail. Don’t hit yourself.', cx, H * 0.45, Math.max(L.font * 0.8, u * 0.022), '#C9C3F0', 'center', 'normal');

  const bw = Math.min(W * 0.36, L.font * 11), bh = L.font * 2.6, gap = L.font, y = H * 0.54;
  const total = bw * 2 + gap, x0 = cx - total / 2;
  MODES.forEach((m, i) => {
    const x = x0 + i * (bw + gap);
    button(m.id, m.label, x, y, bw, bh, i === 0 ? '#9FB4FF' : '#C38BFF', menuSel === i);
    text(m.hint, x + bw / 2, y + bh + L.font * 0.9, L.font * 0.7, '#A9A3D6', 'center', 'normal');
    text(`Best ${best[m.id]}`, x + bw / 2, y + bh + L.font * 2, L.font * 0.72, '#FFD27A');
  });
  const hint = touchMode
    ? 'Tap a mode to play  ·  Swipe to steer'
    : 'Arrows / WASD to steer  ·  Enter to play  ·  P pause  ·  M sound';
  text(hint, cx, H * 0.9, L.font * 0.75, '#8E88BF', 'center', 'normal');
  text('BRIGHT ORBIT GAMES', cx, H * 0.95, L.font * 0.6, '#5F5A8C', 'center', 'bold', 1, 0.25);
}

/* ------------------------------------------------------------ input */
function hit(x, y) {
  for (let i = L.buttons.length - 1; i >= 0; i--) {
    const b = L.buttons[i];
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.id;
  }
  return null;
}
function action(id) {
  if (!id) return false;
  audio.unlock();
  switch (id) {
    case 'classic': case 'wrap': newGame(id); return true;
    case 'again': newGame(mode); return true;
    case 'menu': toTitle(); menuSel = mode === 'classic' ? 0 : 1; return true;
    case 'resume': paused = false; audio.blip(); return true;
    case 'pause': if (state === S.READY || state === S.PLAY) { paused = true; menuSel = 0; audio.blip(); } return true;
  }
  return false;
}
function confirmKey() {
  if (state === S.TITLE) { newGame(MODES[menuSel].id); return; }
  if (paused) { action(menuSel === 0 ? 'resume' : 'menu'); return; }
  if (state === S.OVER && overTime > 0.4) action(menuSel === 0 ? 'again' : 'menu');
}
function togglePause() {
  if (paused) { paused = false; audio.blip(); }
  else if (state === S.READY || state === S.PLAY) { paused = true; menuSel = 0; audio.blip(); }
}
function autoPause() { if (state === S.PLAY) { paused = true; menuSel = 0; } }

const KEYS = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right' };
window.addEventListener('keydown', e => {
  const k = KEYS[e.code];
  const handled = k || ['Enter', 'NumpadEnter', 'Space', 'KeyP', 'Escape', 'KeyM'].includes(e.code);
  if (!handled) return;
  e.preventDefault();
  audio.unlock();
  touchMode = false;
  if (k) {
    const menu = state === S.TITLE || paused || state === S.OVER;
    if (menu) {
      if (k === 'left' || k === 'up') menuSel = 0;
      if (k === 'right' || k === 'down') menuSel = 1;
      return;
    }
    pushDir(DIRS[k]);
    return;
  }
  if (e.repeat) return;
  if (e.code === 'Enter' || e.code === 'NumpadEnter') confirmKey();
  else if (e.code === 'Space') { if (state === S.PLAY || state === S.READY) togglePause(); else confirmKey(); }
  else if (e.code === 'KeyP' || e.code === 'Escape') { if (state === S.TITLE) return; togglePause(); }
  else if (e.code === 'KeyM') audio.toggleMute();
});

let swipe = null;
canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  canvas.focus();
  audio.unlock();
  if (e.pointerType === 'touch') touchMode = true;
  const x = e.clientX * dpr, y = e.clientY * dpr;
  const id = hit(x, y);
  if (id && (state !== S.OVER || overTime > 0.4 || id === 'pause')) { action(id); swipe = null; return; }
  swipe = { id: e.pointerId, x, y };
  try { canvas.setPointerCapture(e.pointerId); } catch (_) { /* optional */ }
});
canvas.addEventListener('pointermove', e => {
  if (!swipe || e.pointerId !== swipe.id) return;
  const x = e.clientX * dpr, y = e.clientY * dpr, dx = x - swipe.x, dy = y - swipe.y;
  const th = Math.max(16 * dpr, L.cell * 0.55);
  if (Math.hypot(dx, dy) < th) return;
  const d = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
  pushDir(DIRS[d]);
  swipe.x = x; swipe.y = y;
});
const endSwipe = e => { if (swipe && e.pointerId === swipe.id) swipe = null; };
canvas.addEventListener('pointerup', endSwipe);
canvas.addEventListener('pointercancel', endSwipe);
canvas.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('blur', autoPause);
document.addEventListener('visibilitychange', () => { if (document.hidden) autoPause(); });

let padPrev = {};
function pollPad() {
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  let gp = null;
  for (const p of pads) if (p && p.connected) { gp = p; break; }
  if (!gp) return;
  const btn = i => !!(gp.buttons[i] && gp.buttons[i].pressed);
  const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
  const now = {
    up: btn(12) || ay < -0.6, down: btn(13) || ay > 0.6, left: btn(14) || ax < -0.6, right: btn(15) || ax > 0.6,
    a: btn(0), start: btn(9),
  };
  for (const k of ['up', 'down', 'left', 'right']) {
    if (now[k] && !padPrev[k]) {
      touchMode = false;
      if (state === S.TITLE || paused || state === S.OVER) menuSel = (k === 'left' || k === 'up') ? 0 : 1;
      else pushDir(DIRS[k]);
    }
  }
  if (now.a && !padPrev.a) { audio.unlock(); confirmKey(); }
  if (now.start && !padPrev.start) togglePause();
  padPrev = now;
}

/* ------------------------------------------------------------ loop */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  pollPad();
  update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
canvas.focus();
</script>
</body>
</html>
