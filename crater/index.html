<meta name="description" content="Crater: turn-based artillery with destructible terrain. Play against the CPU, with friends on one device or online.">

<title>Crater</title>
<style>

  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }

        background: linear-gradient(180deg, rgba(6, 9, 16, .25), rgba(6, 9, 16, .7)); }
  #ov.dim { background: rgba(6, 9, 16, .62); }
  #ov[hidden], #ov [hidden] { display: none !important; }
  .panel { width: min(31rem, 100%); margin: auto; box-sizing: border-box; background: rgba(16, 21, 32, .93);
           border: 1px solid rgba(255, 255, 255, .1); border-radius: 18px; padding: 1.4rem 1.5rem;
           box-shadow: 0 24px 70px rgba(0, 0, 0, .55); text-align: center; touch-action: auto; user-select: text; -webkit-user-select: text; }
  .logo { font-weight: 900; font-size: clamp(2.6rem, 10vw, 4.4rem); letter-spacing: .12em; line-height: 1.05; margin: .2rem 0 .4rem;
          background: linear-gradient(180deg, #FFE29A, #FF8A3D 55%, #D9452B); -webkit-background-clip: text; background-clip: text; color: transparent;
          filter: drop-shadow(0 4px 0 rgba(0, 0, 0, .35)); }
  .tag { color: #AEB8C8; margin: 0 0 1.3rem; line-height: 1.45; }
  h2 { margin: 0 0 1rem; font-size: 1.3rem; letter-spacing: .06em; text-transform: uppercase; color: #FFB25B; }
  .btns { display: grid; gap: .65rem; }
  .row { display: flex; gap: .6rem; justify-content: center; flex-wrap: wrap; margin-top: 1rem; }
  button { font: inherit; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: .92rem; cursor: pointer;
           padding: .8rem 1.3rem; border-radius: 12px; border: 1px solid rgba(255, 255, 255, .16); background: rgba(255, 255, 255, .06); color: #EEF2F8; }
  button:hover { background: rgba(255, 255, 255, .12); }
  button.pri { background: linear-gradient(180deg, #FF9F43, #E8622C); border-color: #FFB46B; color: #1A0E05; }
  button.pri:hover { filter: brightness(1.08); }
  button.ghost { background: transparent; }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid #7FD4FF; outline-offset: 2px; }
  .slots { display: grid; gap: .5rem; margin-bottom: .8rem; text-align: left; }
  .slot { display: flex; align-items: center; gap: .55rem; background: rgba(255, 255, 255, .04); border-radius: 12px; padding: .45rem .6rem; min-height: 2.4rem; }
  .sw { width: 1.1rem; height: 1.1rem; border-radius: 50%; flex: none; box-shadow: 0 0 0 2px rgba(0, 0, 0, .35) inset; }
  input, select { font: inherit; color: #EEF2F8; background: #0B0F18; border: 1px solid rgba(255, 255, 255, .15); border-radius: 9px; padding: .5rem .6rem; min-width: 0; }
  .slot input { flex: 1; }
  .slot select { flex: none; max-width: 48%; }
  .slot .nm { flex: 1; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .slot .nm.dim { color: #8E9AB0; font-weight: 500; font-style: italic; }
  .badge { font-size: .7rem; color: #9FB0C6; text-transform: uppercase; letter-spacing: .08em; border: 1px solid rgba(255, 255, 255, .15); border-radius: 99px; padding: .15rem .5rem; }
  .field { display: grid; gap: .4rem; margin: .7rem 0; text-align: left; font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; color: #93A0B4; }

  th { font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: #8E9AB0; font-weight: 600; padding: .3rem; }

</head>
<body>
<canvas id="c" tabindex="0" aria-label="Crater"></canvas>
<div id="ov">
  <section class="panel" id="s-title">
    <div class="logo" data-t="title"></div>
    <p class="tag" data-t="tagline"></p>
    <div class="btns">
      <button class="pri" data-go="setup" data-t="local_match"></button>
      <button data-go="host" data-t="create_room"></button>
      <button data-go="join" data-t="join_room"></button>
      <button class="ghost" data-go="help" data-t="how_to_play"></button>
    </div>
    <p class="notice" id="title-notice" role="status"></p>
    <p class="foot" data-t="foot"></p>
  </section>

  <section class="panel" id="s-setup" hidden>
    <h2 data-t="local_match"></h2>
    <div class="slots" id="setup-slots"></div>
    <div class="field"><span data-t="rounds"></span><div class="seg" id="setup-rounds"></div></div>
    <p class="msg err" id="setup-err"></p>
    <div class="row"><button class="ghost" data-go="title" data-t="back"></button><button class="pri" id="setup-start" data-t="start"></button></div>
  </section>

  <section class="panel" id="s-help" hidden>
    <h2 data-t="how_to_play"></h2>
    <div class="help" id="help-body"></div>
    <div class="row"><button class="pri" data-go="title" data-t="back"></button></div>
  </section>

  <section class="panel" id="s-room" hidden>
    <h2 id="room-title"></h2>
    <label class="field" id="room-name-f"><span data-t="your_name"></span><input id="room-name" maxlength="14" autocomplete="off" spellcheck="false"></label>
    <div id="room-codebox" hidden>
      <div class="field"><span data-t="room_code"></span></div>
      <div id="room-code"></div>
      <div class="row"><button id="room-copy" data-t="copy_link"></button><button id="room-share" data-t="share" hidden></button></div>
    </div>
    <form id="join-form" hidden autocomplete="off">
      <label class="field"><span data-t="room_code"></span><input id="join-code" maxlength="5" inputmode="text" autocapitalize="characters" spellcheck="false" placeholder="ABCDE"></label>
      <button class="pri" type="submit" id="join-btn" data-t="join"></button>
    </form>
    <p class="msg" id="room-msg" role="status" aria-live="polite"></p>
    <div class="slots" id="room-slots"></div>
    <div class="field" id="room-rounds-f" hidden><span data-t="rounds"></span><div class="seg" id="room-rounds"></div></div>
    <div class="row"><button class="ghost" id="room-cancel" data-t="leave"></button><button class="pri" id="room-start" data-t="start" hidden></button></div>
  </section>

  <section class="panel" id="s-pause" hidden>
    <h2 id="pause-title"></h2>
    <div class="btns"><button class="pri" id="pause-resume"></button><button class="ghost" id="pause-quit"></button></div>
  </section>

  <section class="panel" id="s-results" hidden>
    <h2 id="res-title"></h2>
    <p class="tag" id="res-sub"></p>
    <table id="res-table"></table>
    <p class="msg" id="res-wait"></p>
    <div class="row"><button class="ghost" id="res-menu"></button><button class="pri" id="res-next"></button></div>
  </section>
</div>

/* ============================================================ red (online)
   El anfitrión simula; los invitados envían controles y dibujan lo que reciben.
   Conexión directa entre navegadores (WebRTC) mediante PeerJS. */
const PEERJS_URL = 'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';
const PEER_PREFIX = 'brightorbit-crater-';

  role: null, peer: null, conn: null, code: '', guests: [], events: [], snapAcc: 0, lastMk: -1, joinTimer: 0,
  mySlot: -1, aim: null, aimSeq: -1, fired: false, move: 0, ammo: null, lastIn: '', sendT: 0, lobby: null, ui: null,

};
const LOBBY = { slots: [], tw: 2 };

function broadcast(msg) {
  for (const g of NET.guests) {
    const ch2 = g.conn && g.conn.dataChannel;
    if (msg.t === 's' && !msg.mk && !(msg.ev && msg.ev.length) && ch2 && ch2.bufferedAmount > 256 * 1024) continue;
    sendTo(g.conn, msg);
  }
}

}

const inviteLink = code => `${location.origin}${location.pathname}#join-${code}`;
function netErrorText(err) {
  switch (err && err.type) {
    case 'peer-unavailable': return tr('not_found');
    case 'network': case 'server-error': case 'socket-error': case 'socket-closed': return tr('net_err');
    case 'browser-incompatible': return tr('browser_inc');

  }
}
function netShutdown(sendQuit) {
  const peer = NET.peer, conns = NET.role === 'host' ? NET.guests.map(g => g.conn) : [NET.conn];
  if (sendQuit) for (const c of conns) sendTo(c, { t: 'q' });
  clearTimeout(NET.joinTimer);
  NET.peer = null; NET.conn = null; NET.guests = []; NET.role = null; NET.events = []; NET.aim = null; NET.mySlot = -1;
  NET.fired = false; NET.lobby = null; NET.ammo = null; NET.aimSeq = -1;
  setTimeout(() => {
    for (const c of conns) { try { if (c) c.close(); } catch (e) { /* ya cerrada */ } }
    try { if (peer) peer.destroy(); } catch (e) { /* ya cerrado */ }
  }, sendQuit ? 300 : 0);
}

}

}

$('room-name').addEventListener('input', () => {
  try { localStorage.setItem('crater-name', cleanName($('room-name').value)); } catch (e) { /* nada */ }
  if (NET.role === 'host') { broadcastLobby(false); renderRoom(); }
});
function roomMsg(text, err) { const m = $('room-msg'); m.textContent = text; m.classList.toggle('err', !!err); }
function roomMode(mode) {

function slotRow(color, nameText, badge, dim) {

  box.innerHTML = '';

    LOBBY.slots.forEach((s, i) => {
      if (s.ty === 'host') { box.appendChild(slotRow(COLORS[i], myName(), tr('host'))); return; }

      const row = slotRow(COLORS[i], s.ty === 'open' ? tr('waiting_seat') : s.ty.startsWith('cpu') ? tr('cpu_n', i + 1) : '—', '', s.ty !== 'open' && !s.ty.startsWith('cpu') ? true : s.ty === 'open');

/* ---------- anfitrión */
function openHostRoom() {
  netShutdown(false);
  LOBBY.slots = [{ ty: 'host' }, { ty: 'open' }, { ty: 'closed' }, { ty: 'closed' }];
  LOBBY.tw = setup.tw || 2;
  roomMode('host');
  show('s-room');
  renderRoom();
  hostRoom(0);
}
async function hostRoom(attempt) {
  roomMsg(tr('creating'));
  try { await loadPeerJS(); } catch (e) { roomMsg(tr('peer_load'), true); return; }
  if (!ovIs('s-room') || NET.ui !== 'host') return;
  if (NET.peer) { try { NET.peer.destroy(); } catch (e) { /* nada */ } }
  const code = makeCode();
  const peer = new Peer(PEER_PREFIX + code, { debug: 0 });
  NET.peer = peer; NET.code = code; NET.role = 'host'; NET.guests = [];
  peer.on('open', () => {
    if (NET.peer !== peer) return;
    $('room-code').textContent = code;
    $('room-codebox').hidden = false;
    $('room-share').hidden = !navigator.share;
    roomMsg(tr('share_code'));
    renderRoom();
  });
  peer.on('connection', conn => {
    conn.on('data', m => { if (NET.peer === peer) hostOnMsg(conn, m); });
    conn.on('close', () => { if (NET.peer === peer) hostOnClose(conn); });
    conn.on('error', () => { if (NET.peer === peer) hostOnClose(conn); });
  });
  peer.on('disconnected', () => { if (NET.peer === peer) { try { peer.reconnect(); } catch (e) { /* nada */ } } });
  peer.on('error', err => {
    if (NET.peer !== peer) return;
    if (err.type === 'unavailable-id' && attempt < 3) { hostRoom(attempt + 1); return; }
    if (NET.guests.length) return;
    if (ovIs('s-room')) roomMsg(netErrorText(err), true);
  });
}
function hostOnMsg(conn, m) {
  if (!m || typeof m !== 'object') return;
  const g = NET.guests.find(q => q.conn === conn);
  switch (m.t) {
    case 'hello': {
      if (g) return;
      if (G.screen === 'play') { sendTo(conn, { t: 'busy' }); setTimeout(() => { try { conn.close(); } catch (e) { /* nada */ } }, 500); return; }
      const ls = LOBBY.slots.findIndex(s => s.ty === 'open');
      if (ls < 0) { sendTo(conn, { t: 'full' }); setTimeout(() => { try { conn.close(); } catch (e) { /* nada */ } }, 500); return; }
      const nm = cleanName(m.nm) || tr('gunner');
      LOBBY.slots[ls] = { ty: 'guest', nm, conn };
      NET.guests.push({ conn, nm, ls, pi: -1 });
      broadcastLobby(false);
      if (ovIs('s-room')) { renderRoom(); roomMsg(tr('guest_joined', nm) + ' ' + tr('waiting_guests')); }
      sfx.play(SFX.TURN, 0.6);
      break; }
    case 'in': {
      if (!g || G.screen !== 'play' || G.phase !== 'aim' || G.turn !== g.pi) return;
      const t = cur();
      t.angle = clamp(+m.a || 0, 0, 180); t.power = clamp(+m.p || 1, 1, 100);
      const w = m.w | 0;
      if (w >= 0 && w < N_WEAPONS && t.ammo[w] !== 0) t.weapon = w;
      t.netMove = clamp(m.m | 0, -1, 1);
      break; }
    case 'fire': {
      if (!g || G.screen !== 'play' || G.phase !== 'aim' || G.turn !== g.pi) return;
      const t = cur();
      t.angle = clamp(+m.a || 0, 0, 180); t.power = clamp(+m.p || 1, 1, 100);
      const w = m.w | 0;
      if (w >= 0 && w < N_WEAPONS && t.ammo[w] !== 0) t.weapon = w;
      fire(t);
      break; }
    case 'q': hostOnClose(conn); break;
  }
}
function hostOnClose(conn) {

  if (LOBBY.slots[g.ls] && LOBBY.slots[g.ls].conn === conn) LOBBY.slots[g.ls] = { ty: 'open' };
  if (G.screen === 'play' && g.pi >= 0 && G.players[g.pi]) {
    const p = G.players[g.pi];
    p.ctrl = 'cpu'; p.diff = 1; p.ai = null; p.netMove = 0;
    E(['n', 'guest_left', p.name]);
  }

  if (ovIs('s-room') && NET.ui === 'host') renderRoom();
  try { conn.close(); } catch (e) { /* nada */ }
}
function startOnline() {
  if (NET.role !== 'host') return;
  const ps = [];
  NET.guests.forEach(g => { g.pi = -1; });
  LOBBY.slots.forEach((s, i) => {
    if (s.ty === 'host') ps.push(makePlayer(ps.length, myName(), i, 'human', 1));
    else if (s.ty === 'guest') {
      const g = NET.guests.find(q => q.conn === s.conn);

  for (const g of NET.guests) if (g.pi >= 0) sendTo(g.conn, { t: 'start', you: g.pi, tw: LOBBY.tw, pl });

/* ---------- invitado */
function openJoin(code) {

$('join-code').addEventListener('input', e => { e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); });

function joinBusy(b) { $('join-btn').disabled = b; $('join-code').disabled = b; }
async function joinRoom(raw) {

  if (code.length !== 5) { roomMsg(tr('enter_code'), true); return; }
  try { localStorage.setItem('crater-name', cleanName($('room-name').value)); } catch (e) { /* nada */ }
  roomMsg(tr('connecting'));
  joinBusy(true);
  try { await loadPeerJS(); } catch (e) { joinBusy(false); roomMsg(tr('peer_load'), true); return; }
  if (!ovIs('s-room') || NET.ui !== 'join') return;
  netShutdown(false);
  const peer = new Peer({ debug: 0 });
  NET.peer = peer;
  peer.on('open', () => {
    if (NET.peer !== peer) return;
    const conn = peer.connect(PEER_PREFIX + code, { reliable: true, serialization: 'json' });
    NET.conn = conn;
    conn.on('open', () => {
      if (NET.conn !== conn) return;
      clearTimeout(NET.joinTimer);
      NET.role = 'guest';
      conn.send({ t: 'hello', nm: myName() });
      roomMode('guest');

      if (location.hash) history.replaceState(null, '', location.pathname + location.search);
    });
    conn.on('data', m => { if (NET.conn === conn) guestOnMsg(m); });
    conn.on('close', () => guestClosed(conn));
    conn.on('error', () => guestClosed(conn));
    NET.joinTimer = setTimeout(() => {
      if (NET.role || NET.peer !== peer) return;
      netShutdown(false);
      joinBusy(false);
      roomMsg(tr('no_direct'), true);
    }, 15000);
  });

function guestClosed(conn, key) {

  netShutdown(false);
  if (!was) { joinBusy(false); if (ovIs('s-room')) roomMsg(tr('generic_err'), true); return; }
  G.mode = 'local';
  toTitle(tr(key || 'conn_lost'));
}
function guestOnMsg(m) {
  if (!m || typeof m !== 'object') return;
  switch (m.t) {
    case 'lobby':

      if (m.back || G.screen === 'play') { setScreen('menu'); G.players = []; roomMode('guest'); roomMsg(tr('connected_wait')); show('s-room'); }
      if (ovIs('s-room')) renderRoom();
      break;
    case 'full': case 'busy': {
      const conn = NET.conn;
      netShutdown(false);
      joinBusy(false);
      roomMode('join');
      roomMsg(tr(m.t === 'full' ? 'room_full' : 'room_busy'), true);
      void conn;
      break; }
    case 'start':
      G.players = (m.pl || []).map((a, i) => makePlayer(i, cleanName(a[0]) || '?', clamp(a[1] | 0, 0, 3), a[2] ? 'cpu' : 'human', 1));
      NET.mySlot = m.you | 0; G.toWin = m.tw | 0 || 2; G.mode = 'online'; G.matchOver = false; G.round = 0;
      NET.aim = null; NET.aimSeq = -1; NET.fired = false;
      break;
    case 'round':
      if (!G.players.length) return;
      G.round = m.n | 0;
      setTheme(clamp(m.th | 0, 0, THEMES.length - 1));
      decodeMask(m.mk, true);
      buildBackground(T.theme, m.vs | 0);
      initAmbient();
      (m.w || []).forEach((w, i) => { if (G.players[i]) G.players[i].wins = w | 0; });
      for (const p of G.players) { p.trail = []; p.alive = true; p.hp = 100; p.ammo = KIND.slice(0, N_WEAPONS).map(k => k.ammo); }
      G.projectiles = []; G.particles = []; G.popups = []; G.banner = null; G.phase = 'intro'; G.resultsShown = false; G.paused = false;
      NET.aim = null; NET.aimSeq = -1; NET.fired = false;
      setScreen('play');
      hideOv();
      break;
    case 's': applySnapshot(m); break;
    case 'res':
      (m.st || []).forEach((a, i) => { const p = G.players[i]; if (p) { p.wins = a[0] | 0; p.dmg = a[1] | 0; p.kills = a[2] | 0; } });
      G.roundWinner = m.w | 0; G.matchOver = !!m.o; G.round = m.rn | 0; G.resultsShown = true;
      showResultsUI();
      break;
    case 'q': guestClosed(NET.conn, 'host_left'); break;
  }
}
function applySnapshot(s) {
  if (G.screen !== 'play' || !G.players.length) return;
  G.phase = s.ph; G.turn = s.tu | 0; G.timer = +s.tm || 0; G.wind = s.wd | 0;
  (s.tk || []).forEach((a, i) => {
    const p = G.players[i];
    if (!p) return;
    p.x = a[0]; p.y = a[1]; p.angle = a[2]; p.power = a[3]; p.hp = a[4]; p.alive = !!a[5]; p.weapon = a[6]; p.fuel = a[7]; p.falling = !!a[8];
  });
  G.projectiles = (s.pr || []).map(a => ({ x: a[0], y: a[1], k: clamp(a[2] | 0, 0, KIND.length - 1), main: !!a[3] }));
  NET.ammo = s.am;
  if (s.ev) for (const e of s.ev) applyEvent(e);
  if (s.mk) decodeMask(s.mk, false);
  if (G.phase === 'aim' && G.turn === NET.mySlot) {
    if (NET.aimSeq !== s.sq) {
      const p = G.players[NET.mySlot];
      NET.aim = { angle: p.angle, power: p.power, weapon: p.weapon };
      NET.aimSeq = s.sq; NET.fired = false; NET.move = 0; NET.lastIn = '';
    }
  } else NET.aim = null;
}
function buildSnapshot() {
  const s = {
    t: 's', ph: G.phase, tu: G.turn, tm: r1(G.timer), wd: G.wind, sq: G.turnSeq,
    tk: G.players.map(p => [r1(p.x), r1(p.y), r1(p.angle), r1(p.power), p.hp, p.alive ? 1 : 0, p.weapon, Math.round(p.fuel), p.falling ? 1 : 0]),
    pr: G.projectiles.map(p => [r1(p.x), r1(p.y), p.k, p.main ? 1 : 0]),
    am: cur() ? cur().ammo : [], ev: NET.events,
  };
  if (NET.lastMk !== G.turnSeq) { s.mk = encodeMask(); NET.lastMk = G.turnSeq; }
  NET.events = [];
  return s;
}
function netTick(dt) {
  if (NET.role === 'host') {
    if (G.screen !== 'play' || !NET.guests.length) { NET.events = []; return; }
    NET.snapAcc += dt;
    const rate = G.phase === 'flight' || G.players.some(p => p.falling) ? 1 / 60 : 1 / 20;
    if (NET.snapAcc >= rate - 0.002) { NET.snapAcc = 0; broadcast(buildSnapshot()); }
  } else if (NET.role === 'guest' && canControl()) {
    NET.sendT -= dt;
    const a = NET.aim, key = [Math.round(a.angle * 10), Math.round(a.power * 10), a.weapon, NET.move].join();
    if (key !== NET.lastIn && NET.sendT <= 0) {
      NET.lastIn = key; NET.sendT = 0.05;
      NET.send({ t: 'in', a: r1(a.angle), p: r1(a.power), w: a.weapon, m: NET.move });
    }
  }
}

/* ============================================================ bucle */
const STEP = 1 / 60;
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  pollPad();
  if (NET.role === 'guest') {
    G.time += dt;
    if (G.screen === 'play') controlStep(dt);
    updateFx(dt);
    acc = 0;
  } else {
    acc += dt;
    let n = 0;
    while (acc >= STEP && n < 6) { update(STEP); acc -= STEP; n++; }
    if (n === 6) acc = 0;
  }
  netTick(dt);
  render();
  requestAnimationFrame(frame);
}
window.addEventListener('resize', resize);
resize();
{
  const th = randInt(0, THEMES.length - 1);
  setTheme(th); G.lastTheme = th;
  genTerrain(T.theme, 0);
  buildBackground(T.theme, randInt(1, 1e9));
  initAmbient();
  G.wind = T.theme.windMax ? randInt(-4, 4) : 0;
}
show('s-title');
{
  const m = /^#join-([A-Za-z0-9]{5})$/.exec(location.hash);
  if (m) openJoin(m[1].toUpperCase());
}
requestAnimationFrame(frame);
</script>
